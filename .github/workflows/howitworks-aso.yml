name: How It Works ASO 조사

# How It Works 앱 이름 정하기용: US App Store 자동완성·검색 결과를 받아 how-it-works-aso 브랜치에 커밋한다
# (개발 환경에선 apple.com 이 막혀 있음. main 에 안 넣어 Pages 재배포 없음).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to data branch
        run: |
          if git ls-remote --exit-code --heads origin how-it-works-aso >/dev/null; then
            git fetch origin how-it-works-aso
            git checkout -B how-it-works-aso origin/how-it-works-aso
            git checkout "$GITHUB_SHA" -- tools/howitworks
          else
            git checkout -B how-it-works-aso
          fi
      - name: Fetch
        run: |
          set -o pipefail
          python3 -u tools/howitworks/aso_fetch.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/howitworks
          git commit -m "how-it-works: ASO snapshot" || echo "nothing new"
          git push origin how-it-works-aso
