<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Glass</title>
<style>
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 진짜 사진 + GPU 효과. ?photo=<경로>&mood=rain|fire|cafe&seed=N
// draw(t) 는 L 초마다 같은 그림으로 돌아온다(끊김 없는 반복). 렌더러는 window.__glass.frame(t).
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var MOOD = q.get('mood') || 'rain', SEED = parseFloat(q.get('seed') || '1042');
  var PHOTO = q.get('photo') || 'ambient/photo-rain.jpg';
  var W = parseInt(q.get('w') || '1920', 10), H = Math.round(W * 9 / 16);
  var L = parseFloat(q.get('loop') || '30');
  var cv = document.getElementById('c'); cv.width = W; cv.height = H;
  var gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });

  var VS = '#version 300 es\nin vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
  var FS = '#version 300 es\nprecision highp float;\n' +
    'in vec2 uv; out vec4 o; uniform sampler2D img; uniform float t, L, seed, aspect, imgAspect; uniform int mood; uniform float fireX, fireY;\n' +
    '#define TAU 6.2831853\n' +
    'float h1(vec2 p){ p = fract(p * vec2(123.34, 456.21) + seed * 0.0137); p += dot(p, p + 45.32); return fract(p.x * p.y); }\n' +
    'vec2 h2(vec2 p){ float a = h1(p); return vec2(a, h1(p + a * 17.0)); }\n' +
    // 사진을 화면 비율에 맞춰 꽉 채우기(cover) + 아주 느린 숨쉬는 줌(주기 L)
    'vec2 cover(vec2 u){ float z = 1.04 + 0.012 * sin(TAU * t / L); vec2 c = u - 0.5; c /= z;\n' +
    '  if (imgAspect > aspect) c.x *= aspect / imgAspect; else c.y *= imgAspect / aspect; return c + 0.5; }\n' +
    // 물방울은 (가림 정도, 중심에서의 방향) 을 돌려준다 — 방향으로 굴절·하이라이트를 만든다
    'vec3 staticDrops(vec2 u, float scale, float tt){\n' +
    '  vec2 g = u * vec2(scale * aspect, scale); vec2 id = floor(g); vec2 f = fract(g) - 0.5;\n' +
    '  vec2 r = h2(id); if (r.x > 0.55) return vec3(0.0); vec2 pos = (h2(id + 5.3) - 0.5) * 0.6;\n' +
    '  float life = fract(tt / L * (1.0 + floor(r.y * 2.0)) + h1(id + 1.7));\n' +
    '  float size = smoothstep(0.0, 0.1, life) * smoothstep(1.0, 0.75, life) * (0.1 + 0.22 * h1(id + 3.1));\n' +
    '  vec2 d = (f - pos) / max(size, 1e-3); float m = smoothstep(1.0, 0.8, length(d));\n' +
    '  return vec3(m, d * m); }\n' +
    'vec4 runDrops(vec2 u, float cols, float tt){\n' +
    '  vec2 g = vec2(u.x * cols * aspect, u.y); float cid = floor(g.x); float fx = fract(g.x) - 0.5;\n' +
    '  float r = h1(vec2(cid, 7.0)); if (r > 0.6) return vec4(0.0); float spd = 1.0 + floor(h1(vec2(cid, 8.0)) * 2.0);\n' +
    '  float y = 1.15 - fract(tt / L * spd + h1(vec2(cid, 9.0))) * 1.4;\n' +
    '  float wig = sin(u.y * 17.0 + r * 40.0) * 0.05 + sin(u.y * 6.0 + r * 9.0) * 0.04;\n' +
    '  float rad = 0.16 + 0.08 * h1(vec2(cid, 2.0));\n' +
    '  vec2 d = vec2(fx - wig, (g.y - y) * cols / aspect * 0.9) / rad; d.y *= 1.1;\n' +
    '  float m = smoothstep(1.0, 0.8, length(d));\n' +
    '  float above = (g.y - y) * cols; float trail = smoothstep(0.35, 0.05, abs(fx - wig)) * step(0.0, above) * smoothstep(2.5, 0.0, above);\n' +
    '  return vec4(m, d * m, trail); }\n' +
    'vec3 sampleImg(vec2 u, float lod){ return textureLod(img, vec2(u.x, 1.0 - u.y), lod).rgb; }\n' +
    'void main(){\n' +
    '  vec2 u = uv; float tt = t; vec3 col;\n' +
    '  if (mood == 0) {\n' +
    '    vec3 s1 = staticDrops(u, 16.0, tt); vec3 s2 = staticDrops(u + 0.37, 27.0, tt + L * 0.5);\n' +
    '    vec4 r1 = runDrops(u, 5.0, tt); vec4 r2 = runDrops(u + vec2(0.13, 0.0), 9.0, tt + 3.0);\n' +
    '    vec3 dr = s1; if (s2.x > dr.x) dr = s2; if (r1.x > dr.x) dr = r1.xyz; if (r2.x > dr.x) dr = r2.xyz;\n' +
    '    float m = dr.x; vec2 n = dr.yz; float wet = clamp(max(r1.w, r2.w), 0.0, 1.0);\n' +
    '    vec2 cu = cover(u);\n' +
    '    vec3 fog = sampleImg(cu, 5.5) * 0.7 + sampleImg(cu, 4.0) * 0.3;\n' +
    '    vec3 clear = sampleImg(cu, 1.5);\n' +
    // 물방울 = 작은 볼록렌즈: 뒤 풍경이 뒤집혀 작게 보인다
    '    vec3 lensC = sampleImg(cu - n * 0.035, 0.8);\n' +
    '    col = mix(fog, clear, wet * 0.75);\n' +
    '    float edge = smoothstep(0.55, 1.0, length(n));\n' +
    '    vec3 dropC = lensC * (1.05 - edge * 0.55);\n' +
    '    float spec = smoothstep(0.25, 0.0, length(n - vec2(-0.35, -0.4))) * 0.55;\n' +
    '    dropC += vec3(1.0) * spec * m;\n' +
    '    col = mix(col, dropC, m);\n' +
    '    col = mix(col, col * 1.08 + 0.03, (1.0 - m) * (1.0 - wet) * 0.6);\n' +
    '  } else if (mood == 1) {\n' +
    // 모닥불: 밝은(따뜻한) 부분만 불빛처럼 일렁인다 + 불티
    '    vec2 cu = cover(u); vec3 c = sampleImg(cu, 0.6); float warm = clamp((c.r - c.b) * 1.6 + (c.r + c.g) * 0.3 - 0.3, 0.0, 1.0);\n' +
    '    float fl = 0.5 * sin(TAU * tt / L * 7.0) + 0.3 * sin(TAU * tt / L * 13.0 + 1.3) + 0.2 * sin(TAU * tt / L * 23.0 + 2.1);\n' +
    '    col = c * (1.0 + warm * 0.12 * fl) + vec3(0.06, 0.025, 0.0) * warm * (0.5 + 0.5 * fl);\n' +
    '    for (int i = 0; i < 40; i++) { float fi = float(i); vec2 r = h2(vec2(fi, 3.0)); float k = 1.0 + floor(r.y * 3.0);\n' +
    '      float ph = fract(tt / L * k + r.x); vec2 p = vec2(fireX + (r.x - 0.5) * 0.05 + sin(TAU * (ph * 2.0 + r.y)) * 0.03 * ph, fireY + ph * 0.38);\n' +
    '      float d = length((u - p) * vec2(aspect, 1.0)); col += vec3(1.0, 0.6, 0.25) * smoothstep(0.004, 0.0, d) * (1.0 - ph) * 1.5; }\n' +
    '  } else {\n' +
    // 카페: 빛이 아주 천천히 숨쉬고, 빛 속에 먼지가 떠다닌다
    '    vec2 cu = cover(u); vec3 c = sampleImg(cu, 0.6); float lum = dot(c, vec3(0.3, 0.59, 0.11));\n' +
    '    col = c * (1.0 + 0.05 * sin(TAU * tt / L * 2.0) * smoothstep(0.4, 0.9, lum));\n' +
    '    for (int i = 0; i < 50; i++) { float fi = float(i); vec2 r = h2(vec2(fi, 9.0)); float k = 1.0 + floor(r.x * 2.0);\n' +
    '      vec2 p = fract(r + vec2(sin(TAU * (tt / L * k + r.y)) * 0.03, tt / L * k * 0.2));\n' +
    '      float d = length((u - p) * vec2(aspect, 1.0)); col += vec3(1.0, 0.9, 0.75) * smoothstep(0.003, 0.0, d) * 0.5 * smoothstep(0.3, 0.8, lum); }\n' +
    '  }\n' +
    '  vec2 v = uv - 0.5; col *= 1.0 - dot(v, v) * 0.55;\n' +       // 비네트
    '  col += (h1(uv * 913.0 + fract(tt)) - 0.5) * 0.012;\n' +     // 필름 그레인(밴딩 방지)
    '  o = vec4(col, 1.0); }';

  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = {}; ['t', 'L', 'seed', 'aspect', 'imgAspect', 'mood', 'img', 'fireX', 'fireY'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
  var imgAspect = 1.777;
  var ready = new Promise(function (res, rej) {
    var im = new Image(); im.onload = function () {
      var tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      imgAspect = im.width / im.height; res();
    }; im.onerror = function () { rej(new Error('photo load failed: ' + PHOTO)); }; im.src = PHOTO;
  });
  function frame(t) {
    gl.viewport(0, 0, W, H);
    gl.uniform1f(U.t, ((t % L) + L) % L); gl.uniform1f(U.L, L); gl.uniform1f(U.seed, SEED);
    gl.uniform1f(U.aspect, W / H); gl.uniform1f(U.imgAspect, imgAspect);
    gl.uniform1i(U.mood, { rain: 0, fire: 1, cafe: 2 }[MOOD] || 0); gl.uniform1i(U.img, 0);
    gl.uniform1f(U.fireX, parseFloat(q.get('fx') || '0.53')); gl.uniform1f(U.fireY, parseFloat(q.get('fy') || '0.07'));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  window.__glass = { ready: ready, L: L, frame: function (t, qual) { frame(t); return cv.toDataURL('image/jpeg', qual || 0.92); } };
  if (!q.get('static')) ready.then(function () { var t0 = performance.now(); (function loop(now) { frame((now - t0) / 1000); requestAnimationFrame(loop); })(t0); });
})();
</script>
</body>
</html>
