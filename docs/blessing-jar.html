<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Blessing Jar</title>
<style>
  /* Blessing Jar — 1단계 시제품 (흔들기·쪽지 떨어지기). DESIGN.md: 시스템 글꼴, 강조색 1개, 이모지 없음. */
  :root {
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --label: #000000;
    --label2: rgba(60, 60, 67, 0.62);
    --label3: rgba(60, 60, 67, 0.3);
    --sep: rgba(60, 60, 67, 0.2);
    --fill: rgba(118, 118, 128, 0.12);
    --accent: #2D6A4F;
    --on-accent: #FFFFFF;
    --danger: #FF3B30;
    --scrim: rgba(242, 242, 247, 0.86);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1C1C1E; --label: #FFFFFF;
      --label2: rgba(235, 235, 245, 0.62); --label3: rgba(235, 235, 245, 0.3);
      --sep: rgba(84, 84, 88, 0.6); --fill: rgba(118, 118, 128, 0.24);
      --accent: #6FCF9F; --on-accent: #062014; --danger: #FF453A;
      --scrim: rgba(0, 0, 0, 0.84); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1C1C1E; --label: #FFFFFF;
    --label2: rgba(235, 235, 245, 0.62); --label3: rgba(235, 235, 245, 0.3);
    --sep: rgba(84, 84, 88, 0.6); --fill: rgba(118, 118, 128, 0.24);
    --accent: #6FCF9F; --on-accent: #062014; --danger: #FF453A;
    --scrim: rgba(0, 0, 0, 0.84); color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 인앱 브라우저 시트 대응: 240px 스크롤 완충지대 (CLAUDE.md) */
  html { height: 100%; overflow: auto; overscroll-behavior: none; scrollbar-width: none; background: var(--bg); }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px); overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 17px; line-height: 1.3;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }

  .page {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .navbar { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; flex: none; }
  .navbar .tbtn { color: var(--accent); font-size: 17px; padding: 10px 0; min-width: 44px; }
  .navbar .tbtn.right { text-align: right; }
  .navbar .ntitle { font-weight: 600; font-size: 17px; }
  .large { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; padding: 0 16px; flex: none; }
  .sub { font-size: 13px; color: var(--label2); padding: 2px 16px 0; flex: none; min-height: 18px; }

  /* 무대 (항아리 캔버스) */
  #stage { position: relative; flex: 1; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  #emptyHint {
    position: absolute; left: 24px; right: 24px; top: 18%; text-align: center;
    color: var(--label2); font-size: 15px; pointer-events: none;
  }
  #emptyHint button { pointer-events: auto; color: var(--accent); font-size: 15px; margin-top: 10px; padding: 8px 4px; }

  /* 아래 조작부 */
  .dock { flex: none; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .primary {
    display: block; width: 100%; height: 50px; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px;
  }
  .primary:active { opacity: 0.75; }
  .primary:disabled { background: var(--fill); color: var(--label3); }
  .secondary { display: block; width: 100%; height: 44px; color: var(--accent); font-size: 17px; margin-top: 4px; }
  .secondary:disabled { color: var(--label3); }
  .shakeTip { text-align: center; }
  .shakeTip .h { font-size: 17px; font-weight: 600; }
  .shakeTip .f { font-size: 13px; color: var(--label2); margin-top: 4px; min-height: 17px; }
  .hidden { display: none !important; }

  /* 쪽지 읽기 */
  #reveal {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--scrim); padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
  }
  #card {
    width: min(330px, 100%); min-height: 210px; border-radius: 6px; padding: 26px 24px 22px;
    background: #FFFDF5; color: #1F1F1F; position: relative;
    border: 1px solid rgba(0, 0, 0, 0.08);
    display: flex; flex-direction: column;
    transform-origin: 50% 50%;
  }
  #card .from { font-size: 13px; color: rgba(0, 0, 0, 0.55); }
  #card .msg { font-size: 22px; line-height: 1.32; margin: 12px 0 18px; flex: 1; overflow-wrap: anywhere; }
  #card .date { font-size: 13px; color: rgba(0, 0, 0, 0.4); }
  #reveal .acts { width: min(330px, 100%); margin-top: 22px; }
  #reveal .left { text-align: center; font-size: 13px; color: var(--label2); margin-top: 10px; }

  /* 시트 (쪽지 쓰기) */
  #sheetWrap { position: fixed; inset: 0; z-index: 30; }
  #sheetWrap .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); }
  #sheet {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 12px); max-width: 560px; margin: 0 auto;
    background: var(--bg); border-radius: 12px 12px 0 0; bottom: 0;
    padding: 0 0 20px; overflow: auto;
  }
  #sheet .navbar { height: 52px; }
  .sh { font-size: 13px; color: var(--label2); text-transform: uppercase; padding: 18px 32px 7px; }
  .seg {
    margin: 0 16px; padding: 2px; border-radius: 9px; background: var(--fill);
    display: flex; flex-wrap: wrap; gap: 2px;
  }
  .seg button { flex: 1 1 22%; min-width: 64px; height: 32px; border-radius: 7px; font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .group { margin: 0 16px; background: var(--surface); border-radius: 10px; overflow: hidden; }
  textarea {
    display: block; width: 100%; min-height: 112px; border: 0; resize: none; outline: none;
    padding: 12px 16px; font: inherit; font-size: 17px; color: var(--label); background: transparent;
    -webkit-user-select: text; user-select: text;
  }
  textarea::placeholder { color: var(--label3); }
  .count { font-size: 13px; color: var(--label2); text-align: right; padding: 6px 32px 0; }
  .idea { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; }
  .idea .q { flex: 1; font-size: 15px; color: var(--label); padding: 11px 0; }
  .idea button { color: var(--accent); font-size: 15px; min-height: 44px; padding: 0 0 0 12px; flex: none; }

  /* 목록 화면 (보관함·가족) */
  .scroll { flex: 1; overflow: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .row {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; width: 100%; text-align: left;
    border-bottom: 0.5px solid var(--sep); background: var(--surface);
  }
  .group .row:last-child { border-bottom: 0; }
  .row .t { flex: 1; font-size: 17px; padding: 11px 0; }
  .row .v { color: var(--label2); font-size: 17px; }
  .row .chev { width: 8px; height: 13px; flex: none; }
  .row .del { color: var(--danger); font-size: 15px; min-height: 44px; padding: 0 0 0 12px; }
  .row input {
    flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: var(--label);
    -webkit-user-select: text; user-select: text; padding: 11px 0;
  }
  .row .add { color: var(--accent); font-size: 17px; min-height: 44px; padding: 0 0 0 12px; }
  .row .add:disabled { color: var(--label3); }
  .note-row { display: block; padding: 11px 16px; border-bottom: 0.5px solid var(--sep); background: var(--surface); }
  .group .note-row:last-child { border-bottom: 0; }
  .note-row .from { font-size: 13px; color: var(--label2); }
  .note-row .txt { font-size: 17px; margin-top: 2px; overflow-wrap: anywhere; }
  .foot { font-size: 13px; color: var(--label2); padding: 7px 32px 0; }
  .emptyList { color: var(--label2); font-size: 15px; text-align: center; padding: 40px 32px; }
  .slide { transition: transform 0.32s cubic-bezier(.2, .8, .2, 1); }
  .offR { transform: translateX(100%); }
  #toast {
    position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--label); color: var(--bg); font-size: 15px; padding: 9px 14px; border-radius: 10px; z-index: 50;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap;
  }
  #toast.on { opacity: 0.92; }
</style>
</head>
<body>

<!-- 메인: 항아리 -->
<div class="page" id="pMain">
  <div class="navbar">
    <button class="tbtn" id="bFamily">Family</button>
    <span></span>
    <button class="tbtn right" id="bArchive">Opened</button>
  </div>
  <div class="large" id="mainTitle">Blessing Jar</div>
  <div class="sub" id="mainSub"></div>
  <div id="stage">
    <canvas id="cv" aria-label="Jar of folded notes"></canvas>
    <div id="emptyHint" class="hidden">
      Pass the phone around the table.<br>Each person writes one note and drops it in.
      <br><button id="bSample">Try It With Sample Notes</button>
    </div>
  </div>
  <div class="dock" id="dockFill">
    <button class="primary" id="bAdd">Add a Note</button>
    <button class="secondary" id="bOpen">Open the Jar</button>
  </div>
  <div class="dock hidden" id="dockOpen">
    <div class="shakeTip">
      <div class="h" id="shakeH">Shake to take out a note</div>
      <div class="f" id="shakeF">Shake your phone, or swipe the jar side to side.</div>
    </div>
    <button class="primary hidden" id="bMotion" style="margin-top:12px">Turn On Shake</button>
    <button class="secondary" id="bDone">Done</button>
  </div>
</div>

<!-- 쪽지 읽기 -->
<div id="reveal" class="hidden" role="dialog" aria-label="Note">
  <div id="card">
    <div class="from" id="cFrom"></div>
    <p class="msg" id="cMsg"></p>
    <div class="date" id="cDate"></div>
  </div>
  <div class="acts">
    <button class="primary" id="bNext">Next Note</button>
    <div class="left" id="cLeft"></div>
  </div>
</div>

<!-- 쪽지 쓰기 시트 -->
<div id="sheetWrap" class="hidden">
  <div class="dim" id="sheetDim"></div>
  <div id="sheet" role="dialog" aria-label="New note">
    <div class="navbar">
      <button class="tbtn" id="bCancel">Cancel</button>
      <span class="ntitle">New Note</span>
      <button class="tbtn right" id="bDrop" style="font-weight:600" disabled>Drop In</button>
    </div>
    <div class="sh" style="padding-top:6px">From</div>
    <div class="seg" id="seg"></div>
    <div class="sh">Note</div>
    <div class="group"><textarea id="ta" maxlength="140" rows="4"
      placeholder="Something you're thankful for, or a blessing for someone at the table"></textarea></div>
    <div class="count" id="taCount">0/140</div>
    <div class="sh">Need an idea?</div>
    <div class="group"><div class="idea"><span class="q" id="ideaQ"></span><button id="bIdea">Another</button></div></div>
  </div>
</div>

<!-- 열어 본 항아리 목록 -->
<div class="page slide offR hidden" id="pArchive" style="z-index:40">
  <div class="navbar"><button class="tbtn" id="bArchBack">‹ Jar</button><span></span><span></span></div>
  <div class="large">Opened</div>
  <div class="scroll" id="archList" style="padding-top:16px"></div>
</div>
<div class="page slide offR hidden" id="pWeek" style="z-index:41">
  <div class="navbar"><button class="tbtn" id="bWeekBack">‹ Opened</button><span></span><span></span></div>
  <div class="large" id="weekTitle"></div>
  <div class="scroll" id="weekList" style="padding-top:16px"></div>
</div>

<!-- 가족 -->
<div class="page slide offR hidden" id="pFamily" style="z-index:40">
  <div class="navbar"><button class="tbtn" id="bFamBack">‹ Jar</button><span></span><span></span></div>
  <div class="large">Family</div>
  <div class="scroll" style="padding-top:16px">
    <div class="group" id="famList"></div>
    <div class="foot">Names show on each note. Everyone shares this one phone — no accounts.</div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';
  var DEBUG = (location.hash || '').indexOf('debug') >= 0;

  // ---------- 저장 ----------
  var KEY = 'blessingjar.v1';
  var S = { members: ['Mom', 'Dad', 'Grandma', 'Sam'], notes: [], archive: [], current: null, from: 0, seq: 1 };
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var QUESTIONS = [
    'What made you smile today?', 'Who helped you this week?', "What's something small you're glad about?",
    'What do you love about the person next to you?', 'What was the best part of your week?',
    "What blessing would you wish for someone at the table?", "Who did something kind you haven't thanked yet?",
    "What place are you thankful for?", 'What did you learn this week?', "What meal are you thankful for?",
    'Who would you like to pray for this week?', 'What made home feel like home this week?',
    "What's one thing you're looking forward to?", 'What made you laugh this week?',
    "What's a hard thing that turned out okay?"
  ];
  var SAMPLES = [
    [0, 'Thankful that Sam helped carry the groceries without being asked.'],
    [1, 'May this week be lighter than the last one, for all of us.'],
    [2, 'I loved our phone call on Tuesday. You always make me laugh.'],
    [3, 'Thank you for the pancakes on Saturday!'],
    [0, 'Grateful we sat down for dinner together four nights this week.'],
    [1, 'Proud of you for finishing the science project.'],
    [3, "I'm thankful for Biscuit, even when he steals my socks."],
    [2, 'Praying for a good first week at the new job.']
  ];
  // 가족 구성원마다 종이 색 (그림 요소 — UI 강조색은 하나)
  var PAPERS = ['#FFFDF5', '#FFF3C4', '#E3EEF9', '#FBE4DF', '#E6F2DE', '#EFE6F6'];
  function paperOf(fromIdx) { return PAPERS[((fromIdx % PAPERS.length) + PAPERS.length) % PAPERS.length]; }

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  var cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  var mode = 'fill'; // 'fill' | 'open'

  // ---------- 소리 (탭 뒤에 생성 — iOS) ----------
  var ac = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  var lastClink = 0;
  function clink(vol) { // 유리에 종이가 닿는 소리: 짧고 높은 '틱'
    if (!ac || ac.state !== 'running') return;
    var now = ac.currentTime;
    if (now - lastClink < 0.045) return; lastClink = now;
    var f = 2600 + Math.random() * 1400;
    [1, 1.51].forEach(function (m, i) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f * m; o.type = 'sine';
      g.gain.setValueAtTime(vol * (i ? 0.35 : 1), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07 + Math.random() * 0.05);
      o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + 0.14);
    });
  }
  function rustle(vol, dur, freq) { // 종이 바스락
    if (!ac || ac.state !== 'running') return;
    var now = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 3200; f.Q.value = 0.7;
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(now, Math.random() * 0.1); s.stop(now + dur + 0.02);
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- 항아리 모양 (항아리 단위, y 아래로, 입구 y=0) ----------
  var R = 15;                 // 쪽지 충돌 반지름
  var NECK = 60, BODY = 100, BOT = 270;
  var outline = (function () {
    var L = [];
    L.push([-NECK, -6], [-NECK, 26]);
    for (var i = 1; i <= 8; i++) { // 어깨: 2차 베지어
      var t = i / 8, a = [-NECK, 26], c = [-BODY, 30], b = [-BODY, 72];
      L.push([(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]);
    }
    L.push([-BODY, BOT - 26]);
    for (var j = 1; j <= 6; j++) { var an = Math.PI - (j / 6) * Math.PI / 2; L.push([-BODY + 26 + 26 * Math.cos(an), BOT - 26 + 26 * Math.sin(an)]); }
    var Rt = L.slice().reverse().map(function (p) { return [-p[0], p[1]]; });
    return L.concat(Rt);
  })();
  var segs = [];
  for (var si = 0; si < outline.length - 1; si++) segs.push([outline[si][0], outline[si][1], outline[si + 1][0], outline[si + 1][1], false]);
  segs.push([-NECK, -2, NECK, -2, true]); // 입구 위 보이지 않는 막 (쪽지는 흔들어 '뽑힐' 때만 나온다)

  // ---------- 물리 (Verlet) ----------
  var bodies = []; // {id,x,y,px,py,a,w,c}
  var G = 1500, SUB = 8, DAMP = 0.996;
  function spawnBody(note, x, y, vy) {
    var b = { id: note.id, x: x, y: y, px: x, py: y - (vy || 0) / (60 * SUB), a: Math.random() * 6.28, w: 0, c: paperOf(note.from) };
    bodies.push(b); return b;
  }
  var jar = { x: 0, vx: 0, y: 0, vy: 0, rot: 0, ax: 0, ay: 0, pvx: 0, pvy: 0 };
  var drag = null, kick = { x: 0, y: 0 };
  var soundOn = false;

  function step(dt) {
    var sdt = dt / SUB, sdt2 = sdt * sdt;
    // 항아리 단위로 바꾼 겉보기 가속 (중력 + 항아리 흔들림의 반대 방향 관성)
    var s = Math.sin(jar.rot), co = Math.cos(jar.rot);
    var wx = -jar.ax / K, wy = -jar.ay / K + G;
    wx += kick.x; wy += kick.y;
    var gx = wx * co + wy * s, gy = -wx * s + wy * co;
    for (var n = 0; n < SUB; n++) {
      for (var i = 0; i < bodies.length; i++) {
        var b = bodies[i];
        var vx = (b.x - b.px) * DAMP, vy = (b.y - b.py) * DAMP;
        var lim = R * 0.45, sp = Math.hypot(vx, vy); // 터널링 방지
        if (sp > lim) { vx *= lim / sp; vy *= lim / sp; }
        b.px = b.x; b.py = b.y; b.x += vx + gx * sdt2; b.y += vy + gy * sdt2;
      }
      for (var it = 0; it < 2; it++) {
        for (i = 0; i < bodies.length; i++) {
          var A = bodies[i];
          for (var j = i + 1; j < bodies.length; j++) {
            var B = bodies[j], dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;
            if (d2 < 4 * R * R && d2 > 1e-6) {
              var d = Math.sqrt(d2), o = (2 * R - d) * 0.5 / d;
              A.x -= dx * o; A.y -= dy * o; B.x += dx * o; B.y += dy * o;
            }
          }
        }
        for (i = 0; i < bodies.length; i++) wallCollide(bodies[i], sdt, it === 0 && n === SUB - 1);
      }
    }
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      var vxs = (b.x - b.px) / sdt;
      b.w += ((vxs / R) * 0.35 - b.w) * 0.12;
      b.a += b.w * dt;
    }
    kick.x *= 0.5; kick.y *= 0.5;
  }
  function wallCollide(b, sdt, sound) {
    for (var k = 0; k < segs.length; k++) {
      var sg = segs[k], ex = sg[2] - sg[0], ey = sg[3] - sg[1];
      var t = ((b.x - sg[0]) * ex + (b.y - sg[1]) * ey) / (ex * ex + ey * ey);
      t = t < 0 ? 0 : t > 1 ? 1 : t;

    save(); updateUI();
    setTimeout(updateUI, 120 + SAMPLES.length * 230 + 900);
  });

  // 화면 넘기기
  function push(id) { var p = $(id); p.classList.remove('hidden'); void p.offsetWidth; p.classList.remove('offR'); }
  function pop(id) { var p = $(id); p.classList.add('offR'); setTimeout(function () { p.classList.add('hidden'); }, 330); }
  var CHEV = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function renderArchive() {
    var L = $('archList');
    if (!S.archive.length) { L.innerHTML = '<div class="emptyList">Jars you open will be kept here.</div>'; return; }
    L.innerHTML = '<div class="group">' + S.archive.map(function (a, i) {
      return '<button class="row" data-i="' + i + '"><span class="t">' + esc(fmtDate(a.openedAt)) + '</span><span class="v">' + a.notes.length + '</span>' + CHEV + '</button>';
    }).join('') + '</div><div class="foot">Kept only on this phone.</div>';
    Array.prototype.forEach.call(L.querySelectorAll('.row'), function (r) {
      r.addEventListener('click', function () { renderWeek(+r.getAttribute('data-i')); push('pWeek'); });
    });
  }
  function renderWeek(i) {
    var a = S.archive[i]; $('weekTitle').textContent = fmtDate(a.openedAt);
    $('weekList').innerHTML = '<div class="group">' + a.notes.map(function (n) {
      return '<div class="note-row"><div class="from">' + esc(n.name || S.members[n.from] || '') + '</div><div class="txt">' + esc(n.text) + '</div></div>';
    }).join('') + '</div>';
  }
  $('bArchive').addEventListener('click', function () { renderArchive(); push('pArchive'); });
  $('bArchBack').addEventListener('click', function () { pop('pArchive'); });
  $('bWeekBack').addEventListener('click', function () { pop('pWeek'); });

  function renderFamily() {
    var L = $('famList');
    L.innerHTML = S.members.map(function (m, i) {
      return '<div class="row"><span class="t">' + esc(m) + '</span>' + (S.members.length > 1 ? '<button class="del" data-i="' + i + '">Remove</button>' : '') + '</div>';
    }).join('') + '<div class="row"><input id="famIn" maxlength="16" placeholder="Add a name" enterkeyhint="done"><button class="add" id="famAdd" disabled>Add</button></div>';
    Array.prototype.forEach.call(L.querySelectorAll('.del'), function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-i');
        S.members.splice(i, 1);
        if (S.from >= S.members.length) S.from = 0;
        save(); renderFamily();
      });
    });
    var inp = $('famIn'), add = $('famAdd');
    inp.addEventListener('input', function () { add.disabled = !inp.value.trim() || S.members.length >= 8; });
    function doAdd() { var v = inp.value.trim(); if (!v || S.members.length >= 8) return; S.members.push(v); save(); renderFamily(); setTimeout(function () { $('famIn').focus(); }, 0); }
    add.addEventListener('click', doAdd);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') doAdd(); });
  }
  $('bFamily').addEventListener('click', function () { renderFamily(); push('pFamily'); });
  $('bFamBack').addEventListener('click', function () { pop('pFamily'); });

  // ---------- 시작 ----------
  function onResize() { layout(); readTheme(); }
  window.addEventListener('resize', onResize);
  if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme); } catch (e) {} }
  onResize();
  // 저장된 쪽지를 항아리 아래부터 쌓고 소리 없이 미리 가라앉힌다
  S.notes.forEach(function (n, i) {
    var row = Math.floor(i / 6), col = i % 6;
    spawnBody(n, -75 + col * 30 + (row % 2) * 8, BOT - R - 4 - row * 27, 0);
  });
  for (var pre = 0; pre < 120; pre++) step(1 / 60);
  if (S.current && S.current.notes.length) { S.archive.unshift(S.current); S.current = null; save(); }
  setMode('fill');

  // 인앱 브라우저 시트 닫힘 방지
  var SE = document.scrollingElement || document.documentElement, PIN = 120, pinT = null;
  function pinScroll() { var max = SE.scrollHeight - SE.clientHeight; if (max <= 0) return; SE.scrollTop = Math.min(PIN, Math.max(1, max - 1)); }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () { clearTimeout(pinT); pinT = setTimeout(pinScroll, 250); }, { passive: true });
  pinScroll();

  requestAnimationFrame(frame);

  if (DEBUG) {
    window.__bj = {
      get S() { return S; }, get bodies() { return bodies; }, get mode() { return mode; },
      get energy() { return energy; }, get revealing() { return revealing; }, get fx() { return fx.length; },
      get jar() { return jar; },
      escaped: function () { return bodies.filter(function (b) { return !inside(b); }).length; },
      toScreen: toScreen, tick: tick
    };
  }
})();
</script>
</body>
</html>
