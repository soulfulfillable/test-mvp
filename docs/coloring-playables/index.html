<!DOCTYPE html>
<html lang="en">
<head>
<!-- Playgama Bridge SDK must be the first script in <head>, loaded normally (SDK required step 2).
     Local copy of npm @playgama/bridge (see CREDITS.md) so the archive ships everything it needs (rule 1.2.5). -->
<script src="playgama-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cozy Coloring</title>
<script src="coloring-data.js"></script>
<script src="coloring-pics.js"></script>
<style>
  :root {
    /* a night studio: deep plum walls, cream cards, one marigold accent; the pictures bring the rest of the color */
    --plum: #2B2340; --plum-2: #3A2F57; --plum-3: #4A3D6E; --cream: #FFF4E3; --cream-2: #F3E4CB; --sun: #FFB703; --sun-dark: #E29E00;
    --ink: #2B2340; --paper: #FBF7F0; --line: rgba(43,35,64,0.12); --green: #2E9E5B; --accent: var(--sun);
    --w1: rgba(255,183,3,0.18); --w2: rgba(74,61,110,0.14);
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--plum); }
  body {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); touch-action: none;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; border: none; background: none; }
  svg { display: block; }
  .hidden { display: none !important; }
  #defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  /* the wordmark: each letter dipped in a different paint */
  .wordmark span { display: inline-block; }
  .wordmark .l1 { color: #FF6B6B; } .wordmark .l2 { color: #FFB703; } .wordmark .l3 { color: #6BCB77; } .wordmark .l4 { color: #4D96FF; }
  .wordmark .l5 { color: #FF85A1; } .wordmark .l6 { color: #2EC4B6; } .wordmark .l7 { color: #C77DFF; } .wordmark .l8 { color: #FF9F1C; }

  /* ── loading (first thing on screen, hidden right before game_ready) ── */
  #loading { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--plum); color: var(--cream); }
  #loading .ttl { font-size: 30px; font-weight: 900; letter-spacing: -0.8px; }
  #loading .bar { width: 160px; height: 5px; border-radius: 3px; background: rgba(255,244,227,0.16); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; border-radius: 3px; background: var(--sun); animation: load 1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-40%); } to { transform: translateX(380%); } }
  #loading .dots { display: flex; gap: 8px; }
  #loading .dots i { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

  #app { position: fixed; inset: 0; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ── gallery: the studio wall ── */
  #home { background: radial-gradient(70% 45% at 100% 0%, rgba(255,133,161,0.22) 0, transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(77,150,255,0.2) 0, transparent 70%), var(--plum); color: var(--cream); padding: var(--sat) var(--sar) 0 var(--sal); }
  #home-inner { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #home-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
  #home-head .tt { flex: 1; min-width: 0; }
  #home-head h1 { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  #kicker { font-size: 13px; font-weight: 600; color: rgba(255,244,227,0.7); margin-top: 6px; }
  .ibtn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,244,227,0.14); display: flex; align-items: center; justify-content: center; flex: none; color: var(--cream); }
  .ibtn:active { background: rgba(255,244,227,0.26); }
  .ibtn[data-muted="0"] .off, .ibtn[data-muted="1"] .on { display: none; }
  #home-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; padding-bottom: calc(24px + var(--sab)); }
  #home-scroll::-webkit-scrollbar { display: none; }

  .row { display: flex; align-items: center; gap: 14px; margin: 0 16px 10px; padding: 12px; background: var(--cream); color: var(--ink); border-radius: 22px; }
  .row .cthumb { width: 88px; height: 104px; flex: none; border-radius: 14px; background: #fff; border: 3px solid var(--fc, var(--sun)); padding: 3px; overflow: hidden; }
  .row .cthumb svg { display: block; width: 100%; height: 100%; }
  .row .cmid { flex: 1; min-width: 0; }
  .row .clabel { font-size: 12px; font-weight: 700; color: rgba(43,35,64,0.6); }
  .row .cname { font-size: 19px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .cmeta { font-size: 12.5px; color: rgba(43,35,64,0.6); margin-top: 3px; }
  .row .ctrack { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row .cbar { flex: 1; height: 6px; border-radius: 3px; background: rgba(43,35,64,0.12); position: relative; overflow: hidden; }
  .row .cbar i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; background: var(--sun); }
  .row .cpct { font-size: 12px; font-weight: 700; color: rgba(43,35,64,0.7); font-variant-numeric: tabular-nums; }
  .btn-red { flex: none; background: var(--sun); color: var(--ink); font-size: 15px; font-weight: 800; padding: 12px 18px; min-height: 46px; border-radius: 14px; }
  .btn-red:active { background: var(--sun-dark); }
  .btn-red.done { background: rgba(43,35,64,0.1); }

  #filter { display: flex; align-items: center; margin: 14px 16px 0; gap: 10px; }
  #filter .seg-wrap { display: flex; background: rgba(255,244,227,0.12); border-radius: 999px; padding: 3px; }
  #filter button { background: transparent; color: rgba(255,244,227,0.8); font-size: 13.5px; font-weight: 700; padding: 8px 14px; min-height: 36px; border-radius: 999px; }
  #filter button.sel { background: var(--cream); color: var(--ink); }
  #filter .count { margin-left: auto; font-size: 12.5px; color: rgba(255,244,227,0.6); font-variant-numeric: tabular-nums; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; margin: 14px 16px 0; }
  .card { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 8px 8px 12px; position: relative; cursor: pointer; text-align: left; display: block; width: 100%; }
  .card:active { background: var(--cream-2); }
  .card .thumb { border-radius: 12px; background: #fff; border: 3px solid var(--fc, var(--sun)); padding: 3px; position: relative; overflow: hidden; }
  .card .thumb svg { display: block; width: 100%; height: auto; }
  .card .crow { display: flex; align-items: center; gap: 6px; margin-top: 9px; padding: 0 2px; }
  .card .nm { font-size: 15px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .num { font-size: 11px; font-weight: 800; color: var(--ink); background: rgba(43,35,64,0.1); border-radius: 999px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0 6px; font-variant-numeric: tabular-nums; flex: none; }
  .card .chip { flex: none; font-size: 11px; font-weight: 800; color: var(--ink); background: var(--sun); padding: 3px 8px; border-radius: 999px; display: flex; align-items: center; gap: 3px; }
  .card .chip svg { width: 11px; height: 11px; stroke-width: 3.2; }
  .card .meta { font-size: 12px; color: rgba(43,35,64,0.6); margin-top: 3px; padding: 0 2px; }
  .card .thumb .pgline { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--sun); border-radius: 0 3px 3px 0; }
  .card.locked .thumb { border-color: rgba(43,35,64,0.14); }
  .card.locked .thumb svg { opacity: 0.22; filter: grayscale(1); }
  .card.locked .nm { color: rgba(43,35,64,0.5); }
  .card .lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; color: rgba(43,35,64,0.45); stroke-width: 1.8; }
  .card .unlock { margin-top: 8px; width: 100%; background: var(--plum); color: var(--cream); font-size: 12.5px; font-weight: 800; padding: 9px 8px; min-height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .card .unlock .badge { font-size: 9px; padding: 2px 6px; border-radius: 999px; background: var(--sun); color: var(--ink); letter-spacing: 0.3px; }
  .card .unlock svg { width: 16px; height: 16px; }
  .empty { grid-column: 1 / -1; padding: 40px 12px; text-align: center; font-size: 14px; color: rgba(255,244,227,0.7); line-height: 1.5; }
  #home-foot { font-size: 11.5px; color: rgba(255,244,227,0.45); text-align: center; padding: 16px 18px 0; }

  /* ── play: the drawing table, washed with the picture's own colors ── */
  #play { background: radial-gradient(60% 50% at 12% 8%, var(--w1) 0, transparent 70%), radial-gradient(55% 45% at 92% 88%, var(--w2) 0, transparent 70%), var(--paper); display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "art" "foot"; padding: var(--sat) var(--sar) 0 var(--sal); }
  #play.land { grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr) minmax(180px, 26%); grid-template-areas: "head head" "art foot"; }
  #play-head { grid-area: head; display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
  #play .ibtn { background: #fff; color: var(--ink); box-shadow: 0 3px 10px rgba(43,35,64,0.12); }
  #play .ibtn:active { background: var(--cream-2); }
  #head-mid { flex: 1; min-width: 0; }
  #pic-name { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pbar { height: 7px; border-radius: 4px; background: rgba(43,35,64,0.1); margin-top: 6px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0%; border-radius: 4px; background: var(--sun); transition: width 0.25s ease; }
  #pct { font-size: 15px; font-weight: 800; color: rgba(43,35,64,0.7); min-width: 42px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

  #art-wrap { grid-area: art; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; padding: 6px 12px; position: relative; }
  #art-vp { position: relative; overflow: hidden; background: #fff; border-radius: 16px; box-shadow: 0 12px 34px rgba(43,35,64,0.16); touch-action: none; }
  #art-tf { transform-origin: 0 0; }
  #art-vp svg { display: block; }
  #zoom-ctrl { position: absolute; right: 8px; bottom: 8px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
  #zoom-ctrl button { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.96); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; box-shadow: 0 3px 10px rgba(43,35,64,0.18); }
  #zoom-ctrl button:active { transform: scale(0.94); }
  #zoom-ctrl button svg { width: 20px; height: 20px; }
  #zoom-ctrl button.dim { opacity: 0.35; }
  #msg { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--plum); color: var(--cream); font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 6; }
  #msg.show { opacity: 1; }

  .region { stroke: #ccd3da; stroke-width: 1.2; fill: #fff; pointer-events: fill; } /* hit-test the fill only: a neighbor's hairline must not steal the tap */
  .region.filled { stroke: none; }
  .region.hl { animation: hlp 1.3s ease-in-out infinite; }
  @keyframes hlp { 0%, 100% { fill: #fff; } 50% { fill: var(--tint); } }
  .region.shake { animation: shk 0.35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes shk { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .lbl { fill: #98a2b3; font-weight: 700; text-anchor: middle; pointer-events: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .lbl.on { fill: #4a5468; }
  .lbl.flash { animation: lfl 0.5s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes lfl { 0%,100% { transform: scale(1); } 40% { transform: scale(1.9); } }
  #play.free .lbl { display: none; }
  .deco { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .region.hl, .region.shake, .lbl.flash { animation: none; } }

  #foot { grid-area: foot; display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-bottom: var(--sab); }
  #play.land #foot { padding: 6px 10px calc(10px + var(--sab)) 0; }
  #mode-row { flex: none; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .seg { display: flex; background: rgba(43,35,64,0.08); border-radius: 999px; padding: 3px; }
  .seg button { background: transparent; color: rgba(43,35,64,0.62); font-size: 13px; font-weight: 800; padding: 0 14px; min-height: 34px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .seg button.sel { background: var(--plum); color: var(--cream); }
  .seg button svg { width: 16px; height: 16px; }
  #boost-btn { background: var(--sun); color: var(--ink); font-size: 13px; font-weight: 800; padding: 0 14px; min-height: 40px; border-radius: 999px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(255,183,3,0.35); }
  #boost-btn svg { width: 16px; height: 16px; }
  #boost-btn .badge { font-size: 9px; padding: 2px 6px; border-radius: 999px; background: var(--plum); color: var(--cream); letter-spacing: 0.3px; }
  #boost-btn:disabled { opacity: 0.45; }
  #palette { flex: none; display: flex; gap: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 14px 16px 16px; touch-action: pan-x; }
  #palette::-webkit-scrollbar { display: none; }
  #play.land #palette { flex: 1; min-height: 0; flex-wrap: wrap; align-content: flex-start; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; padding: 12px 6px 10px; }
  #play.land #mode-row { flex-direction: column; align-items: stretch; padding: 0 6px; }
  #play.land #mode-row .seg { width: 100%; } #play.land #mode-row .seg button { flex: 1; justify-content: center; }
  .sw { flex: none; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1), 0 5px 12px rgba(43,35,64,0.2); position: relative; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .sw.sel { transform: translateY(-4px) scale(1.12); box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1), 0 10px 18px rgba(43,35,64,0.3), 0 0 0 3px var(--plum); }
  .sw.done { opacity: 0.38; box-shadow: none; }
  .sw .cnt { position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--plum); color: var(--cream); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .sw svg { width: 20px; height: 20px; stroke-width: 3; }

  /* ── completion panel ── */
  #done-panel { position: fixed; left: 50%; bottom: calc(18px + var(--sab)); transform: translateX(-50%); width: min(350px, calc(100vw - 24px)); background: var(--plum); color: var(--cream); padding: 18px 16px 16px; border-radius: 24px; text-align: center; z-index: 20; box-shadow: 0 16px 48px rgba(43,35,64,0.4); animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes rise { from { transform: translateX(-50%) translateY(60px); opacity: 0; } }
  #done-panel h2 { font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #done-panel h2 svg { width: 28px; height: 28px; color: var(--sun); }
  #done-panel p { font-size: 14px; color: rgba(255,244,227,0.72); margin-top: 3px; }
  #done-panel .row2 { display: flex; gap: 8px; margin-top: 14px; }
  #done-panel .row2 button { flex: 1; padding: 12px 6px; font-size: 14px; font-weight: 800; min-height: 48px; border-radius: 14px; }
  #btn-next { background: var(--sun); color: var(--ink); }
  #btn-gallery { background: var(--cream); color: var(--ink); }
  #btn-again { background: rgba(255,244,227,0.14); color: var(--cream); }
  #done-panel button:active { transform: scale(0.96); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 19; }
  /* ── the finish: every piece pops in a wave, a shine sweeps over, sparkles, a glow, a big word, then the next picture slides in ── */
  #play.won .region { animation: piecepop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) var(--wd, 0ms) 1 both; transform-box: fill-box; transform-origin: center; }
  @keyframes piecepop { 0% { transform: scale(1); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .shine, .sparkle { pointer-events: none; }
  .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 0.9s ease-out both; }
  @keyframes twinkle { 0% { opacity: 0; transform: scale(0) rotate(0); } 35% { opacity: 1; transform: scale(1.4) rotate(35deg); } 100% { opacity: 0; transform: scale(0.3) rotate(90deg); } }
  #art-vp.glow { animation: glowpulse 1.3s ease-out 2; }
  @keyframes glowpulse { 0% { box-shadow: 0 12px 34px rgba(43,35,64,0.16); transform: scale(1); } 30% { box-shadow: 0 0 0 6px rgba(255,183,3,0.8), 0 0 90px 22px rgba(255,183,3,0.55); transform: scale(1.04); } 100% { box-shadow: 0 12px 34px rgba(43,35,64,0.16); transform: scale(1); } }
  #cheer { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(0.5); opacity: 0; font-size: clamp(40px, 12.5vmin, 72px); font-weight: 900; letter-spacing: -1.5px; color: var(--sun); text-shadow: 0 3px 0 #fff, 0 0 28px rgba(255,255,255,0.95), 0 10px 30px rgba(43,35,64,0.35); pointer-events: none; z-index: 7; white-space: nowrap; }
  #cheer.show { animation: cheerpop 1.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
  @keyframes cheerpop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); } 16% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(3deg); } 28% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { opacity: 1; transform: translate(-50%, -58%) scale(1.02); } 100% { opacity: 0; transform: translate(-50%, -74%) scale(0.96); } }
  #btn-next { position: relative; overflow: hidden; }
  #btn-next .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: rgba(43,35,64,0.5); }
  #btn-next .bar.run { width: 0; transition: width 5s linear; }
  #art-vp.slide-out { animation: slideout 0.32s ease-in forwards; }
  #art-vp.slide-in { animation: slidein 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.12) both; }
  @keyframes slideout { to { transform: translateX(-115%) rotate(-4deg); opacity: 0; } }
  @keyframes slidein { from { transform: translateX(115%) rotate(4deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #play.won .region, .sparkle, #art-vp.glow, #cheer.show, #art-vp.slide-out, #art-vp.slide-in, #done-panel { animation: none; } }

  /* ── cover still ── */
  #play.cover #play-head, #play.cover #foot, #play.cover #zoom-ctrl, #play.cover .lbl { display: none; }
  #play.cover #art-vp { border: none; }
  #play.cover { grid-template-rows: 1fr; grid-template-columns: 1fr; grid-template-areas: "art"; }
  #cover-badge { position: fixed; z-index: 35; left: 50%; bottom: 7%; transform: translateX(-50%); background: var(--plum); color: var(--cream); border-radius: 4vmin; padding: 3vmin 6vmin 3.4vmin; text-align: center; box-shadow: 0 20px 60px rgba(43,35,64,0.45); }
  #cover-badge .k { font-size: 3vmin; font-weight: 700; color: rgba(255,244,227,0.75); margin-top: 1vmin; }
  #cover-badge h1 { font-size: 9vmin; font-weight: 900; letter-spacing: -0.2vmin; line-height: 1; white-space: nowrap; }
  .pressable { transition: transform 0.08s ease-out; }
  .pressable:active { transform: scale(0.95); }
</style>
</head>
<body>
<svg id="defs" aria-hidden="true">
  <!-- Stroked icons drawn for this game (rule 4.3.2: no emoji) -->
  <symbol id="s-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
