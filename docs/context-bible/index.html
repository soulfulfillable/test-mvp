<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>John 1:43–51 · Context</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f2f2f7; --label:#1c1c1e; --label2:#6c6c70; --label3:#8e8e93;
  --sep:rgba(60,60,67,.16); --accent:#b4233c; --accent-soft:rgba(180,35,60,.10);
  --hl:rgba(10,100,200,.16); --open:rgba(180,35,60,.06);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg2:#1c1c1e; --label:#f2f2f7; --label2:#a1a1a8; --label3:#7c7c82;
    --sep:rgba(84,84,88,.55); --accent:#ff6b7f; --accent-soft:rgba(255,107,127,.16);
    --hl:rgba(100,168,255,.24); --open:rgba(255,107,127,.08);
  }
}
*{box-sizing:border-box}
html{font-size:17px; font:-apple-system-body; -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--label); font-family:var(--sans); line-height:1.45}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; text-align:left}
button:focus-visible,.mark:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.wrap{max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 40px)}

.eyebrow{font-size:.76rem; color:var(--label2); margin:0}
h1{font-size:1.65rem; line-height:1.15; font-weight:700; margin:2px 0 8px; letter-spacing:-.01em}
.hint{font-size:.76rem; color:var(--label2); display:flex; align-items:center; gap:6px; margin:0 0 20px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none}

.passage{font-family:var(--serif); font-size:1.12rem; line-height:1.62}
.v{margin:0; padding:3px 0}
.v.has-note{cursor:pointer; -webkit-tap-highlight-color:transparent}
.v sup{font-family:var(--sans); font-size:.62em; color:var(--label3); font-weight:600; margin-right:3px; vertical-align:.45em}
.mark{cursor:pointer; -webkit-box-decoration-break:clone; box-decoration-break:clone;
  text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:1.5px; text-underline-offset:4px; border-radius:4px}
.mark .pin{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-left:5px; vertical-align:.18em}
.mark[aria-expanded="true"]{background:var(--open)}
.intro .pin{animation:pulse 1.4s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}60%{box-shadow:0 0 0 9px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}

mark.hl{color:inherit; background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0 / 0% 100%; border-radius:3px; padding:0 1px;
  transition:background-size .55s cubic-bezier(.3,.7,.3,1)}
mark.hl.on{background-size:100% 100%}

.note{font-family:var(--sans); font-size:1rem; margin:10px 0 16px; border-left:2px solid var(--accent); padding:2px 0 2px 14px; animation:open .25s ease-out}
@keyframes open{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.note-head{display:flex; gap:8px; align-items:flex-start}
.easy{flex:1; margin:0}
.x{width:32px; height:32px; margin:-4px -6px 0 0; display:grid; place-items:center; color:var(--label3); flex:none; border-radius:16px}
.x svg{width:12px; height:12px}
.src-btn{color:var(--accent); font-weight:600; min-height:44px; display:inline-flex; align-items:center; gap:7px; margin-top:4px}
.src-btn svg{width:7px; height:12px; transition:transform .2s}
.src-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.sources{background:var(--bg2); border-radius:12px; padding:12px 14px; font-size:.88rem}
.sources h3{font-size:.76rem; font-weight:600; color:var(--label2); margin:0 0 6px}
.sources section + section{border-top:.5px solid var(--sep); margin-top:12px; padding-top:12px}
.ref{font-weight:600}
.kind{color:var(--label2)}
.reason{margin:2px 0 6px}
.excerpt{font-family:var(--serif); font-size:1rem; line-height:1.55; margin:0 0 4px}
.excerpt p{margin:0 0 4px}
.limits p{margin:0 0 6px}
.limits p:last-child{margin:0}
.fine{color:var(--label2); font-size:.76rem; margin:0 0 4px}

footer{margin-top:36px; font-size:.76rem; color:var(--label2); border-top:.5px solid var(--sep); padding-top:14px}
footer p{margin:0 0 8px}
.err{padding:40px 0; text-align:center; color:var(--label2); font-size:.88rem}
.err button{color:var(--accent); font-weight:600; margin-top:8px; min-height:44px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="err">Loading…</p></div>
<script>
(() => {
const app = document.getElementById('app');
const ARROW = '<svg viewBox="0 0 7 12" aria-hidden="true"><path d="M1.2 1.2 5.8 6 1.2 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XSVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let D, openId = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prettyRef = r => r.replace(/-(\d+)$/, '–$1');
function expand(ref){
  const m = ref.match(/^(.+) (\d+):(\d+)(?:-(\d+))?$/); const out = [];
  for (let v = +m[3]; v <= +(m[4] || m[3]); v++) out.push(`${m[1]} ${m[2]}:${v}`);
  return out;
}
function markup(text, phrases){
  let h = esc(text);
  (phrases || []).forEach(p => { const e = esc(p); h = h.replace(e, `<mark class="hl">${e}</mark>`); });
  return h;
}
const ins = id => D.insights.find(i => i.id === id);

function load(){
  fetch('data.json', {cache:'no-cache'}).then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => { D = d; render(); })
    .catch(() => { app.innerHTML = '<div class="err">Couldn’t load this passage. Check your connection.<br><button id="retry">Try again</button></div>';
      document.getElementById('retry').onclick = () => { app.innerHTML = '<p class="err">Loading…</p>'; load(); }; });
}

function render(){
  const P = D.passage, base = D.baseTranslation, byVerse = {};
  D.insights.forEach(i => byVerse[i.verse] = i);
  let verses = '';
  for (let v = P.from; v <= P.to; v++){
    const t = D.texts[base][`${P.book} ${P.chapter}:${v}`], n = byVerse[v];
    let body = esc(t);
    if (n){
      const a = esc(n.anchor);
      body = body.replace(a, `<span class="mark" role="button" tabindex="0" data-note="${n.id}" aria-expanded="false" aria-controls="note-${n.id}"><span class="anc">${a}</span><span class="pin" aria-hidden="true"></span></span>`);
    }
    verses += `<p class="v${n ? ' has-note' : ''}" id="verse-${v}"><sup>${v}</sup>${body}</p>`;
    if (n) verses += `<div class="slot" id="slot-${n.id}"></div>`;
  }
  app.innerHTML = `
    <header>
      <p class="eyebrow">${esc(prettyRef(P.ref))} · ${esc(base)}</p>
      <h1>${esc(P.title)}</h1>
      <p class="hint"><span class="dot"></span>Tap an underlined line</p>
    </header>
    <main><div class="passage intro">${verses}</div></main>
    <footer>
      <p>Scripture: World English Bible (WEB), public domain. Greek and Hebrew checked against the SBL Greek New Testament, the Septuagint (Swete) and the Westminster Leningrad Codex.</p>
      <p>Early preview. Notes are a draft and have not yet been reviewed by a scholar.</p>
    </footer>`;
  setTimeout(() => app.querySelector('.intro')?.classList.remove('intro'), 3200);
  if (location.hash.length > 1 && ins(location.hash.slice(1))) openNote(location.hash.slice(1), true);
}

function sourcesHTML(n){
  const links = n.links.map(l => `
    <section>
      <div><span class="ref">${esc(prettyRef(l.ref))}</span> <span class="kind">· ${esc(D.linkKinds[l.kind])}</span></div>
      <p class="reason">${esc(l.reason)}</p>
      <div class="excerpt">${expand(l.ref).map(r => `<p><sup>${r.split(':')[1]}</sup> ${markup(D.texts.WEB[r], l.highlight[r])}</p>`).join('')}</div>
    </section>`).join('');
  const orig = n.detail.original.sources ? `Greek/Hebrew: ${n.detail.original.sources.map(esc).join(', ')}. ` : '';
  return `${links}
    <section class="limits"><h3>What the text says, and what it doesn’t</h3>${n.limits.map(x => `<p>${esc(x)}</p>`).join('')}</section>
    <section><p class="fine">Bible text: WEB, public domain. ${orig}Draft notes, ${esc(n.checked.date)}.</p></section>`;
}

function setSourceHighlight(n, on){
  const verseEl = document.getElementById('verse-' + n.verse);
  verseEl.querySelectorAll('mark.hl').forEach(m => m.replaceWith(...m.childNodes));
  verseEl.normalize();
  if (!on) return;
  const phrases = [...new Set(n.links.flatMap(l => l.highlightSource))];
  phrases.forEach(p => {
    const tw = document.createTreeWalker(verseEl, NodeFilter.SHOW_TEXT); let t;
    while ((t = tw.nextNode())){
      const i = t.data.indexOf(p); if (i < 0) continue;
      const r = document.createRange(); r.setStart(t, i); r.setEnd(t, i + p.length);
      const m = document.createElement('mark'); m.className = 'hl'; r.surroundContents(m); break;
    }
  });
}
function lightUp(root){ requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll('mark.hl').forEach((m, i) => setTimeout(() => m.classList.add('on'), i * 150)))); }

function closeNote(){
  if (!openId) return;
  const n = ins(openId);
  document.getElementById('slot-' + openId).innerHTML = '';
  document.querySelector(`.mark[data-note="${openId}"]`).setAttribute('aria-expanded', 'false');
  setSourceHighlight(n, false);
  openId = null;
}
function openNote(id, scroll){
  if (openId === id) return;
  closeNote();
  const n = ins(id);
  document.getElementById('slot-' + id).innerHTML = `
    <div class="note" id="note-${id}" role="region" aria-label="Note on ${esc(n.ref)}">
      <div class="note-head"><p class="easy">${esc(n.easy)}</p><button class="x" data-close="${id}" aria-label="Close">${XSVG}</button></div>
      <button class="src-btn" data-src="${id}" aria-expanded="false" aria-controls="src-${id}">${ARROW}<span>View sources</span></button>
      <div class="sources" id="src-${id}" hidden></div>
    </div>`;
  document.querySelector(`.mark[data-note="${id}"]`).setAttribute('aria-expanded', 'true');
  openId = id;
  if (scroll) document.getElementById('verse-' + n.verse).scrollIntoView({behavior:'smooth', block:'start'});
}

app.addEventListener('click', e => {
  let t = e.target.closest('button, [data-note]');
  // a marked verse is tappable anywhere: a phrase that wraps over two lines has gaps where a tap would miss it
  if (!t){ const v = e.target.closest('.v.has-note'); if (v) t = v.querySelector('[data-note]'); }
  if (!t) return;
  if (t.dataset.note){ openId === t.dataset.note ? closeNote() : openNote(t.dataset.note, false); }
  else if (t.dataset.close){ const v = ins(t.dataset.close).verse; closeNote(); document.getElementById('verse-' + v).scrollIntoView({block:'nearest'}); }
  else if (t.dataset.src){
    const id = t.dataset.src, n = ins(id), box = document.getElementById('src-' + id);
    const on = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', on); box.hidden = !on;
    t.querySelector('span').textContent = on ? 'Hide sources' : 'View sources';
    if (on){ box.innerHTML = sourcesHTML(n); setSourceHighlight(n, true); lightUp(box); lightUp(document.getElementById('verse-' + n.verse)); }
    else setSourceHighlight(n, false);
  }
});
window.addEventListener('hashchange', () => { if (D && ins(location.hash.slice(1))) openNote(location.hash.slice(1), true); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeNote();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.note){ e.preventDefault(); e.target.click(); }
});
load();
})();
</script>
</body>
</html>
