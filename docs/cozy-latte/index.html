<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cdc8c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cozy Latte</title>
<style>
  :root{--table:#cdc8c0;--ink:#2b2a28;--accent:#1f7a6c;--knob:#fbfaf8}
  @media (prefers-color-scheme:dark){:root{--table:#212427;--ink:#ecebe8;--accent:#3aa594;--knob:#34383c}}
  html{background:var(--table);overscroll-behavior:none}
  /* 240px scroll cushion: an in-app browser sheet reads a downward drag as "close" unless the page can scroll */
  body{margin:0;height:calc(100% + 240px);min-height:calc(100vh + 240px);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0;overflow:hidden;background:var(--table);touch-action:pan-y}
  #cup{position:absolute;inset:0;width:100%;height:100%;display:block}
  canvas{display:block}
  button{position:absolute;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}

  /* the only control: appears when the cup is finished */
  #fresh{left:50%;bottom:calc(6.5% + env(safe-area-inset-bottom));width:64px;height:64px;margin-left:-32px;border-radius:50%;background:var(--accent);color:#fff;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .28s ease,transform .42s cubic-bezier(.3,1.5,.5,1)}
  #fresh.on{opacity:1;transform:none;pointer-events:auto}
  #fresh:active{transform:scale(.93);transition-duration:.08s}
  #fresh svg{width:34px;height:34px;display:block;margin:15px}

  /* first-run demonstration: a fingertip that presses and sways. No words. */
  #finger{position:absolute;left:0;top:0;width:130px;height:180px;margin:-6px 0 0 -24px;opacity:0;pointer-events:none;transition:opacity .3s ease;will-change:transform}
  #finger.on{opacity:.93}


  /* two dials at the edges: how high the jug is held, and how much milk comes out. Usable with the other hand while pouring. */
  .dial{position:absolute;width:60px;height:min(190px,26vh);bottom:calc(16px + env(safe-area-inset-bottom));touch-action:none;cursor:pointer;outline:none}
  #hgt{left:calc(8px + env(safe-area-inset-left))}
  #amt{right:calc(8px + env(safe-area-inset-right))}
  @media (orientation:landscape){.dial{bottom:auto;top:50%;height:min(210px,62vh);transform:translateY(-50%)}#hgt{left:calc(22px + env(safe-area-inset-left))}#amt{right:calc(22px + env(safe-area-inset-right))}}
  .dial .track{position:absolute;left:50%;top:20px;bottom:20px;width:4px;margin-left:-2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 20%,transparent);overflow:hidden}
  .dial .track i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
  #amt .track{width:18px;margin-left:-9px;border-radius:0;clip-path:polygon(42% 100%,58% 100%,100% 0,0 0)}
  .dial .knob{position:absolute;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-sizing:border-box;color:var(--accent);display:flex;align-items:center;justify-content:center}
  .dial.held .knob{transform:scale(1.08)}
  .dial .knob svg{width:26px;height:26px;display:block}
  .dial .knob b{display:block;border-radius:50%;background:var(--accent)}
  .dial .foot{position:absolute;left:50%;bottom:9px;width:26px;height:8px;margin-left:-13px;border:2px solid color-mix(in srgb,var(--ink) 38%,transparent);border-top:0;border-radius:0 0 13px 13px;box-sizing:border-box}
  .nogl .dial{display:none}

  /* orders: what to pour (top), serve (bottom centre), and the result card */
  #top{position:absolute;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  #order{display:flex;align-items:center;gap:10px;min-width:0}
  #thumb{width:46px;height:46px;flex:none;border-radius:50%}
  #order div{display:flex;flex-direction:column;min-width:0}
  #oname{font-size:17px;font-weight:600;letter-spacing:-.01em}
  #osub{font-size:13px;opacity:.62;font-variant-numeric:tabular-nums;white-space:nowrap}
  #mode{position:static;pointer-events:auto;font:inherit;font-size:17px;color:var(--accent);padding:10px 4px;min-height:44px}
  #mode:active{opacity:.5}
  .free #order{visibility:hidden}
  #serve{left:50%;bottom:calc(6.5% + env(safe-area-inset-bottom));width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-sizing:border-box;color:var(--accent);opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .25s ease,transform .3s ease}
  #serve.on{opacity:1;transform:none;pointer-events:auto}
  #serve:active{transform:scale(.93)}
  #serve svg{width:28px;height:28px;display:block;margin:13px}
  #card{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(366px,calc(100% - 24px));transform:translate(-50%,14px);box-sizing:border-box;padding:14px;border-radius:18px;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);opacity:0;pointer-events:none;transition:opacity .28s ease,transform .34s ease}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card .row{display:flex;align-items:center;gap:14px}
  #over{width:104px;height:104px;flex:none;border-radius:50%}
  #pct{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  #stars{display:flex;gap:3px;margin:5px 0 7px;color:color-mix(in srgb,var(--ink) 20%,transparent)}
  #stars svg{width:20px;height:20px}
  #stars .got{color:var(--accent)}
  #legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;opacity:.75}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
  #card .btns{display:flex;gap:8px;margin-top:12px}
  #card .btns button{position:static;flex:1;height:48px;border-radius:13px;font:inherit;font-size:17px}
  #again{color:var(--accent);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  #next{color:#fff;background:var(--accent);font-weight:600}
  #card .btns button:active{opacity:.6}
  .served .dial{opacity:0;pointer-events:none}
  .dial{transition:opacity .2s ease}
  @media (orientation:landscape){#card{left:auto;right:calc(14px + env(safe-area-inset-right));bottom:auto;top:50%;width:236px;transform:translate(14px,-50%)}#card.on{transform:translate(0,-50%)}#card .row{flex-direction:column;align-items:flex-start;gap:8px}#over{width:84px;height:84px}}
  @media (orientation:portrait) and (max-height:620px){#card{padding:10px}#over{width:78px;height:78px}#card .btns{margin-top:8px}#card .btns button{height:44px}#pct{font-size:30px}#stars{margin:3px 0 5px}}
  .nogl #top,.nogl #serve,.nogl #card{display:none}

  /* name tags, the row of tools under the cup, the pour spot, the how-to sheet */
  .dial .tag{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:13px;opacity:.66;white-space:nowrap;pointer-events:none}
  #tools{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:flex-start;gap:clamp(8px,3.4vw,16px);transition:opacity .2s ease}
  #tools .tool{position:static;display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;font:inherit;font-size:13px;color:var(--ink)}
  #tools .tool span{opacity:.66;white-space:nowrap}
  #tools .tool i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-sizing:border-box;color:var(--accent)}
  #tools .tool:active i{transform:scale(.93)}
  #tools .tool svg{width:28px;height:28px;display:block}
  #tools #serve{position:static;margin:0;left:auto;bottom:auto;width:56px;height:auto;border:0;background:none;border-radius:0;transform:none;visibility:hidden;opacity:1;pointer-events:none}
  #tools #serve.on{visibility:visible;pointer-events:auto}
  #tools #serve svg{margin:0}
  #tools #serve i{background:var(--accent);color:#fff;border-color:transparent}
  .served #tools{opacity:0;pointer-events:none}
  @media (max-width:340px){#tools .tool{width:50px}#tools .tool i{width:46px;height:46px}}
  #spot{position:absolute;left:0;top:0;width:10px;height:10px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(60,35,15,.35);box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .15s ease}
  #spot.on{opacity:1}
  #spot.sink{border-style:dashed}
  #help{position:static;pointer-events:auto;width:44px;height:44px;font:inherit;font-size:17px;font-weight:600;color:var(--accent)}
  #topR{display:flex;align-items:center;gap:2px;pointer-events:none}
  #intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--table) 78%,transparent);padding:16px;box-sizing:border-box}
  #intro.on{display:flex}
  #intro .sheet{width:min(340px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 16px 16px;border-radius:20px;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  #intro .step{display:flex;align-items:center;gap:14px;padding:9px 0}
  #intro .step+.step{border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
  #intro .step svg{width:76px;height:76px;flex:none}
  #intro .step p{margin:0;font-size:17px;line-height:1.3}
  #intro .step p b{font-weight:600}
  #start{position:static;width:100%;height:50px;margin-top:10px;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600}
  #start:active{opacity:.6}
  @media (max-height:520px){#intro .sheet{width:min(640px,100%);display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}#intro .step{flex-direction:column;text-align:center;gap:6px}#intro .step+.step{border-top:0}#start{grid-column:1/-1}}
  @keyframes cl-grow{0%,12%{transform:scale(.18)}70%,100%{transform:scale(1)}}
  @keyframes cl-tap{0%,8%{transform:translateY(-9px);opacity:.3}16%,88%{transform:none;opacity:1}100%{transform:translateY(-9px);opacity:.3}}
  @keyframes cl-jug{0%,42%{transform:translateY(0)}54%,92%{transform:translateY(34px)}100%{transform:translateY(0)}}
  @keyframes cl-low{0%,54%{transform:scale(.01)}92%,100%{transform:scale(1)}}
  @keyframes cl-ring{0%{transform:scale(.3);opacity:.9}40%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}
  @keyframes cl-draw{0%,5%{stroke-dashoffset:210}62%,100%{stroke-dashoffset:0}}
  @keyframes cl-cut{0%,66%{stroke-dashoffset:56}90%,100%{stroke-dashoffset:0}}
  #intro .a{transform-box:fill-box;transform-origin:center;animation-duration:3.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  @media (prefers-reduced-motion:reduce){#intro .a{animation:none}}
  .nogl #tools,.nogl #intro,.nogl #spot{display:none}

  #fps{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;font:12px/1.3 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;pointer-events:none;display:none}

  #nogl{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  #nogl svg{width:min(62vw,300px);height:auto}
  #nogl p{margin:0;max-width:280px;font-size:15px;opacity:.72}
  .nogl #nogl{display:flex}
  .nogl #cup,.nogl #finger{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="cup" aria-label="A cup of coffee seen from above. Touch to pour milk."></canvas>

  <svg id="finger" viewBox="0 0 130 180" aria-hidden="true">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#e6bd9b" stop-opacity=".94"/><stop offset="1" stop-color="#e6bd9b" stop-opacity="0"/></linearGradient></defs>
    <g transform="rotate(-26 28 10)">
      <rect x="8" y="10" width="40" height="190" rx="20" fill="url(#fg)"/>
      <rect x="15.500" y="15" width="25" height="23" rx="10.500" fill="#f4dfcf" fill-opacity=".9"/>
    </g>
  </svg>

  <button id="fresh" type="button" aria-label="New cup">
    <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="15" cy="18" r="9.500"/>
      <circle cx="15" cy="18" r="5.500" fill="currentColor" fill-opacity=".28" stroke="none"/>
      <path d="M24.300 14.800h3.200a3.200 3.200 0 0 1 0 6.400h-3.200"/>
      <path d="M11 4.500c-1.300 1.200 1.300 2.300 0 3.700M15.500 3.500c-1.300 1.200 1.300 2.300 0 3.700M20 4.500c-1.300 1.200 1.300 2.300 0 3.700" stroke-width="1.800"/>
    </svg>
  </button>

  <div class="dial" id="hgt" role="slider" tabindex="0" aria-label="Pour height" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <span class="tag">Height</span><div class="track"><i></i></div><div class="foot"></div>
    <div class="knob"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h11l-1.500 13.500a2 2 0 0 1-2 1.800h-4a2 2 0 0 1-2-1.800z" fill="currentColor" fill-opacity=".18"/><path d="M8 6l-4.500-1.500L7.300 10.500"/><path d="M18.600 9.500h1.900a2.500 2.500 0 0 1 0 5h-2.500"/></svg></div>
  </div>
  <div class="dial" id="amt" role="slider" tabindex="0" aria-label="Milk flow" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <span class="tag">Flow</span><div class="track"><i></i></div>
    <div class="knob"><b></b></div>
  </div>

  <div id="top">
    <div id="order"><canvas id="thumb" width="92" height="92" aria-hidden="true"></canvas><div><span id="oname"></span><span id="osub"></span></div></div>
    <div id="topR"><button id="mode" type="button"></button><button id="help" type="button" aria-label="How to pour">?</button></div>
  </div>

  <div id="spot" aria-hidden="true"></div>

  <div id="tools">
    <button class="tool" id="style" type="button" aria-label="Pour style"><i><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="styleP" d="M14 5v18"/></svg></i><span></span></button>
    <button class="tool" id="serve" type="button" aria-label="Serve this cup"><i><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14.500l5.500 5.500L22 8.500"/></svg></i><span>Serve</span></button>
    <button class="tool" id="tex" type="button" aria-label="Milk texture"><i><svg viewBox="0 0 28 28" aria-hidden="true"><path id="texP" fill="currentColor" d="M14 4c4 5.500 7 9 7 12.500a7 7 0 0 1-14 0C7 13 10 9.500 14 4z"/></svg></i><span></span></button>
  </div>


  <div id="card" role="dialog" aria-label="Result">
    <div class="row">
      <canvas id="over" width="208" height="208" aria-hidden="true"></canvas>
      <div>
        <div id="pct"></div>
        <div id="stars" aria-hidden="true"></div>
        <div id="legend"><span><i style="background:#f6efe2;border:1px solid rgba(0,0,0,.25);box-sizing:border-box"></i>Match</span><span><i style="background:var(--accent)"></i>Outside</span><span><i style="background:#b98a5b"></i>Missed</span></div>
      </div>
    </div>
    <div class="btns"><button id="again" type="button">Again</button><button id="next" type="button">Next cup</button></div>
  </div>

  <div id="intro" role="dialog" aria-label="How to pour">
    <div class="sheet">
      <div class="step">
        <svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="#f3f1ec" stroke="#d6d1c8" stroke-width="2"/><circle cx="38" cy="38" r="27" fill="#8a5a30"/><circle class="a" style="animation-name:cl-grow" cx="38" cy="38" r="15" fill="#f6efe2"/><g class="a" style="animation-name:cl-tap"><rect x="44" y="34" width="15" height="42" rx="7.500" fill="#e6bd9b" transform="rotate(-24 44 34)"/></g></svg>
        <p><b>Touch and hold</b> to pour milk.</p>
      </div>
      <div class="step">
        <svg viewBox="0 0 76 76" aria-hidden="true"><path d="M10 12v52" stroke="#bdb8ae" stroke-width="3" stroke-linecap="round"/><g class="a" style="animation-name:cl-jug"><circle cx="10" cy="20" r="7" fill="var(--accent)"/></g><circle cx="46" cy="38" r="27" fill="#8a5a30"/><circle class="a" style="animation-name:cl-ring" cx="46" cy="38" r="18" fill="none" stroke="#c99a68" stroke-width="2.500"/><circle class="a" style="animation-name:cl-low" cx="46" cy="38" r="14" fill="#f6efe2"/></svg>
        <p><b>Jug low</b> draws white. <b>Jug high</b> sinks and only pushes.</p>
      </div>
      <div class="step">
        <svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="#8a5a30"/><path class="a" style="animation-name:cl-draw;stroke-dasharray:210" d="M22 22h32l-32 8h32l-32 8h32l-32 8h32l-32 8h32" fill="none" stroke="#f6efe2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="a" style="animation-name:cl-cut;stroke-dasharray:56" d="M38 64V12" fill="none" stroke="#8a5a30" stroke-width="3.500" stroke-linecap="round"/></svg>
        <p><b>Sway</b> side to side, then <b>cut through</b> to finish.</p>
      </div>
      <button id="start" type="button">Start</button>
    </div>
  </div>

  <div id="fps"></div>

  <div id="nogl" role="img" aria-label="A finished latte">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="140" fill="#f1eee8"/>
      <circle cx="150" cy="150" r="118" fill="none" stroke="#dcd7cf" stroke-width="3"/>
      <rect x="228" y="196" width="62" height="24" rx="12" fill="#fbfaf7" stroke="#d8d3ca" stroke-width="2" transform="rotate(38 228 208)"/>
      <circle cx="150" cy="150" r="100" fill="#fbfaf7" stroke="#d8d3ca" stroke-width="2"/>
      <circle cx="150" cy="150" r="88" fill="#8a5a2f"/>
      <path d="M150 92c30 0 52 22 52 46 0 30-30 46-52 70-22-24-52-40-52-70 0-24 22-46 52-46z" fill="#f6eee2"/>
      <path d="M150 104v96M150 128c-14-8-28-8-38 0M150 128c14-8 28-8 38 0M150 152c-12-7-24-7-32 0M150 152c12-7 24-7 32 0M150 174c-8-5-16-5-22 0M150 174c8-5 16-5 22 0" fill="none" stroke="#8a5a2f" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p>This browser can&rsquo;t pour milk yet. Open this page in Safari or Chrome.</p>
  </div>
</div>
<script src="orders.js?v=1"></script>
<script src="latte.js?v=5"></script>
</body>
</html>
