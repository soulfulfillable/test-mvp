<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cdc8c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cozy Latte</title>
<style>
  :root{--table:#cdc8c0;--ink:#2b2a28;--accent:#1f7a6c;--knob:#fbfaf8}
  @media (prefers-color-scheme:dark){:root{--table:#212427;--ink:#ecebe8;--accent:#3aa594;--knob:#34383c}}
  html{background:var(--table);overscroll-behavior:none}
  /* 240px scroll cushion: an in-app browser sheet reads a downward drag as "close" unless the page can scroll */
  body{margin:0;height:calc(100% + 240px);min-height:calc(100vh + 240px);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0;overflow:hidden;background:var(--table);touch-action:pan-y}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  button{position:absolute;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}

  /* the only control: appears when the cup is finished */
  #fresh{left:50%;bottom:calc(6.5% + env(safe-area-inset-bottom));width:64px;height:64px;margin-left:-32px;border-radius:50%;background:var(--accent);color:#fff;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .28s ease,transform .42s cubic-bezier(.3,1.5,.5,1)}
  #fresh.on{opacity:1;transform:none;pointer-events:auto}
  #fresh:active{transform:scale(.93);transition-duration:.08s}
  #fresh svg{width:34px;height:34px;display:block;margin:15px}

  /* first-run demonstration: a fingertip that presses and sways. No words. */
  #finger{position:absolute;left:0;top:0;width:130px;height:180px;margin:-6px 0 0 -24px;opacity:0;pointer-events:none;transition:opacity .3s ease;will-change:transform}
  #finger.on{opacity:.93}


  /* two dials at the edges: how high the jug is held, and how much milk comes out. Usable with the other hand while pouring. */
  .dial{position:absolute;width:60px;height:min(190px,26vh);bottom:calc(16px + env(safe-area-inset-bottom));touch-action:none;cursor:pointer;outline:none}
  #hgt{left:calc(8px + env(safe-area-inset-left))}
  #amt{right:calc(8px + env(safe-area-inset-right))}
  @media (orientation:landscape){.dial{bottom:auto;top:50%;height:min(210px,62vh);transform:translateY(-50%)}#hgt{left:calc(22px + env(safe-area-inset-left))}#amt{right:calc(22px + env(safe-area-inset-right))}}
  .dial .track{position:absolute;left:50%;top:20px;bottom:20px;width:4px;margin-left:-2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 20%,transparent);overflow:hidden}
  .dial .track i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
  #amt .track{width:18px;margin-left:-9px;border-radius:0;clip-path:polygon(42% 100%,58% 100%,100% 0,0 0)}
  .dial .knob{position:absolute;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--knob);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-sizing:border-box;color:var(--accent);display:flex;align-items:center;justify-content:center}
  .dial.held .knob{transform:scale(1.08)}
  .dial .knob svg{width:26px;height:26px;display:block}
  .dial .knob b{display:block;border-radius:50%;background:var(--accent)}
  .dial .foot{position:absolute;left:50%;bottom:9px;width:26px;height:8px;margin-left:-13px;border:2px solid color-mix(in srgb,var(--ink) 38%,transparent);border-top:0;border-radius:0 0 13px 13px;box-sizing:border-box}
  .nogl .dial{display:none}

  #fps{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;font:12px/1.3 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;pointer-events:none;display:none}

  #nogl{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  #nogl svg{width:min(62vw,300px);height:auto}
  #nogl p{margin:0;max-width:280px;font-size:15px;opacity:.72}
  .nogl #nogl{display:flex}
  .nogl canvas,.nogl #finger{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="cup" aria-label="A cup of coffee seen from above. Touch to pour milk."></canvas>

  <svg id="finger" viewBox="0 0 130 180" aria-hidden="true">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#e6bd9b" stop-opacity=".94"/><stop offset="1" stop-color="#e6bd9b" stop-opacity="0"/></linearGradient></defs>
    <g transform="rotate(-26 28 10)">
      <rect x="8" y="10" width="40" height="190" rx="20" fill="url(#fg)"/>
      <rect x="15.500" y="15" width="25" height="23" rx="10.500" fill="#f4dfcf" fill-opacity=".9"/>
    </g>
  </svg>

  <button id="fresh" type="button" aria-label="New cup">
    <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="15" cy="18" r="9.500"/>
      <circle cx="15" cy="18" r="5.500" fill="currentColor" fill-opacity=".28" stroke="none"/>
      <path d="M24.300 14.800h3.200a3.200 3.200 0 0 1 0 6.400h-3.200"/>
      <path d="M11 4.500c-1.300 1.200 1.300 2.300 0 3.700M15.500 3.500c-1.300 1.200 1.300 2.300 0 3.700M20 4.500c-1.300 1.200 1.300 2.300 0 3.700" stroke-width="1.800"/>
    </svg>
  </button>

  <div class="dial" id="hgt" role="slider" tabindex="0" aria-label="Pour height" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="track"><i></i></div><div class="foot"></div>
    <div class="knob"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h11l-1.500 13.500a2 2 0 0 1-2 1.800h-4a2 2 0 0 1-2-1.800z" fill="currentColor" fill-opacity=".18"/><path d="M8 6l-4.500-1.500L7.300 10.500"/><path d="M18.600 9.500h1.900a2.500 2.500 0 0 1 0 5h-2.500"/></svg></div>
  </div>
  <div class="dial" id="amt" role="slider" tabindex="0" aria-label="Milk flow" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="track"><i></i></div>
    <div class="knob"><b></b></div>
  </div>

  <div id="fps"></div>

  <div id="nogl" role="img" aria-label="A finished latte">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="140" fill="#f1eee8"/>
      <circle cx="150" cy="150" r="118" fill="none" stroke="#dcd7cf" stroke-width="3"/>
      <rect x="228" y="196" width="62" height="24" rx="12" fill="#fbfaf7" stroke="#d8d3ca" stroke-width="2" transform="rotate(38 228 208)"/>
      <circle cx="150" cy="150" r="100" fill="#fbfaf7" stroke="#d8d3ca" stroke-width="2"/>
      <circle cx="150" cy="150" r="88" fill="#8a5a2f"/>
      <path d="M150 92c30 0 52 22 52 46 0 30-30 46-52 70-22-24-52-40-52-70 0-24 22-46 52-46z" fill="#f6eee2"/>
      <path d="M150 104v96M150 128c-14-8-28-8-38 0M150 128c14-8 28-8 38 0M150 152c-12-7-24-7-32 0M150 152c12-7 24-7 32 0M150 174c-8-5-16-5-22 0M150 174c8-5 16-5 22 0" fill="none" stroke="#8a5a2f" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p>This browser can&rsquo;t pour milk yet. Open this page in Safari or Chrome.</p>
  </div>
</div>
<script src="latte.js?v=3"></script>
</body>
</html>
