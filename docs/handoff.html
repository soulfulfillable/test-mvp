<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이어받기</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#6c6c70;--line:#e5e5ea;--acc:#0a7d6b;--warn:#b25000}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--sub:#98989f;--line:#2c2c2e;--acc:#3fc7ad;--warn:#ff9f0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;padding:16px 16px 48px}
h1{font-size:28px;font-weight:700;margin:8px 0 2px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-size:17px;font-weight:600}
.when{font-size:13px;color:var(--sub);white-space:nowrap}
.next{margin:8px 0 0;font-size:15px}
.next b{color:var(--acc);font-weight:600}
.wait{margin:6px 0 0;font-size:14px;color:var(--warn)}
details{margin-top:8px;font-size:14px;color:var(--sub)}
details pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);margin:8px 0 0}
button{margin-top:10px;width:100%;height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px -apple-system,sans-serif}
button.done{opacity:.6}
.err{color:var(--warn);font-size:14px}
</style>
</head>
<body>
<h1>이어받기</h1>
<p class="lead">크레딧이 막힌 세션을 다른 계정에서 이어 갈 때. 앱을 골라 <b>문장 복사</b> → 새 세션(저장소 soulfulfillable/test-mvp)에 붙여 넣기. 각 세션이 단계마다 갱신해요.</p>
<div id="list"><p class="lead">불러오는 중…</p></div>
<script>
const RAW='https://raw.githubusercontent.com/soulfulfillable/test-mvp/main/board/';
const BOARDS=['_planning','catdoku','currency','decibel','mortgage','speedometer','tides','fuel-log','solunar','path-puzzle','bible-reading','verse-weave','gifts-kit','blessing-jar','ambient-engine'];
function pick(sec,label){const m=sec.match(new RegExp('^- \\**'+label+'\\**[^:：]*[:：]\\s*(.+)$','m'));return m?m[1].replace(/\*\*/g,'').trim():''}
async function load(b){
  try{
    const r=await fetch(RAW+b+'.md?t='+Date.now()); if(!r.ok) throw 0;
    const md=await r.text();
    const title=(md.match(/^#\s+(.+)$/m)||[,b])[1].replace(/ — .*$/,'');
    const i=md.indexOf('## 🔁 이어받기'); if(i<0) return null;
    const j=md.indexOf('\n## ',i+5); const sec=md.slice(i,j<0?undefined:j);
    const when=(pick(sec,'마지막 저장').split('·')[0]||'').trim();
    const next=pick(sec,'다음 할 일');
    const wait=pick(sec,'사용자 대기 중인 것');
    const pm=sec.match(/`([^`]*이어서[^`]*)`/); const prompt=pm?pm[1]:`soulfulfillable/test-mvp 의 board/${b}.md "🔁 이어받기" 를 읽고 "다음 할 일"부터 이어서 해줘.`;
    return {b,title,when,next,wait,prompt,sec};
  }catch(e){return {b,title:b,err:true}}
}
(async()=>{
  const items=(await Promise.all(BOARDS.map(load))).filter(Boolean);
  items.sort((a,c)=>(c.when||'').localeCompare(a.when||''));
  const L=document.getElementById('list'); L.innerHTML='';
  for(const it of items){
    const d=document.createElement('div'); d.className='card';
    if(it.err){d.innerHTML=`<div class="name">${it.title}</div><p class="err">불러오지 못했어요</p>`;L.append(d);continue}
    d.innerHTML=`<div class="top"><span class="name"></span><span class="when"></span></div>
      <p class="next"><b>다음</b> <span class="n"></span></p>${it.wait?'<p class="wait"></p>':''}
      <details><summary>자세히</summary><pre></pre></details><button>문장 복사</button>`;
    d.querySelector('.name').textContent=it.title;
    d.querySelector('.when').textContent=it.when;
    d.querySelector('.n').textContent=it.next||'—';
    if(it.wait) d.querySelector('.wait').textContent='사용자 대기: '+it.wait;
    d.querySelector('pre').textContent=it.sec.replace(/^## .*\n/,'');
    const btn=d.querySelector('button');
    btn.onclick=()=>{const done=()=>{btn.textContent='복사됨';btn.classList.add('done');setTimeout(()=>{btn.textContent='문장 복사';btn.classList.remove('done')},1400)};
      (navigator.clipboard?navigator.clipboard.writeText(it.prompt):Promise.reject()).then(done,done)};
    L.append(d);
  }
})();
</script>
</body>
</html>
