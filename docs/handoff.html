<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이어받기</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#6c6c70;--line:#e5e5ea;--acc:#0a7d6b;--warn:#b25000}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--sub:#98989f;--line:#2c2c2e;--acc:#3fc7ad;--warn:#ff9f0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;padding:16px 16px 48px}
h1{font-size:28px;font-weight:700;margin:8px 0 2px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top .name{min-width:0;flex:1}
.name{font-size:17px;font-weight:600}
.when{font-size:13px;color:var(--sub);white-space:nowrap}
.next{margin:8px 0 0;font-size:15px}
.next b{color:var(--acc);font-weight:600}
.wait{margin:6px 0 0;font-size:14px;color:var(--warn)}
details{margin-top:8px;font-size:14px;color:var(--sub)}
details pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);margin:8px 0 0}
button{margin-top:10px;width:100%;height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px -apple-system,sans-serif}
button.done{opacity:.6}
.btns{display:flex;gap:8px}.btns button{flex:1}button.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);flex:0 0 34%}
.sub{margin:2px 0 0;font-size:13px;color:var(--sub)}
.err{color:var(--warn);font-size:14px}
</style>
</head>
<body>
<h1>이어받기</h1>
<p class="lead">다른 계정에서 이어 갈 때. 위에서부터 순서대로: 새 세션(저장소 test-mvp) 열기 → <b>문장 복사</b> 붙여 넣기 → 세션 이름을 <b>이름 복사</b>로 바꾸고 핀. 그러면 왼쪽 목록이 지금과 똑같이 돼요. 각 세션이 단계마다 갱신해요.</p>
<div id="list"><p class="lead">불러오는 중…</p></div>
<script>
const RAW='https://raw.githubusercontent.com/soulfulfillable/test-mvp/main/board/';
// 세션 목록 = 사용자의 핀 순서·이름 그대로 (ops/sessions.md 와 같게 유지). 새 계정에서 이 순서대로 세션을 만들고 '이름 복사'로 제목을 붙인다.
const SESSIONS=[['_planning','0. Head'],['currency','1. Currency'],['catdoku','2. Dok'],['mortgage','3. Calculate'],['decibel','4. Decibel'],['tides','5. Tid'],['speedometer','6. Speed'],['fuel-log','7. MPG Log'],['solunar','8. Solunar'],['ambient-engine','9. Music'],['bible-reading','10. Tolle'],['how-it-works','How It Works 앱 개발'],['path-puzzle','Kitty Path'],['blessing-jar','Blessing Jar'],['gifts-kit','Gifts Kit'],['verse-weave','Verse Weave']];
const BOARDS=SESSIONS.map(x=>x[0]); const NAME=Object.fromEntries(SESSIONS);
function pick(sec,label){const m=sec.match(new RegExp('^- \\**'+label+'\\**[^:：]*[:：]\\s*(.+)$','m'));return m?m[1].replace(/\*\*/g,'').trim():''}
async function load(b){
  try{
    let md=null;
    for(let k=0;k<3&&md===null;k++){try{const r=await fetch(RAW+b+'.md?t='+Date.now());if(r.ok)md=await r.text();}catch(e){} if(md===null)await new Promise(z=>setTimeout(z,600*(k+1)));}
    if(md===null) throw 0;
    const title=(md.match(/^#\s+(.+)$/m)||[,b])[1].replace(/ — .*$/,'').replace(/\s*\(.*?\)\s*$/,'');
    const i=md.indexOf('## 🔁 이어받기'); if(i<0) return null;
    const j=md.indexOf('\n## ',i+5); const sec=md.slice(i,j<0?undefined:j);
    const wm=pick(sec,'마지막 저장').match(/\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{2})?/); const when=wm?wm[0]:'';
    const next=pick(sec,'다음 할 일');
    const wait=pick(sec,'사용자 대기 중인 것');
    const pm=sec.match(/`([^`]*이어서[^`]*)`/); const prompt=pm?pm[1]:`soulfulfillable/test-mvp 의 board/${b}.md "🔁 이어받기" 를 읽고 "다음 할 일"부터 이어서 해줘.`;
    return {b,title,when,next,wait,prompt,sec};
  }catch(e){return {b,title:b,err:true}}
}
(async()=>{
  const items=(await Promise.all(BOARDS.map(load))).filter(Boolean);
  const L=document.getElementById('list'); L.innerHTML='';
  for(const it of items){
    const d=document.createElement('div'); d.className='card';
    if(it.err){d.innerHTML=`<div class="name">${NAME[it.b]||it.title}</div><p class="err">불러오지 못했어요</p>`;L.append(d);continue}
    d.innerHTML=`<div class="top"><span class="name"></span><span class="when"></span></div><p class="sub"></p>
      <p class="next"><b>다음</b> <span class="n"></span></p>${it.wait?'<p class="wait"></p>':''}
      <details><summary>자세히</summary><pre></pre></details><div class="btns"><button class="ghost">이름 복사</button><button class="main">문장 복사</button></div>`;
    d.querySelector('.name').textContent=NAME[it.b]||it.title; d.querySelector('.sub').textContent=it.title;
    d.querySelector('.when').textContent=it.when;
    d.querySelector('.n').textContent=it.next||'—';
    if(it.wait) d.querySelector('.wait').textContent='사용자 대기: '+it.wait;
    d.querySelector('pre').textContent=it.sec.replace(/^## .*\n/,'');
    const copy=(btn,text)=>{const o=btn.textContent;const done=()=>{btn.textContent='복사됨';btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1400)};
      (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(done,done)};
    d.querySelector('.main').onclick=e=>copy(e.target,it.prompt);
    d.querySelector('.ghost').onclick=e=>copy(e.target,NAME[it.b]||it.title);
    L.append(d);
  }
})();
</script>
</body>
</html>
