<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6efe2">
<title>Hidden Little Friends</title>
<style>
:root{
  --ink:#3b2b28; --paper:#f6efe2; --muted:#8a7a70; --accent:#e8963a; --line:rgba(59,43,40,.14);
  --font: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e0cf;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* iOS in-app sheet guard: app is fixed, the document keeps a scroll cushion parked mid-way (PLAYBOOK) */
body{height:calc(100% + 240px)} html{height:100%}
#app{position:fixed;inset:0;display:flex;justify-content:center;touch-action:pan-y}
#frame{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
@media (min-width:600px){#frame{box-shadow:0 0 0 1px var(--line)}}

/* top: the one task */
#top{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;display:flex;align-items:center;gap:10px}
#task{flex:1;min-width:0}
#taskText{font-size:20px;font-weight:700;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#slots{display:flex;gap:3px;margin-top:5px}
.slot{width:30px;height:30px;border-radius:9px;background:#ebe2d2;display:grid;place-items:center;transition:background .3s}
.slot svg{width:28px;height:28px;filter:grayscale(1) brightness(1.25) opacity(.35);transition:filter .45s}
.slot.on{background:#fff}
.slot.on svg{filter:none}
.slot.pop{animation:slotPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes slotPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
#count{flex:none;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
#count small{font-size:15px;color:var(--muted);font-weight:600}

/* the scene: hero */
#stage{flex:1;min-height:0;position:relative}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}

/* bottom bar */
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);gap:10px}
.btn{appearance:none;border:0;background:none;color:var(--ink);font:inherit;padding:0;cursor:pointer}
.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ebe2d2}
.icon svg{width:24px;height:24px}
.icon:active,.hint:active,.cta:active,.ghost:active{transform:scale(.95)}
.hint{height:48px;padding:0 20px 0 14px;border-radius:24px;background:#fff;box-shadow:0 0 0 1.5px var(--line);display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;position:relative}
.hint svg{width:26px;height:26px}
.hint[disabled]{opacity:.45}
.hint .fill{position:absolute;left:0;bottom:0;height:3px;border-radius:2px;background:var(--accent);width:0}

/* sheets (menu / postcard) — only ever shown when no search is in progress, or over a paused game */
.veil{position:absolute;inset:0;background:rgba(40,28,24,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:6;max-height:92%;overflow:auto}
.sheet.show{transform:none}
.sheet h2{margin:0 0 2px;font-size:22px;font-weight:700}
.sheet p{margin:0;color:var(--muted);font-size:15px}
.cta{display:block;width:100%;height:50px;border-radius:14px;border:0;background:var(--ink);color:#fff;font:inherit;font-size:17px;font-weight:600;margin-top:14px;cursor:pointer}
.ghost{display:block;width:100%;height:46px;border-radius:14px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;margin-top:6px;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
#postcard{margin:14px auto 0;width:min(84%,320px,calc((100vh - 300px) * 1.1));background:#fff;padding:9px 9px 12px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 24px rgba(59,43,40,.18);transform:rotate(-2deg) translateY(30px) scale(.9);opacity:0;transition:transform .7s cubic-bezier(.2,1.3,.35,1) .15s,opacity .4s .15s;position:relative}
.sheet.show #postcard{transform:rotate(-2deg);opacity:1}
#postcard svg{display:block;width:100%;height:auto;border-radius:3px}
#postcard .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:14px;font-weight:600}
#postcard .cap span{color:var(--muted);font-weight:600;font-size:12px}
#postcard .stamp{position:absolute;right:-12px;top:-14px;width:54px;height:54px;transform:rotate(12deg)}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.card{background:#fff;border-radius:10px;padding:5px 5px 8px;box-shadow:0 0 0 1.5px var(--line);text-align:left;position:relative}
.card.cur{box-shadow:0 0 0 2.5px var(--accent)}
.card svg{display:block;width:100%;height:auto;border-radius:6px}
.card b{display:block;font-size:13px;margin-top:5px}
.card i{font-style:normal;font-size:12px;color:var(--muted)}
.card.locked svg{filter:grayscale(1) blur(1.5px) opacity(.5)}
.row{display:flex;gap:8px}
.row .ghost{flex:1}

/* scene fx */
.fr{cursor:pointer}
.blinkEye{transform-box:fill-box;transform-origin:center;animation:blink .26s ease-in-out}
@keyframes blink{50%{transform:scaleY(.08)}}
.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig .7s ease-in-out}
@keyframes wig{20%{transform:rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
.sing{transform-box:fill-box;transform-origin:50% 100%;animation:sing .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes sing{0%{transform:scale(1,1)}35%{transform:scale(.92,1.12) translateY(-3px)}100%{transform:scale(1,1)}}
@media (prefers-reduced-motion:reduce){.sing,.wig{animation:none}}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:7px 13px;border-radius:12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="frame">
  <div id="top">
    <div id="task"><div id="taskText">Find 5 frogs</div><div id="slots"></div></div>
    <div id="count" aria-live="polite">0<small> / 5</small></div>
  </div>
  <div id="stage">
    <svg id="scene" viewBox="0 0 400 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Scene"></svg>
    <div class="toast" id="toast"></div>
  </div>
  <div id="bar">
    <button class="btn icon" id="menuBtn" aria-label="Scenes"><svg viewBox="0 0 24 24" fill="none" stroke="#3b2b28" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
    <button class="btn hint" id="hintBtn" aria-label="Hint"><svg viewBox="0 0 26 26" fill="none" stroke="#3b2b28" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2 22 22"/><path d="M8 9.2a3.4 3.4 0 0 1 3-2.2" stroke="#e8963a"/></svg>Hint<i class="fill" id="hintFill"></i></button>
    <button class="btn icon" id="soundBtn" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="#3b2b28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#3b2b28"/><path id="sndWave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path id="sndOff" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
  </div>
  <div class="veil" id="veil"></div>
  <div class="sheet" id="doneSheet" role="dialog" aria-label="Scene complete">
    <h2 id="doneTitle">The pond choir is complete</h2>
    <p id="doneSub">Postcard added to your collection</p>
    <div id="postcard"></div>
    <button class="cta" id="nextBtn">Next scene</button>
    <button class="ghost" id="againBtn">Play again</button>
  </div>
  <div class="sheet" id="menuSheet" role="dialog" aria-label="Scenes">
    <h2>Postcards</h2>
    <p id="menuSub">Find every friend to collect a scene.</p>
    <div id="cards"></div>
    <div class="row"><button class="ghost" id="restartBtn">Restart this scene</button><button class="ghost" id="closeBtn">Close</button></div>
  </div>
</div></div>
<script>
'use strict';
/* ============================================================
   Hidden Little Friends — find the hidden friends, they gather and complete a tiny scene together.
   All art is drawn here in SVG: one ink colour, one line weight, light from the top-left.
   ============================================================ */
const W = 400, H = 720, INK = '#3b2b28', SW = 2.4;
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const svgEl = $('scene');

/* ---------- tiny seeded random (decor layout is fixed per scene) ---------- */
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const st = (c) => `stroke="${c||INK}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"`;
const hl = (cx, cy, rx, ry, rot) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".28" transform="rotate(${rot||-20} ${cx} ${cy})"/>`;

/* ---------- eyes: the shared "tell" of every friend ---------- */
function eye(x, y, r, mode, lid){
  if (mode === 'sleep') return `<path d="M${x-r} ${y} Q${x} ${y+r*.9} ${x+r} ${y}" fill="none" ${st()}/>`;
  let s = `<g class="eyeG"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${st()}/><circle cx="${x+r*.12}" cy="${y+r*.1}" r="${r*.56}" fill="${INK}"/><circle cx="${x-r*.12}" cy="${y-r*.22}" r="${r*.2}" fill="#fff"/>`;
  if (mode === 'half') s += `<path d="M${x-r-1} ${y+.5} A${r+1} ${r+1} 0 0 1 ${x+r+1} ${y+.5} Z" fill="${lid}" ${st()}/>`;
  return s + '</g>';
}
const dotEye = (x, y, r) => `<g class="eyeG"><circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x-r*.3}" cy="${y-r*.35}" r="${r*.32}" fill="#fff"/></g>`;
const cheek = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.4" fill="#ff8f9a" opacity=".75"/>`;

/* ---------- the friends (centre ≈ 0,0; about 50 units wide) ---------- */
const ART = {
  frog(p){
    return `<ellipse cx="-16" cy="20" rx="8" ry="4.5" fill="${p.skin}" ${st()}/><ellipse cx="16" cy="20" rx="8" ry="4.5" fill="${p.skin}" ${st()}/>
    <circle cx="-12" cy="-10" r="10" fill="${p.skin}" ${st()}/><circle cx="12" cy="-10" r="10" fill="${p.skin}" ${st()}/>
    <ellipse cx="0" cy="5" rx="25" ry="17" fill="${p.skin}" ${st()}/><ellipse cx="0" cy="10" rx="14" ry="9" fill="${p.belly}"/>
    ${hl(-10,-1,8,3.5)}
    ${eye(-12,-11,6.2,p.eye,p.skin)}${eye(12,-11,6.2,p.eye,p.skin)}
    <path d="M-8 4 Q0 10 8 4" fill="none" ${st()}/>${p.cheek?cheek(-15,5)+cheek(15,5):''}`;
  },
  capy(p){
    return `<ellipse cx="9" cy="-15" rx="5" ry="4" fill="${p.ear}" ${st()}/>
    <ellipse cx="-7" cy="4" rx="30" ry="17" fill="${p.skin}" ${st()}/>
    <ellipse cx="17" cy="-2" rx="16" ry="13.5" fill="${p.skin}" ${st()}/>
    <rect x="25" y="-11" width="15" height="17" rx="7" fill="${p.snout}" ${st()}/>
    <ellipse cx="36.5" cy="-5" rx="1.7" ry="1.1" fill="${INK}"/>
    ${hl(-14,-6,12,4)}
    ${p.eye==='sleep'?eye(20,-5,3.4,'sleep'):dotEye(21,-5,2.6)}
    ${p.cheek?cheek(21,2):''}${p.yuzu?`<circle cx="12" cy="-20" r="7" fill="#f7b733" ${st()}/><path d="M12 -27 q4 -4 8 -2 q-3 4 -8 2z" fill="#7cb85a" ${st()}/>`:''}`;
  },
  hedgehog(p){
    let d = 'M-26 12', n = 15;
    for (let i = 0; i <= n; i++){ const a = Math.PI*(1 - i/n*0.86), r = i%2 ? 31 : 22; d += ` L${(-4+Math.cos(a)*r).toFixed(1)} ${(10-Math.sin(a)*r).toFixed(1)}`; }
    return `<path d="${d} Z" fill="${p.spikes}" ${st()}/><ellipse cx="13" cy="5" rx="13" ry="10" fill="${p.face}" ${st()}/>
    <circle cx="26" cy="3" r="3" fill="${INK}"/>${p.eye==='sleep'?eye(15,1,3.2,'sleep'):dotEye(16,1,2.4)}${p.cheek?cheek(14,8):''}`;
  },
  mouse(p){
    return `<ellipse cx="0" cy="18" rx="13" ry="11" fill="${p.fur}" ${st()}/>
    <circle cx="-11" cy="-10" r="8" fill="${p.fur}" ${st()}/><circle cx="11" cy="-10" r="8" fill="${p.fur}" ${st()}/>
    <circle cx="-11" cy="-10" r="4" fill="${p.inner}"/><circle cx="11" cy="-10" r="4" fill="${p.inner}"/>
    <circle cx="0" cy="1" r="12" fill="${p.fur}" ${st()}/>${hl(-5,-5,5,2.5)}
    ${p.eye==='sleep'?eye(-5,0,2.8,'sleep')+eye(5,0,2.8,'sleep'):dotEye(-5,0,2.2)+dotEye(5,0,2.2)}
    <circle cx="0" cy="6" r="2" fill="${p.inner}" ${st()}/>${p.cheek?cheek(-8,6)+cheek(8,6):''}`;
  },
  bunny(p){
    return `<ellipse cx="0" cy="20" rx="14" ry="11" fill="${p.fur}" ${st()}/>
    <ellipse cx="-6" cy="-22" rx="5" ry="14" fill="${p.fur}" ${st()} transform="rotate(-8 -6 -22)"/><ellipse cx="6" cy="-22" rx="5" ry="14" fill="${p.fur}" ${st()} transform="rotate(10 6 -22)"/>
    <ellipse cx="-6" cy="-21" rx="2.2" ry="9" fill="${p.inner}" transform="rotate(-8 -6 -21)"/><ellipse cx="6" cy="-21" rx="2.2" ry="9" fill="${p.inner}" transform="rotate(10 6 -21)"/>
    <circle cx="0" cy="2" r="13" fill="${p.fur}" ${st()}/>${hl(-5,-4,5,2.5)}
    ${p.eye==='sleep'?eye(-5,1,3,'sleep')+eye(5,1,3,'sleep'):dotEye(-5,1,2.3)+dotEye(5,1,2.3)}
    <path d="M-2 6.5 h4 l-2 2z" fill="${p.inner}" ${st()}/>${p.cheek?cheek(-9,7)+cheek(9,7):''}`;
  },
  owl(p){
    return `<path d="M-15 -14 L-12 -26 L-5 -17 Z M15 -14 L12 -26 L5 -17 Z" fill="${p.body}" ${st()}/>
    <ellipse cx="0" cy="2" rx="17" ry="20" fill="${p.body}" ${st()}/><ellipse cx="0" cy="9" rx="10" ry="11" fill="${p.belly}"/>
    <circle cx="-7" cy="-6" r="7" fill="${p.mask}"/><circle cx="7" cy="-6" r="7" fill="${p.mask}"/>
    ${p.eye==='sleep'?eye(-7,-6,4,'sleep')+eye(7,-6,4,'sleep'):eye(-7,-6,4.6,'open')+eye(7,-6,4.6,'open')}
    <path d="M-2.5 0 L2.5 0 L0 4.5 Z" fill="#f2a93b" ${st()}/>${p.cheek?cheek(-11,3)+cheek(11,3):''}`;
  },
  snail(p){
    return `<path d="M-26 14 Q-26 6 -14 6 L18 6 Q26 6 26 -6 L28 -16 M22 -6 L21 -17" fill="none" ${st()}/>
    <path d="M-26 14 Q-26 6 -14 6 L16 6 Q24 6 25 -4 Q28 14 14 14 Z" fill="${p.body}" ${st()}/>
    <circle cx="28" cy="-17" r="2.4" fill="${INK}"/><circle cx="21" cy="-18" r="2.4" fill="${INK}"/>
    <circle cx="-4" cy="-6" r="15" fill="${p.shell}" ${st()}/><path d="M-4 -6 m0 0 a3 3 0 1 1 3 3 a7 7 0 1 1 -7 -9 a11 11 0 1 1 12 11" fill="none" ${st()}/>
    ${hl(-10,-14,6,3)}${p.eye==='sleep'?eye(21,0,2.6,'sleep'):dotEye(21,0,2.2)}${p.cheek?cheek(17,8):''}`;
  },
  bird(p){
    return `<path d="M-14 4 L-25 -2 L-24 10 Z" fill="${p.body}" ${st()}/><circle cx="0" cy="2" r="14" fill="${p.body}" ${st()}/>
    <ellipse cx="2" cy="8" rx="8" ry="6" fill="${p.belly}"/><path d="M-8 2 q6 8 12 0" fill="none" ${st()}/>${hl(-5,-5,5,2.5)}
    <path d="M12 -2 L20 1 L12 4 Z" fill="#f2a93b" ${st()}/>${p.eye==='sleep'?eye(6,-3,2.8,'sleep'):dotEye(7,-3,2.2)}${p.cheek?cheek(6,4):''}`;
  },
  cat(p){
    return `<path d="M18 14 q16 -2 12 -14" fill="none" stroke="${INK}" stroke-width="7.5" stroke-linecap="round"/><path d="M18 14 q16 -2 12 -14" fill="none" stroke="${p.fur}" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="4" cy="8" rx="22" ry="12" fill="${p.fur}" ${st()}/>
    <path d="M-19 -6 L-17 -20 L-9 -12 Z M-1 -12 L5 -21 L5 -6 Z" fill="${p.fur}" ${st()}/>
    <circle cx="-8" cy="-2" r="12" fill="${p.fur}" ${st()}/>${hl(-12,-7,5,2.5)}
    ${p.eye==='sleep'?eye(-13,-1,3,'sleep')+eye(-3,-1,3,'sleep'):dotEye(-13,-1,2.4)+dotEye(-3,-1,2.4)}
    <path d="M-9.5 4 h3 l-1.5 1.6z" fill="#ff8f9a" ${st()}/>${p.cheek?cheek(-16,4)+cheek(0,4):''}`;
  },
};
/* palettes: camo (hiding, takes the colours of where it hides) / found (its own colours) */
const LOOK = {
  frog:    { found:{skin:'#86d15a',belly:'#f4e27a',eye:'open',cheek:1} },
  capy:    { found:{skin:'#c08752',ear:'#99643a',snout:'#8f5d3b',eye:'open',cheek:1} },
  hedgehog:{ found:{spikes:'#8a6248',face:'#f1d3a8',eye:'open',cheek:1} },
  mouse:   { found:{fur:'#c9c3cf',inner:'#ffb3bd',eye:'open',cheek:1} },
  bunny:   { found:{fur:'#fbf6ee',inner:'#ffb3bd',eye:'open',cheek:1} },
  owl:     { found:{body:'#b5845a',belly:'#efd9b2',mask:'#f7ecd6',eye:'open',cheek:1} },
  snail:   { found:{body:'#f0d9a0',shell:'#e58a5c',eye:'open',cheek:1} },
  bird:    { found:{body:'#6fb3e8',belly:'#e9f4fb',eye:'open',cheek:1} },
  cat:     { found:{fur:'#f4a95c',eye:'open',cheek:1} },
};
function drawFriend(f, look){ return `<g transform="scale(${f.flip?-1:1},1)">${ART[f.kind](look)}</g>`; }

const CAPY_CAMO = [
  {skin:'#b8ab9b',ear:'#a89a89',snout:'#aa9c8c',eye:'sleep'},
  {skin:'#ab9e8f',ear:'#9c8f80',snout:'#9f9283',eye:'sleep'},
  {skin:'#c2b6a6',ear:'#b2a596',snout:'#b4a898',eye:'sleep'},
];
/* ---------- shared decor ---------- */
function pad(x, y, r, c, rot){ // lily pad with a notch
  const ry = r*.62, a = (rot||0), cx = (r*Math.cos(.32)).toFixed(1), cy = (ry*Math.sin(.32)).toFixed(1);
  return `<g transform="translate(${x} ${y}) rotate(${a})"><path d="M0 0 L${cx} ${-cy} A${r} ${ry} 0 1 0 ${cx} ${cy} Z" fill="${c}" ${st()}/>
  <path d="M0 0 L${-r*.6} ${-ry*.5} M0 0 L${-r*.7} ${ry*.35} M0 0 L${r*.1} ${ry*.75}" stroke="${INK}" stroke-opacity=".22" stroke-width="1.6" fill="none"/></g>`;
}
function lotus(x, y, s){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 4 C-10 2 -14 -8 -12 -12 C-6 -10 -2 -6 0 -2 C2 -6 6 -10 12 -12 C14 -8 10 2 0 4Z" fill="#f7a8b8" ${st()}/><path d="M0 2 C-5 -4 -4 -12 0 -16 C4 -12 5 -4 0 2Z" fill="#fbc9d3" ${st()}/></g>`;
}
function rock(x, y, rx, ry, c, rot){
  return `<g transform="translate(${x} ${y}) rotate(${rot||0})"><path d="M${-rx} ${ry*.35} C${-rx} ${-ry*.9} ${-rx*.35} ${-ry} 0 ${-ry} C${rx*.5} ${-ry} ${rx} ${-ry*.7} ${rx} ${ry*.2} C${rx} ${ry} ${rx*.6} ${ry} 0 ${ry} C${-rx*.7} ${ry} ${-rx} ${ry} ${-rx} ${ry*.35}Z" fill="${c}" ${st()}/>${hl(-rx*.35,-ry*.45,rx*.35,ry*.18)}</g>`;
}
function bush(x, y, r, c, seed){
  const R = rng(seed); let d = '';
  const n = 7, parts = [];
  for (let i = 0; i < n; i++){ const a = Math.PI*(1 - i/(n-1)); parts.push(`<circle cx="${(x+Math.cos(a)*r*.75).toFixed(1)}" cy="${(y-Math.sin(a)*r*.55).toFixed(1)}" r="${(r*(0.55+R()*0.15)).toFixed(1)}"`); }

/* ============================================================
   STATE + SAVE
   ============================================================ */
const KEY = 'hlf.v1';
let save = { scene:0, found:{}, done:{}, mute:false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }

let cur = null;           // current scene def
let found = new Set();    // indices found in current scene
let nodes = [];           // per friend: {camo, actor}
let busy = false, completeShown = false, lastFind = performance.now();
const timers = [];
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers.length = 0; }

/* ============================================================
   AUDIO (real files, Web Audio for low latency)
   ============================================================ */
let ctx = null; const buf = {};
const SFX = ['found','miss','hint','done','tap','card'];
function audioInit(){
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ctx = new AC();
  const names = SFX.slice(); ['pond','spring','night'].forEach(n => { for (let i = 0; i < 8; i++) names.push(`${n}-n${i}`); });
  names.forEach(n => fetch(`audio/${n}.mp3`).then(r => r.arrayBuffer()).then(a => ctx.decodeAudioData(a)).then(b => buf[n] = b).catch(() => {}));
}
function play(name, vol, when){
  if (save.mute || !ctx || !buf[name]) return;
  const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf[name]; g.gain.value = vol == null ? .8 : vol;
  s.connect(g).connect(ctx.destination); s.start(ctx.currentTime + (when || 0));
}
const note = (i, vol, when) => play(`${cur.notes}-n${i % 8}`, vol, when);
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

/* ============================================================
   RENDER
   ============================================================ */
function sceneSVG(def, allFound){ // static picture (postcards, menu)
  let s = def.back();
  def.seats.forEach((p, i) => { if (!allFound) s += def.seatMark(p[0], p[1], i); });
  if (def.lanterns) def.lanterns.forEach((p) => s += lantern(p[0], p[1], allFound));
  def.friends.forEach((f, i) => {
    if (allFound){
      const [x, y] = def.seats[i], look = Object.assign({}, LOOK[f.kind].found, def.yuzu ? {yuzu:1} : {});
      s += `<g transform="translate(${x} ${y}) scale(${def.seatScale})">${drawFriend({kind:f.kind, flip:i%2&&def.id!=='pond'}, look)}</g>`;
    } else {
      s += `<g transform="translate(${f.x} ${f.y}) scale(${f.s})">${drawFriend(f, f.camo)}</g>`;
      if (f.cover) s += def.covers[f.cover](f);
    }
  });
  s += def.front();
  if (def.dark) s += `<rect width="400" height="720" fill="#101830" opacity="${allFound ? 0 : .28}" pointer-events="none"/>`;
  return s;
}
function lantern(x, y, on){
  return `<g class="lan" data-x="${x}"><path d="M${x} ${y-10} v6" ${st()}/>${on?`<circle cx="${x}" cy="${y+6}" r="20" fill="#ffd77a" opacity=".35"/>`:''}
  <rect x="${x-7}" y="${y-4}" width="14" height="18" rx="5" fill="${on?'#ffd77a':'#5a6378'}" ${st()}/><path d="M${x-4} ${y-4} h8" ${st()}/></g>`;
}

function buildScene(idx){
  clearTimers(); busy = false; completeShown = false;
  cur = SCENES[idx]; save.scene = idx; persist();
  found = new Set(save.found[cur.id] || []);
  svgEl.innerHTML = '';
  svgEl.style.background = cur.bg;
  const L = (cls) => { const g = document.createElementNS(NS, 'g'); g.setAttribute('class', cls); svgEl.appendChild(g); return g; };
  const back = L('back'); back.innerHTML = cur.back();
  const marks = L('marks'); cur.seats.forEach((p, i) => { const g = document.createElementNS(NS,'g'); g.innerHTML = cur.seatMark(p[0], p[1], i); g.setAttribute('data-seat', i); marks.appendChild(g); });
  const lans = L('lans'); if (cur.lanterns) cur.lanterns.forEach((p, i) => { const g = document.createElementNS(NS,'g'); g.innerHTML = lantern(p[0], p[1], found.has(i)); g.setAttribute('data-l', i); lans.appendChild(g); });
  const seatLayer = L('seated');
  const front = L('front'); front.innerHTML = cur.front();
  const hide = L('hide');
  nodes = cur.friends.map((f, i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${f.x} ${f.y}) scale(${f.s})`);
    g.setAttribute('class', 'fr'); g.setAttribute('data-i', i);
    g.innerHTML = drawFriend(f, f.camo);
    const c = document.createElementNS(NS, 'g'); if (f.cover) c.innerHTML = cur.covers[f.cover](f);
    hide.appendChild(g); hide.appendChild(c);
    return { camo:g, cover:c, actor:null };
  });
  const dark = L('dark'); if (cur.dark){ dark.innerHTML = `<rect width="400" height="720" fill="#101830" opacity="${darkness()}" pointer-events="none"/>`; }
  L('fx'); L('actors');
  // already-found friends sit in their seats
  found.forEach(i => { nodes[i].camo.style.display = 'none'; seat(i, false); });
  if (cur.finale && found.size === cur.friends.length){ /* finished earlier: show the finished scene quietly */ }
  // HUD
  $('taskText').textContent = cur.task;
  const slots = $('slots'); slots.innerHTML = '';
  cur.friends.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'slot' + (found.has(i) ? ' on' : '');
    d.innerHTML = `<svg viewBox="-34 -34 68 68"><g transform="scale(.95)">${drawFriend({kind:f.kind}, LOOK[f.kind].found)}</g></svg>`;
    slots.appendChild(d);
  });
  updateCount();
  lastFind = performance.now();
  tellLoop(); choirLoop();
  if (found.size === cur.friends.length) later(() => showDone(false), 400);
}
const darkness = () => cur.dark ? .3 * (1 - found.size / cur.friends.length) : 0;
function updateCount(){ $('count').innerHTML = `${found.size}<small> / ${cur.friends.length}</small>`; }

/* a found friend sits on its seat (stage layer) */
function seat(i, animate){
  const f = cur.friends[i], [sx, sy] = cur.seats[i], sc = cur.seatScale;
  const look = Object.assign({}, LOOK[f.kind].found, cur.yuzu ? {yuzu:1} : {});
  const flip = i % 2 && cur.id !== 'pond';
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('transform', `translate(${sx} ${sy}) scale(${sc})`);
  g.innerHTML = `<g class="body">${drawFriend({kind:f.kind, flip}, look)}</g>`;
  g.setAttribute('data-seated', i);
  svgEl.querySelector('.seated').appendChild(g);
  const m = svgEl.querySelector(`[data-seat="${i}"]`); if (m) m.style.display = 'none';
  if (cur.lanterns){ const l = svgEl.querySelector(`[data-l="${i}"]`); if (l) l.innerHTML = lantern(cur.lanterns[i][0], cur.lanterns[i][1], true); }
  nodes[i].seated = g;
  if (animate){ const b = g.querySelector('.body'); b.classList.add('sing'); later(() => b.classList.remove('sing'), 450); }
}

/* ============================================================
   INPUT
   ============================================================ */
function toScene(cx, cy){ const p = svgEl.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svgEl.getScreenCTM().inverse()); }
function hitRadius(f){ return Math.max(30, 28 * f.s); }
svgEl.addEventListener('pointerdown', (e) => {
  audioInit();
  if (!cur || completeShown) return;
  const p = toScene(e.clientX, e.clientY);
  let best = -1, bd = 1e9;
  cur.friends.forEach((f, i) => { if (found.has(i)) return; const d = Math.hypot(p.x - f.x, p.y - f.y); if (d < hitRadius(f) && d < bd){ bd = d; best = i; } });
  if (best >= 0) find(best); else miss(p);
});

function find(i){
  found.add(i); save.found[cur.id] = [...found]; persist(); lastFind = performance.now();
  const f = cur.friends[i];
  play('found', .7); note(i, .9, .05); buzz(18);
  // 1) colour in on the spot with a ring burst
  const fx = svgEl.querySelector('.fx'), actors = svgEl.querySelector('.actors');
  const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('cx', f.x); ring.setAttribute('cy', f.y); ring.setAttribute('r', 10);
  ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#fff'); ring.setAttribute('stroke-width', 4); fx.appendChild(ring);
  ring.animate([{r:10, opacity:1}, {r:52, opacity:0}], {duration:520, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => ring.remove();
  sparkle(f.x, f.y);
  nodes[i].camo.style.display = 'none';
  const a = document.createElementNS(NS, 'g');
  const look = Object.assign({}, LOOK[f.kind].found, cur.yuzu ? {yuzu:1} : {});
  a.innerHTML = `<g class="body">${drawFriend(f, look)}</g>`;
  actors.appendChild(a); nodes[i].actor = a;
  // slot + count
  const slot = $('slots').children[i]; slot.classList.add('on', 'pop'); setTimeout(() => slot.classList.remove('pop'), 520);
  updateCount();
  if (cur.dark) svgEl.querySelector('.dark rect').animate([{opacity:darkness() + .3/cur.friends.length}, {opacity:darkness()}], {duration:800, fill:'forwards'});
  // 2) pop, then hop along an arc to its seat
  const [sx, sy] = cur.seats[i], s0 = f.s, s1 = cur.seatScale;
  const t0 = performance.now(), pop = 380, fly = 720;
  const flip = (i % 2 && cur.id !== 'pond') ? -1 : 1;
  const step = (now) => {
    const t = now - t0;
    if (t < pop){
      const k = t / pop, sc = s0 * (1 + .28 * Math.sin(k * Math.PI));
      a.setAttribute('transform', `translate(${f.x} ${f.y - 10 * Math.sin(k * Math.PI)}) scale(${sc})`);
    } else if (t < pop + fly){
      const k = (t - pop) / fly, e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
      const x = f.x + (sx - f.x) * e, y = f.y + (sy - f.y) * e - Math.sin(e * Math.PI) * 90;
      const sc = s0 + (s1 - s0) * e;
      a.setAttribute('transform', `translate(${x} ${y}) scale(${sc * (k > .5 && flip < 0 ? 1 : 1)})`);
    } else {
      a.remove(); nodes[i].actor = null; seat(i, true); note(i, .7);
      if (found.size === cur.friends.length) complete();
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function sparkle(x, y){
  const fx = svgEl.querySelector('.fx');
  for (let k = 0; k < 7; k++){
    const a = k / 7 * Math.PI * 2 + Math.random() * .4, d = 34 + Math.random() * 16;
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 3.2);
    c.setAttribute('fill', ['#ffd77a','#fff','#ff8f9a'][k % 3]); fx.appendChild(c);
    c.animate([{transform:'translate(0,0)', opacity:1}, {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`, opacity:0}], {duration:560, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => c.remove();
  }
}
function miss(p){
  play('miss', .5); buzz(6);
  const fx = svgEl.querySelector('.fx');
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 6);
  c.setAttribute('fill', 'none'); c.setAttribute('stroke', cur.dark ? '#fff' : INK); c.setAttribute('stroke-opacity', '.5'); c.setAttribute('stroke-width', 2.5);
  c.setAttribute('class', 'missRing'); fx.appendChild(c);
  c.animate([{r:6, opacity:1}, {r:20, opacity:0}], {duration:380, easing:'ease-out'}).onfinish = () => c.remove();
}

/* ============================================================
   TELLS (built-in, always on: a hidden friend gives itself away now and then)
   ============================================================ */
function tellLoop(){
  const run = () => {
    if (!cur || completeShown) return;
    const left = cur.friends.map((f, i) => i).filter(i => !found.has(i));
    if (left.length){
      const i = left[(Math.random() * left.length) | 0];
      tell(i);
    }
    later(run, 2600 + Math.random() * 1800);
  };
  later(run, 1200);
}
function tell(i){
  const n = nodes[i], f = cur.friends[i]; if (!n || found.has(i)) return;
  if (cur.tell === 'blink'){ n.camo.querySelectorAll('.eyeG').forEach(e => { e.classList.remove('blinkEye'); void e.getBBox(); e.classList.add('blinkEye'); }); }
  else if (cur.tell === 'ear'){ n.camo.firstElementChild.classList.remove('wig'); void n.camo.getBBox(); n.camo.firstElementChild.classList.add('wig'); }
  else { // z
    const fx = svgEl.querySelector('.fx'), t = document.createElementNS(NS, 'text');
    t.textContent = 'z'; t.setAttribute('x', f.x + 14); t.setAttribute('y', f.y - 22); t.setAttribute('fill', '#e8eefc');
    t.setAttribute('font-size', 16); t.setAttribute('font-weight', 700); t.setAttribute('font-family', 'ui-rounded, -apple-system, system-ui');
    t.setAttribute('pointer-events', 'none'); fx.appendChild(t);
    t.animate([{transform:'translate(0,0)', opacity:0}, {opacity:.9, offset:.25}, {transform:'translate(10px,-26px)', opacity:0}], {duration:1700, easing:'ease-out'}).onfinish = () => t.remove();
  }
}

/* ============================================================
   CHOIR (signature): everyone already seated sings their note in turn — the song grows with every find
   ============================================================ */
function choirLoop(){
  const run = () => {
    if (!cur || completeShown) return;
    const seated = [...found].sort((a, b) => a - b);
    if (seated.length && performance.now() - lastFind > 1400){
      seated.forEach((i, k) => {
        note(i, .32, k * .2);
        later(() => { const s = nodes[i] && nodes[i].seated; if (s){ const b = s.querySelector('.body'); b.classList.remove('sing'); void b.getBBox(); b.classList.add('sing'); } }, k * 200);
      });
    }
    later(run, 4200);
  };
  later(run, 2600);
}

/* ============================================================
   HINT — gentle, free, never required
   ============================================================ */
let hintReadyAt = 0;
$('hintBtn').addEventListener('click', () => {
  audioInit();
  if (!cur || completeShown || performance.now() < hintReadyAt) return;
  const left = cur.friends.map((f, i) => i).filter(i => !found.has(i)); if (!left.length) return;
  const i = left[0], f = cur.friends[i];
  play('hint', .6);
  const fx = svgEl.querySelector('.fx');
  const ox = (Math.random() - .5) * 40, oy = (Math.random() - .5) * 40;
  const g = document.createElementNS(NS, 'circle'); g.setAttribute('cx', f.x + ox); g.setAttribute('cy', f.y + oy); g.setAttribute('r', 78);
  g.setAttribute('fill', '#fff7d6'); g.setAttribute('opacity', 0); g.setAttribute('class', 'hintGlow'); g.setAttribute('pointer-events', 'none');
  fx.insertBefore(g, fx.firstChild);
  g.animate([{opacity:0, r:110}, {opacity:.42, r:78, offset:.3}, {opacity:.42, r:72, offset:.8}, {opacity:0, r:72}], {duration:2600, easing:'ease-in-out'}).onfinish = () => g.remove();
  later(() => tell(i), 500); later(() => tell(i), 1500);
  hintReadyAt = performance.now() + 5000;
  const b = $('hintBtn'), fill = $('hintFill'); b.disabled = true;
  fill.animate([{width:'0%'}, {width:'100%'}], {duration:5000});
  setTimeout(() => { b.disabled = false; }, 5000);
});

/* ============================================================
   COMPLETE → everyone together → postcard
   ============================================================ */
function complete(){
  completeShown = true; clearTimers();
  if (!save.done[cur.id]) save.done[cur.id] = true; persist();
  // the whole group performs: notes up and down, then a chord
  const n = cur.friends.length;
  for (let r = 0; r < 2; r++) for (let i = 0; i < n; i++){
    const k = r * n + i, idx = r ? n - 1 - i : i;
    note(idx, .55, .25 + k * .13);
    later(() => { const s = nodes[idx].seated; if (s){ const b = s.querySelector('.body'); b.classList.remove('sing'); void b.getBBox(); b.classList.add('sing'); } }, 250 + k * 130);
  }
  const chordAt = .25 + 2 * n * .13 + .1;
  [0, 2, 4].forEach(i => note(i, .5, chordAt));
  later(() => play('done', .7), chordAt * 1000 + 150);
  cur.finale && cur.finale();
  later(() => showDone(true), chordAt * 1000 + 1100);
}
function showDone(fresh){
  completeShown = true;
  $('doneTitle').textContent = cur.doneTitle;
  const nDone = SCENES.filter(s => save.done[s.id]).length;
  $('doneSub').textContent = `Postcard ${nDone} of ${SCENES.length} collected`;
  $('postcard').innerHTML = `<svg viewBox="0 30 400 330" style="background:${cur.bg}">${sceneSVG(cur, true)}</svg><div class="cap">${cur.title}<span>${cur.friends.length} friends</span></div>
    <svg class="stamp" viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" rx="4" fill="#fff" stroke="${INK}" stroke-width="2" stroke-dasharray="3 3"/><g transform="translate(30 32) scale(.62)">${drawFriend({kind:cur.friends[0].kind}, Object.assign({}, LOOK[cur.friends[0].kind].found))}</g></svg>`;
  const last = save.scene >= SCENES.length - 1;
  $('nextBtn').textContent = last ? 'See all postcards' : 'Next scene';
  if (fresh) play('card', .6);
  openSheet('doneSheet');
}

/* ============================================================
   SHEETS
   ============================================================ */
let openId = null;
function openSheet(id){ closeSheet(true); openId = id; $('veil').classList.add('show'); $(id).classList.add('show'); }
function closeSheet(silent){ if (openId) $(openId).classList.remove('show'); $('veil').classList.remove('show'); openId = null; }
$('nextBtn').addEventListener('click', () => {
  audioInit(); play('tap', .5);
  if (save.scene >= SCENES.length - 1){ openMenu(); return; }
  closeSheet(); buildScene(save.scene + 1);
});
$('againBtn').addEventListener('click', () => { audioInit(); play('tap', .5); closeSheet(); restart(); });
function restart(){ save.found[cur.id] = []; persist(); buildScene(save.scene); }
function openMenu(){
  const box = $('cards'); box.innerHTML = '';
  SCENES.forEach((s, i) => {
    const n = (save.found[s.id] || []).length, done = !!save.done[s.id];
    const b = document.createElement('button'); b.className = 'btn card' + (i === save.scene ? ' cur' : ''); b.setAttribute('data-scene', i);
    b.innerHTML = `<svg viewBox="0 0 400 720" style="background:${s.bg}">${sceneSVG(s, done)}</svg><b>${s.title}</b><i>${done ? 'Collected' : n ? `${n} of ${s.friends.length} found` : 'Not started'}</i>`;
    b.addEventListener('click', () => { play('tap', .5); closeSheet(); if (i !== save.scene || completeShown){ if (done && (save.found[s.id] || []).length === s.friends.length) save.found[s.id] = []; buildScene(i); } });
    box.appendChild(b);
  });
  $('menuSub').textContent = `${SCENES.filter(s => save.done[s.id]).length} of ${SCENES.length} postcards collected`;
  openSheet('menuSheet');
}
$('menuBtn').addEventListener('click', () => { audioInit(); play('tap', .5); openMenu(); });
$('closeBtn').addEventListener('click', () => { play('tap', .5); closeSheet(); if (completeShown) showDone(false); });
$('restartBtn').addEventListener('click', () => { play('tap', .5); closeSheet(); restart(); });
$('veil').addEventListener('click', () => { if (openId === 'menuSheet'){ closeSheet(); if (completeShown) showDone(false); } });
function setMuteUI(){ $('sndWave').style.display = save.mute ? 'none' : ''; $('sndOff').style.display = save.mute ? '' : 'none'; $('soundBtn').setAttribute('aria-pressed', save.mute ? 'true' : 'false'); }
$('soundBtn').addEventListener('click', () => { audioInit(); save.mute = !save.mute; persist(); setMuteUI(); play('tap', .5); });

/* ---------- finales ---------- */
function musicNotes(){
  const fx = svgEl.querySelector('.fx');
  for (let k = 0; k < 10; k++){
    const [x, y] = cur.seats[k % cur.seats.length];
    const t = document.createElementNS(NS, 'path');
    t.setAttribute('d', `M${x} ${y-30} v-14 l9 -3 v14 M${x} ${y-30} a3.5 3 0 1 1 -1 -.1 M${x+9} ${y-33} a3.5 3 0 1 1 -1 -.1`);
    t.setAttribute('fill', 'none'); t.setAttribute('stroke', INK); t.setAttribute('stroke-width', 2.2); t.setAttribute('stroke-linecap', 'round');
    fx.appendChild(t);
    t.animate([{transform:'translate(0,0)', opacity:0}, {opacity:1, offset:.2}, {transform:`translate(${(k%2?1:-1)*14}px,-60px)`, opacity:0}], {duration:1800, delay:k*170, easing:'ease-out', fill:'both'}).onfinish = () => t.remove();
  }
}
function fireflies(){
  const fx = svgEl.querySelector('.fx');
  for (let k = 0; k < 18; k++){
    const c = document.createElementNS(NS, 'circle'), x = 30 + Math.random() * 340, y = 220 + Math.random() * 460;
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 2.6); c.setAttribute('fill', '#ffe58a'); fx.appendChild(c);
    c.animate([{opacity:0, transform:'translate(0,0)'}, {opacity:1, offset:.3}, {opacity:.2, offset:.6}, {opacity:1, offset:.8}, {opacity:0, transform:`translate(${(Math.random()-.5)*40}px,${-20-Math.random()*40}px)`}], {duration:2600 + Math.random()*1200, delay:Math.random()*600, fill:'both'});
  }
}

/* ---------- iOS sheet guard: keep the document scroll parked in the middle of its cushion ---------- */
function park(){ if (Math.abs(window.scrollY - 120) > 2) window.scrollTo(0, 120); }
window.addEventListener('scroll', () => { clearTimeout(park.t); park.t = setTimeout(park, 80); }, {passive:true});
window.addEventListener('load', park);

/* ---------- start straight in the game ---------- */
setMuteUI();
buildScene(Math.min(Math.max(save.scene | 0, 0), SCENES.length - 1));
// test hook (read-only facts for the QA robot)
window.__hlf = { scenes:SCENES.map(s => ({id:s.id, friends:s.friends.map(f => ({x:f.x, y:f.y, r:hitRadius(f)}))})), audio:() => Object.keys(buf).length, state:() => ({scene:cur.id, found:[...found], done:Object.assign({}, save.done), complete:completeShown, sheet:openId}) };
</script>
</body>
</html>
