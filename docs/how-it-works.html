<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>How It Works — prototype</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --label2:rgba(60,60,67,.62); --sep:rgba(60,60,67,.22);
  --accent:#D63A2A; --tint:rgba(214,58,42,.10); --ok:#248A3D; --bar:rgba(249,249,251,.98);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);
  --accent:#FF5B47;--tint:rgba(255,91,71,.16);--ok:#30D158;--bar:rgba(22,22,24,.98)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.navtop{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.date{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;font-weight:600}
h1.large{font-size:34px;line-height:1.15;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.streak{font-size:13px;color:var(--label2);display:flex;align-items:center;gap:4px;padding-bottom:6px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);padding:calc(12px + env(safe-area-inset-top)) 0 0;min-height:44px}
/* lesson */
.meta{font-size:13px;color:var(--label2);margin-top:18px}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
h2.title{font-size:28px;line-height:1.15;font-weight:700;margin:2px 0 6px}
.save{width:44px;height:44px;display:grid;place-items:center;margin-right:-10px;color:var(--accent)}
.summary{margin:0 0 14px;color:var(--label)}
.sheet{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.12);margin:0 -4px}
.sheet svg{display:block;width:100%;height:auto;touch-action:manipulation}
.callout{background:var(--card);border-radius:12px;margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px;min-height:76px}
.callout .badge{flex:0 0 26px;height:26px;border-radius:13px;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600}
.callout .txt{flex:1;font-size:17px;color:var(--label)}
.callout .txt b{display:block;font-weight:600;margin-bottom:1px}
.callout .hint{color:var(--label2)}
.step-btns{display:flex;flex-direction:column}
.arrow{width:40px;height:34px;display:grid;place-items:center;color:var(--accent)}
.arrow:disabled{color:var(--sep)}
.sec{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:28px 0 6px 2px;font-weight:400}
.play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:600;margin-top:12px}
.steps{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px}
.steps li{display:flex;gap:12px;padding:11px 14px;border-top:.5px solid var(--sep);transition:background .2s}
.steps li:first-child{border-top:0}
.steps li .n{flex:0 0 18px;color:var(--accent);font-weight:600}
.steps li.now{background:var(--tint)}
.fact{background:var(--card);border-radius:12px;padding:12px 14px}
.quiz{background:var(--card);border-radius:12px;overflow:hidden}
.quiz .q{padding:12px 14px;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-top:.5px solid var(--sep);min-height:48px}
.opt .mk{flex:0 0 22px;height:22px;border-radius:11px;border:1.5px solid var(--sep);display:grid;place-items:center}
.opt.right .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.opt:disabled{cursor:default}
.result{padding:12px 14px;border-top:.5px solid var(--sep)}
.result b{display:block;font-weight:600}
.result.good b{color:var(--ok)}
.src{font-size:13px;color:var(--label2);margin:6px 2px 0;padding-left:18px}
.src li{margin:3px 0}
.src a{color:var(--label2)}
.ad{margin:24px auto 0;width:320px;max-width:100%;height:50px;border:1px dashed var(--sep);border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--label2)}
.next{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:14px;min-height:52px;text-align:left}
.next span small{display:block;font-size:13px;color:var(--label2)}
/* library */
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px 8px 12px;min-height:60px;border-top:.5px solid var(--sep)}
.group .row:first-child{border-top:0}
.thumb{flex:0 0 56px;height:40px;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.thumb svg{width:100%;height:100%;display:block}
.row .t{flex:1}
.row .t small{display:block;font-size:13px;color:var(--label2)}
.row .chev{color:var(--sep)}
.done{color:var(--ok)}
.note{font-size:13px;color:var(--label2);margin:8px 2px 0}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:.5px solid var(--sep);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:0 1 180px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;font-size:10px;color:var(--label2);font-weight:500;min-height:49px}
.tab.on{color:var(--accent)}
/* drawing */
.ink{stroke-linecap:round;stroke-linejoin:round}
.ink:not([stroke]){stroke:#24272c}
.ink:not([stroke-width]){stroke-width:1.5}
.ink:not([fill]):not(.fm):not(.fw):not(.water){fill:none}
.thin{stroke-width:.8}
.fm{fill:#eceef1}
.fw{fill:#fff}
.water{fill:#cfe3f4}
.wline{fill:none;stroke:#3a7fc0;stroke-width:1.2}
.energy{fill:none;stroke:#D63A2A;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#3a7fc0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hand{font-family:"Noteworthy","Bradley Hand","Chalkboard SE","Segoe Print","Comic Neue",cursive;font-size:10px;fill:#5a5f66}
.art>*{transition:opacity .25s}
svg.focus .art>:not(.on):not([opacity]):not([style*=opacity]){opacity:.25}
.on .ink{stroke:#D63A2A}
.num .lead{stroke:#D63A2A;stroke-width:.9}
.num .dot{fill:#D63A2A}
.num .badge{fill:#fff;stroke:#D63A2A;stroke-width:1.5}
.num text{font:600 11px var(--font);fill:#D63A2A;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.num.on .badge{fill:#D63A2A}
.num.on text{fill:#fff}
.num{cursor:pointer;outline:none}
.num:focus-visible .badge{stroke-width:3}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="today" aria-label="Today">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="5.5" width="18" height="16" rx="3"/><path d="M4 10.5h18M9 3.5v4M17 3.5v4"/><path d="M9.5 15.5l2.3 2.3 4.7-4.7"/></svg>
    Today</button>
  <button class="tab" data-tab="library" aria-label="Library">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="5" height="18" rx="1"/><rect x="10.5" y="4" width="5" height="18" rx="1"/><path d="M17.3 5.2l4.4-1.2 4 16.6-4.4 1.2z" transform="translate(-2 0)"/></svg>
    Library</button>
</nav>

<script>
'use strict';
/* ---------- drawing helpers ---------- */
const TAU = Math.PI * 2;
const f1 = v => Math.round(v * 10) / 10;
// sine wave along a polyline, with an arrowhead at the end
function wave(pts, amp, wl, phase) {
  let d = '', s = 0, last, dir;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    for (let u = 0; u <= L; u += 2) {
      const k = Math.min(1, (s + u) / 14) * Math.min(1, (L - u + (i < pts.length - 2 ? 99 : 0)) / 10);
      const o = amp * k * Math.sin(TAU * (s + u) / wl - phase);
      const x = x1 + ux * u - uy * o, y = y1 + uy * u + ux * o;
      d += (d ? 'L' : 'M') + f1(x) + ',' + f1(y);
      last = [x, y]; dir = [ux, uy];
    }
    s += L;
  }
  const [x, y] = last, [ux, uy] = dir, a = 5;
  d += `M${f1(x - ux * a - uy * a * .7)},${f1(y - uy * a + ux * a * .7)}L${f1(x)},${f1(y)}L${f1(x - ux * a + uy * a * .7)},${f1(y - uy * a - ux * a * .7)}`;
  return d;
}
function rot(px, py, cx, cy, deg) {
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return [cx + (px - cx) * c - (py - cy) * s, cy + (px - cx) * s + (py - cy) * c];
}
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const seg = (t, a, b) => ease((t - a) / (b - a));
function defs(p) {
  return `<defs>
  <pattern id="${p}grid" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff"/><path d="M10,0V10H0" fill="none" stroke="#dce6f0" stroke-width=".6"/></pattern>
  <pattern id="${p}hatch" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.5" height="4.5" fill="#fff"/><line x1="2.25" y1="0" x2="2.25" y2="4.5" stroke="#3a3e44" stroke-width=".55"/></pattern>
  <pattern id="${p}fabric" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="3" height="3" fill="#f3f1ec"/><line x1="0" y1="0" x2="3" y2="0" stroke="#c9c4b8" stroke-width=".5"/></pattern>
  <filter id="${p}rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>`;
}

/* ---------- lessons ---------- */
const LESSONS = [];

/* LESSONS:BEGIN */
/* 01-microwave.js */
{
/* 1. Microwave oven */
LESSONS.push({
  key: 'microwave', title: 'Microwave Oven', cat: 'Kitchen', mins: 3, vb: [360, 240],
  summary: 'A tube called a magnetron makes microwaves that flip the water molecules in your food back and forth billions of times a second. That jostling is heat.',
  parts: [
    { n: 1, name: 'Magnetron', at: [262, 112], num: [302, 128], desc: 'A vacuum tube with magnets that turns electricity into microwaves — radio waves that cycle 2.45 billion times a second.' },
    { n: 2, name: 'Waveguide', at: [222, 63], num: [222, 18], desc: 'A hollow metal channel that steers the microwaves from the magnetron into the cooking box.' },
    { n: 3, name: 'High-voltage transformer', at: [270, 172], num: [302, 180], desc: 'Steps the 120 volts from your outlet up to thousands of volts — what the magnetron needs to run.' },
    { n: 4, name: 'Metal cavity', at: [22, 50], num: [36, 18], desc: 'The metal walls reflect microwaves, so they bounce around inside the box instead of escaping.' },
    { n: 5, name: 'Turntable', at: [52, 174], num: [30, 226], desc: 'Microwaves form a fixed pattern of hot and cold spots. Turning the food moves it through them so it heats more evenly.' },
    { n: 6, name: 'Door screen', at: [338, 48], num: [348, 18], desc: 'The metal mesh in the door has holes far smaller than the 12 cm (5 in) microwaves, so they can’t get out — but light can, so you can watch.' },
  ],
  steps: [
    { text: 'The transformer boosts wall power to thousands of volts.', parts: [3], t: [0, 1.6] },
    { text: 'The magnetron turns that power into microwaves.', parts: [1], t: [1.6, 3.2] },
    { text: 'The waveguide carries them into the box, where they bounce off the metal walls.', parts: [2, 4], t: [3.2, 4.8] },
    { text: 'The waves flip water molecules in the food back and forth. That motion is heat — mostly in the outer inch; the middle warms by conduction. The turntable keeps hot spots moving.', parts: [5], t: [4.8, 8] },
  ],
  dur: 8,
  why: 'Why a metal box? Metal reflects microwaves, so the box keeps them in and sends them through the food again and again instead of leaking out. And 2.45 GHz sits in a radio band reserved for industrial, scientific and medical use, so ovens don’t jam radio services.',
  fact: 'It was discovered by accident. Around 1945, Raytheon engineer Percy Spencer was working near a radar magnetron when the candy bar in his pocket melted. He soon tried popcorn — it popped.',
  quiz: {
    q: 'Why does the door have a metal screen full of tiny holes?',
    opts: ['To let steam escape while cooking', 'The holes are too small for microwaves to pass, but light gets through', 'To keep the glass from cracking when it heats up'],
    a: 1,
    why: 'Microwaves are about 12 cm long. Holes a few millimeters wide block them like a solid wall, while visible light — with waves about 200,000 times shorter — passes right through.'
  },
  sources: [
    ['Microwave oven — Wikipedia', 'https://en.wikipedia.org/wiki/Microwave_oven'],
    ['Percy Spencer — Wikipedia', 'https://en.wikipedia.org/wiki/Percy_Spencer'],
    ['Microwave Oven Radiation — U.S. FDA', 'https://www.fda.gov/radiation-emitting-products/resources-you-radiation-emitting-products/microwave-oven-radiation'],
    ['How do microwave ovens work? — Explain that Stuff', 'https://www.explainthatstuff.com/microwaveovens.html'],
  ],
  art(p) {
    let fins = '';
    for (let y = 98; y <= 128; y += 5) fins += `M220,${y}H268`;
    let coil = '';
    for (let x = 220; x <= 236; x += 3) coil += `M${x},157V187`;
    for (let x = 244; x <= 260; x += 3) coil += `M${x},157V187`;
    let holes = '';
    for (let y = 40; y <= 96; y += 8) for (let x = 290; x <= 350; x += 8) holes += `<circle cx="${x + ((y / 8) % 2) * 4}" cy="${y}" r="2.3"/>`;
    return `
    <g class="shell"><rect x="10" y="32" width="272" height="174" rx="9" class="ink"/>
      <path d="M30,206v6h18v-6M244,206v6h18v-6" class="ink"/>
      </g>
    <g data-part="4"><path d="M18,44H190V196H18Z M26,52V188H182V52Z" fill-rule="evenodd" fill="url(#${p}hatch)" class="ink"/>
      <rect x="181" y="58.8" width="10" height="12.4" fill="url(#${p}grid)"/></g>
    <g data-part="2"><path d="M182,58H254V92H238V72H182" class="ink fm"/></g>
    <g data-part="3"><rect x="210" y="150" width="60" height="44" rx="2" class="ink fw"/>
      <rect x="217" y="156" width="22" height="32" class="ink thin"/><rect x="241" y="156" width="22" height="32" class="ink thin"/>
      <path d="${coil}" class="ink thin"/>
      <path d="M232,150C232,142 238,144 238,134" class="ink thin"/></g>
    <g data-part="1"><rect x="226" y="92" width="36" height="42" rx="3" class="ink fm"/>
      <path d="${fins}" class="ink thin"/>
      <rect x="242" y="80" width="4" height="12" class="ink fw"/></g>
    <g class="food">
      <path id="${p}soup" d="M69,148Q86,145 104,148T139,148Q137,168 104,168Q71,168 69,148Z" class="water"/>
      <path d="M62,140H146 M66,140Q68,170 104,170Q140,170 142,140 M90,170V172H118V170" class="ink"/>
      <g id="${p}mol"></g>
      <path id="${p}steam" d="M92,134q-4,-6 0,-12q4,-6 0,-12 M104,132q-4,-6 0,-12q4,-6 0,-12 M116,134q-4,-6 0,-12q4,-6 0,-12" class="ink thin" opacity=".55"/></g>
    <g data-part="5"><rect x="40" y="172" width="128" height="5" rx="2.5" class="ink fm"/>
      <circle cx="60" cy="181" r="3.5" class="ink fw"/><circle cx="148" cy="181" r="3.5" class="ink fw"/>
      <path d="M52,185.5H156 M104,177V196" class="ink thin"/>
      <rect x="94" y="196" width="20" height="8" rx="1.5" class="ink fw"/>
      <circle id="${p}mark" cx="104" cy="174.5" r="1.4" fill="#24272c"/></g>
    <g class="waves"><path id="${p}w0" class="energy"/><path id="${p}w1" class="energy"/>
      <text x="138" y="126" class="hand" style="fill:#D63A2A">2.45 GHz</text></g>
    <g data-part="6"><circle cx="318" cy="66" r="30" fill="#e3e6ea"/>
      <g clip-path="url(#${p}ic)" fill="#fff" stroke="#24272c" stroke-width=".5">${holes}</g>
      <circle cx="318" cy="66" r="30" class="ink"/>
      <text x="318" y="108" class="hand" text-anchor="middle">door screen</text></g>
    <clipPath id="${p}ic"><circle cx="318" cy="66" r="29"/></clipPath>`;
  },
  anim(svg, p, t) {
    const q = id => svg.querySelector('#' + p + id);
    const ph = t == null ? 0 : t * 9;
    q('w0').setAttribute('d', wave([[184, 65], [132, 104]], 4, 14, ph));
    q('w1').setAttribute('d', wave([[184, 65], [40, 64], [32, 66], [82, 132]], 4, 14, ph));
    let m = '';
    [[86, 158, 20], [104, 156, -35], [122, 160, 60]].forEach(([x, y, a], i) => {
      const ang = t == null ? a : a + 40 * Math.sin(t * 26 + i * 2);
      const [hx1, hy1] = rot(x + 4.6, y, x, y, ang + 52), [hx2, hy2] = rot(x + 4.6, y, x, y, ang - 52);
      m += `<circle cx="${f1(hx1)}" cy="${f1(hy1)}" r="1.9" class="ink thin fw"/><circle cx="${f1(hx2)}" cy="${f1(hy2)}" r="1.9" class="ink thin fw"/><circle cx="${x}" cy="${y}" r="3.1" class="ink thin" fill="#D63A2A"/>`;
    });
    q('mol').innerHTML = m;
    q('steam').setAttribute('opacity', t == null ? .55 : Math.min(.8, seg(t, 4.8, 7.5) * .8));
    q('mark').setAttribute('cx', t == null ? 104 : f1(104 + 58 * Math.sin(t * .9)));
  }
});
}

{
/* 2. Flush toilet */
const CAV = 'M46,122C50,168 80,200 112,208L130,210C146,204 160,188 168,178C172,172 178,170 180,178L180,240L196,240L196,166C196,148 176,146 168,158L148,188C145,193 138,192 140,184C150,164 172,146 182,122Z';
const TRAP = 'M124,209L130,210C146,204 160,188 168,178C172,172 178,170 180,178L180,240L196,240L196,166C196,148 176,146 168,158L148,188C145,192 136,198 124,209Z';
LESSONS.push({
  key: 'toilet', title: 'Flush Toilet', cat: 'Bathroom', mins: 3, vb: [360, 252],
  summary: 'The handle dumps a tank of water into the bowl so fast that the curved pipe below fills and becomes a siphon — it sucks the bowl empty. Then a float valve refills the tank.',
  parts: [
    { n: 1, name: 'Handle & chain', at: [204, 29], num: [184, 16], desc: 'Pushing the handle tips a lever inside the tank, and the chain pulls the flapper up.' },
    { n: 2, name: 'Flapper', at: [246, 106], num: [228, 76], desc: 'A rubber seal over the hole in the bottom of the tank. Lift it, and the tank empties into the bowl in a few seconds.' },
    { n: 3, name: 'Fill valve & float', at: [310, 50], num: [340, 62], desc: 'When the water drops, the float drops and opens the valve. As the tank refills, the float rises and shuts the water off.' },
    { n: 4, name: 'Overflow tube', at: [270, 80], num: [284, 90], desc: 'If the fill valve sticks open, extra water spills down this tube into the bowl instead of onto your floor. A thin refill tube also tops up the bowl through it.' },
    { n: 5, name: 'Rim holes', at: [35, 130], num: [14, 100], desc: 'Tank water flows through a hollow channel inside the rim and pours out of holes all around it, rinsing the bowl.' },
    { n: 6, name: 'Trapway', at: [190, 162], num: [232, 210], desc: 'A curved pipe molded into the porcelain. Its bend holds the water that blocks sewer gas — and when it fills completely, it becomes a siphon.' },
  ],
  steps: [
    { text: 'Push the handle: the chain lifts the flapper and the tank water drops into the bowl.', parts: [1, 2], t: [0, 1.2] },
    { text: 'Water floods in through the rim. The bowl level rises over the trapway’s bend and fills it.', parts: [5, 6], t: [1.2, 2.2] },
    { text: 'The full trapway is now a siphon: water falling down the drain pulls the whole bowl after it — until air gets in. That’s the gurgle.', parts: [6], t: [2.2, 4.4] },
    { text: 'The float drops, so the fill valve opens and refills the tank. The refill tube tops up the bowl so the trap holds water again.', parts: [3, 4], t: [4.4, 9] },
  ],
  dur: 9,
  why: 'Why the curved trapway? Its bend always keeps a plug of water in the pipe, which stops sewer gas from rising into your bathroom — with no moving parts. The same bend becomes the siphon that empties the bowl, so no pump is needed.',
  fact: 'Since 1994, U.S. law has capped new toilets at 1.6 gallons per flush. Older toilets could use as much as 6 gallons. Today’s WaterSense models use 1.28 or less.',
  quiz: {

  if (back) back.onclick = () => { state.open = null; state.tab = 'library'; render(); scrollTo(0, 0); };
}
function stopPlay() { if (player) { const pl = player; player = null; pl.stop(); } }

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.open = null; render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
