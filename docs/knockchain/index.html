<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Knock Chain — loading</title>
<link rel="icon" href="data:,">
<style>
:root{--acc:#c9741c;--ink:#1c1c1e;--pill:rgba(255,255,255,.86);--shadow:0 2px 6px rgba(20,30,50,.18)}
html{height:100%}
/* 240px scroll buffer under a fixed app: an in-app browser sheet then has scroll room and does not grab a drag as "close" */
body{margin:0;min-height:calc(100% + 240px);background:#0b1026;font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#app canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
.pill{position:absolute;height:40px;border-radius:20px;background:var(--pill);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#search{position:absolute;left:16px;top:calc(var(--top) + 50px);font-size:13px;color:rgba(255,235,200,.9);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#search small{font-size:12px;opacity:.8;margin-left:6px}
.motto{position:absolute;right:16px;bottom:calc(var(--bottom) - 36px);font-size:12px;letter-spacing:.04em;color:rgba(255,235,200,.75);text-shadow:0 1px 3px rgba(0,0,0,.6);font-style:italic}
#level{left:16px;top:var(--top)}
.btns{position:absolute;right:16px;top:var(--top);display:flex;gap:10px;pointer-events:auto}
.btn{width:40px;height:40px;border-radius:20px;background:var(--pill);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:pointer}
.btn svg{width:18px;height:18px;display:block;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.btn .x{display:none}.btn.off .x{display:block}.btn.off .w{display:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--bottom);display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);transition:opacity .2s}
.hint.hidden{opacity:0}
.hint .label{font-size:17px;font-weight:600;background:var(--acc);color:#fff;padding:10px 18px;border-radius:14px;box-shadow:var(--shadow);text-shadow:none;white-space:nowrap}
.hint .sub{font-size:13px;opacity:.95}
.goal{position:absolute;left:16px;bottom:calc(var(--bottom) - 36px);display:flex;align-items:center;gap:8px;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:58%}
.goal i{display:block;flex:none;width:8px;height:8px;border-radius:4px;background:var(--acc);box-shadow:0 0 0 3px rgba(255,255,255,.55)}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,50,.28);pointer-events:auto;padding:24px}
#panel.hidden{display:none}
.card{background:#fff;border-radius:18px;padding:22px 20px 18px;width:min(320px,100%);box-shadow:0 12px 40px rgba(20,30,50,.25);text-align:center}
.card h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.card p{margin:0 0 16px;font-size:15px;color:#6c6c70;min-height:1em}
.card button{display:block;width:100%;height:46px;border:0;border-radius:13px;background:var(--acc);color:#fff;font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;margin:8px 0 0;cursor:pointer}
.card button.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
body[data-mode=portrait] #hud{--top:max(16px,env(safe-area-inset-top));--bottom:max(54px,calc(env(safe-area-inset-bottom) + 24px))}
body[data-mode=square] #hud{--top:14px;--bottom:22px}
body[data-mode=landscape] #hud{--top:12px;--bottom:16px}
body[data-mode=landscape] .goal{bottom:auto;top:62px;left:16px}
body[data-mode=landscape] .motto{bottom:12px;right:16px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill" id="level">Night 1</div>
    <div id="search">Still searching… <small id="throws"></small></div>
    <div class="btns">
      <button class="btn" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 20 20"><path d="M6.5 4.5v11M13.5 4.5v11"/></svg></button>
      <button class="btn" id="btn-sound" aria-label="Sound"><svg viewBox="0 0 20 20"><path d="M3.5 7.5h3l4-3.2v11.4l-4-3.2h-3z"/><g class="w"><path d="M13 7a4.2 4.2 0 0 1 0 6"/><path d="M15.2 4.8a7.3 7.3 0 0 1 0 10.4"/></g><g class="x"><path d="M13 7.5l5 5M18 7.5l-5 5"/></g></svg></button>
    </div>
    <div class="goal"><i></i><span id="goal"></span></div>
    <div class="hint"><div class="label" id="hint">Pull to aim</div><div class="sub" id="hint-sub">Release to throw</div></div>
    <div class="motto">Love conquers all</div>
    <div id="panel" class="hidden"><div class="card"><h2 id="panel-title"></h2><p id="panel-body"></p><div id="panel-btns"></div></div></div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
