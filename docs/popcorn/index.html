<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pop &amp; Topple</title>
<link rel="icon" href="data:,">
<style>
:root{--acc:#e2452f;--ink:#2b2520;--pill:rgba(255,255,255,.9);--line:rgba(43,37,32,.14)}
html{height:100%}
/* a 240px scroll buffer under the fixed app: an in-app browser sheet then has scroll room and does not take a drag as "close" */
body{margin:0;min-height:calc(100% + 240px);background:#f4ece0;font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;display:block;touch-action:pan-y}
#hud{position:absolute;inset:0;pointer-events:none;--top:max(14px,env(safe-area-inset-top));--bottom:max(22px,env(safe-area-inset-bottom))}
.pill{position:absolute;height:38px;border-radius:19px;background:var(--pill);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:15px}
#level{left:16px;top:var(--top);flex-direction:column;align-items:flex-start;gap:0;line-height:1.1;height:44px;border-radius:14px;padding:0 14px}
#level small{font-weight:500;font-size:12px;color:#6c6660}
.btns{position:absolute;right:16px;top:var(--top);display:flex;gap:8px;pointer-events:auto}
.btn{width:44px;height:44px;border-radius:14px;background:var(--pill);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:pointer;color:var(--ink)}
.btn svg{width:20px;height:20px;display:block;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.btn .x{display:none}.btn.off .x{display:block}.btn.off .w{display:none}
#seeds{left:16px;top:calc(var(--top) + 54px);gap:5px;padding:0 12px}
#seeds i.kernel{display:block;width:16px;height:18px;border-radius:50% 50% 55% 55%/45% 45% 60% 60%;background:linear-gradient(160deg,#ffd66b,#f2b134 70%,#c97d12);box-shadow:inset 0 0 0 1.5px #8a5208}
#seeds i.kernel.used{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(138,82,8,.35)}
#target{right:16px;top:calc(var(--top) + 54px)}
#target i{display:block;width:14px;height:16px;background:repeating-linear-gradient(90deg,var(--acc) 0 3px,#fff 3px 6px);border:1.5px solid #9a2f24;border-radius:1px 1px 3px 3px}
#banner{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);background:var(--acc);color:#fff;font-weight:700;font-size:26px;letter-spacing:-.01em;padding:12px 22px;border-radius:16px;box-shadow:0 8px 24px rgba(120,40,20,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#banner.hidden{display:none}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#hintwrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 34px);display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .25s;white-space:nowrap}
#hintwrap.hidden{opacity:0}
#hint{font-size:17px;font-weight:600;background:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
#hintwrap .sub{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(60,40,20,.5)}
.studio{position:absolute;right:16px;bottom:var(--bottom);font-size:12px;letter-spacing:.02em;color:#8a7f72}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,37,32,.22);pointer-events:auto;padding:24px}
#panel.hidden{display:none}
.card{background:#fff;border-radius:18px;padding:22px 20px 18px;width:min(320px,100%);box-shadow:0 12px 40px rgba(43,37,32,.22);text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1);transform-origin:center}
.card h2{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.01em}
.card p{margin:0 0 16px;font-size:15px;color:#6c6660;min-height:1em}
.card button{display:block;width:100%;height:46px;border:0;border-radius:13px;background:var(--acc);color:#fff;font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;cursor:pointer}
body[data-mode=landscape] #hud{--top:12px;--bottom:12px}
body[data-mode=landscape] #seeds{left:auto;right:124px;top:var(--top)}
body[data-mode=landscape] #target{right:auto;left:170px;top:calc(var(--top) + 3px)}
body[data-mode=landscape] #hintwrap{bottom:calc(var(--bottom) + 4px)}
body[data-mode=landscape] .studio{display:none}
body[data-mode=square] #hud{--top:12px;--bottom:14px}
body[data-mode=square] #hintwrap{bottom:calc(var(--bottom) + 10px)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="pill" id="level"><span id="lnum">Level 1 of 5</span><small id="lname">Open Gap</small></div>
    <div class="btns">
      <button class="btn" id="btn-restart" aria-label="Restart level"><svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3"/><path d="M4 3.5v3.3h3.3"/></svg></button>
      <button class="btn" id="btn-sound" aria-label="Sound"><svg viewBox="0 0 20 20"><path d="M3.5 7.5h3l4-3.2v11.4l-4-3.2h-3z"/><g class="w"><path d="M13 7a4.2 4.2 0 0 1 0 6"/><path d="M15.2 4.8a7.3 7.3 0 0 1 0 10.4"/></g><g class="x"><path d="M13 7.5l5 5M18 7.5l-5 5"/></g></svg></button>
    </div>
    <div class="pill" id="seeds"></div>
    <div class="pill" id="target"><i></i><span id="tcount">1</span>&nbsp;<span id="tword">target</span>&nbsp;up</div>
    <div id="banner" class="hidden">Target down!</div>
    <div id="hintwrap"><div id="hint">Pull back. Drop the kernel into the gap.</div><div class="sub" id="hintsub">Release to shoot</div></div>
    <div class="studio">Treasurefield Studio</div>
    <div id="panel" class="hidden"><div class="card"><h2 id="panel-title"></h2><p id="panel-body"></p><button id="panel-btn"></button></div></div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
