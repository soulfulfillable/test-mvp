<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Race Finder</title>
<style>
:root{
  --bg:#f2f2f7; --surface:#fff; --ink:#000; --ink2:rgba(60,60,67,.66); --ink3:rgba(60,60,67,.36);
  --line:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --go:#0a7a52; --go-ink:#fff; --rise:#b85c00; --rise-bg:rgba(255,149,0,.14);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --surface:#1c1c1e; --ink:#fff; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.32);
  --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --go:#30d18f; --go-ink:#00291a; --rise:#ffa733; --rise-bg:rgba(255,159,10,.18);
}}
@media (prefers-color-scheme: dark){.sheet{--bg:#1c1c1e;--surface:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:-apple-system-body;font-family:-apple-system,system-ui,"SF Pro Text","Helvetica Neue",sans-serif;line-height:1.3;
  padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
body.fallback{font-size:17px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* header */
header{padding-top:14px}
h1{font-size:2em;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
.where{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--go);font-size:1em;min-height:36px}
.where svg{width:.7em;height:.7em;flex:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;text-align:center;font-size:.8em;font-weight:500;padding:7px 4px;border-radius:7px;min-height:32px}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed=true]{background:#636366;box-shadow:none}}
.dist{display:flex;gap:18px;margin:14px 0 0;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--line)}
.dist::-webkit-scrollbar{display:none}
.dist button{font-size:.88em;color:var(--ink2);padding:8px 0 9px;white-space:nowrap;border-bottom:2px solid transparent;min-height:40px}
.dist button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--go)}

/* list */
.count{font-size:.8em;color:var(--ink2);margin:14px 0 0}
.day{font-size:.8em;font-weight:600;color:var(--ink2);margin:22px 0 6px 2px}
.day:first-of-type{margin-top:14px}
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.race{display:grid;grid-template-columns:4.1em 1fr auto;column-gap:10px;width:100%;padding:11px 14px 11px 12px;position:relative;align-items:start}
.race + .race::before{content:"";position:absolute;top:0;left:calc(4.1em + 22px);right:0;border-top:.5px solid var(--line)}
.race:active{background:var(--fill)}
.time{font-variant-numeric:tabular-nums;font-size:.94em;font-weight:600;padding-top:1px}
.time small{display:block;font-size:.76em;font-weight:400;color:var(--ink2)}
.name{font-size:1em;font-weight:600;overflow-wrap:anywhere}
.meta{font-size:.8em;color:var(--ink2);margin-top:2px}
.rise{display:inline-block;font-size:.8em;font-weight:600;color:var(--rise);background:var(--rise-bg);border-radius:6px;padding:3px 7px;margin-top:6px}
.note{display:block;font-size:.8em;color:var(--ink2);margin-top:5px}
.away{font-size:.8em;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px;text-align:right}
.away b{display:block;color:var(--go);font-weight:600}

/* states */
.state{background:var(--surface);border-radius:12px;padding:22px 18px;margin-top:16px}
.state h2{font-size:1.18em;margin:0 0 6px;font-weight:600}
.state p{margin:0;color:var(--ink2);font-size:.94em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{background:var(--go);color:var(--go-ink);font-weight:600;border-radius:12px;padding:12px 18px;min-height:46px;text-align:center}
.btn.quiet{background:var(--fill);color:var(--go)}
.btn.wide{display:block;width:100%}
.btn:active{opacity:.7}
.zipform{display:flex;gap:8px;margin-top:10px}
.zipform input{flex:1;min-width:0;background:var(--fill);border:0;border-radius:10px;padding:11px 12px;font-size:1em;min-height:46px}
.state p.err,p.err{color:#d70015;font-size:.8em;margin-top:10px;min-height:1em}
@media (prefers-color-scheme: dark){.state p.err,p.err{color:#ff6961}}
.foot{font-size:.74em;color:var(--ink2);margin:22px 2px 0}
.foot a{color:inherit}
.skel{height:4.2em;border-bottom:.5px solid var(--line);background:linear-gradient(90deg,transparent,var(--fill),transparent) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:0 1 180px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62em;font-weight:500;color:var(--ink2);padding:7px 0 5px;min-height:50px}
nav button[aria-pressed=true]{color:var(--go)}
nav svg{width:25px;height:25px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;transition:opacity .25s}
.veil.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:14px 14px 0 0;max-height:92dvh;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@supports (max-height:92dvh){.sheet{max-height:92dvh}}
.sheet.on{transform:none}
.sheet .wrap{padding-top:8px}
.bar{display:flex;justify-content:flex-end;position:sticky;top:0;background:var(--bg);padding:8px 0 4px;z-index:1}
.close{color:var(--go);font-weight:600;min-height:40px;padding:0 2px}
.sheet h2{font-size:1.4em;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.when{margin:6px 0 0;font-size:1em}
.addr{display:block;margin-top:2px;color:var(--go);font-size:.94em;text-decoration:none;min-height:30px}
.card{background:var(--surface);border-radius:12px;margin-top:14px;padding:14px}
.ev{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ev + .stairs, .ev + .evnote{margin-top:2px}
.ev b{font-weight:600}
.ev .fee{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.evnote{font-size:.8em;color:var(--ink2)}
.evnote.up{color:var(--rise);font-weight:600}
.card hr{border:0;border-top:.5px solid var(--line);margin:12px -14px 12px 0}
.stairs{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.stairs .path{fill:none;stroke:var(--ink3);stroke-width:2;stroke-linejoin:round}
.stairs .done{fill:none;stroke:var(--go);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.sheet.on .stairs .done{animation:draw .9s .25s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stairs .now{fill:var(--go);opacity:0}
.sheet.on .stairs .now{animation:pop .3s 1.05s forwards}
@keyframes pop{to{opacity:1}}
.stairs text{font-size:11px;fill:var(--ink2);font-family:inherit;font-variant-numeric:tabular-nums}
.stairs text.cur{fill:var(--ink);font-weight:600}
.stairs text.nxt{fill:var(--rise);font-weight:600}
.sheet .acts{margin-top:16px}
.sheet .acts .btn{flex:1 1 46%}
.sheet .acts .btn.wide{flex-basis:100%}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.88em;font-weight:500;border-radius:20px;padding:9px 16px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
/* launch: the mark is the app's own price staircase, drawn once */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .28s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .mark{width:84px;height:84px;border-radius:19px;background:var(--go)}
#splash .mark path{fill:none;stroke:var(--go-ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .1s cubic-bezier(.3,.7,.2,1) forwards}
#splash .mark circle{fill:var(--go-ink);opacity:0;animation:pop .2s .6s forwards}
#splash b{font-size:1.25em;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion: reduce){#splash{transition:none}#splash .mark path{animation:none;stroke-dashoffset:0}#splash .mark circle{animation:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.veil{transition:none}.sheet.on .stairs .done{animation:none;stroke-dashoffset:0}.sheet.on .stairs .now{animation:none;opacity:1}.skel{animation:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg class="mark" viewBox="0 0 84 84"><path pathLength="1" d="M18 58h16V44h16V30h14"/><circle cx="64" cy="30" r="5"/></svg><b>Race Finder</b></div>
<div class="wrap">
  <header>
    <h1 id="title">Races near you</h1>
    <button class="where" id="where" hidden><span id="whereText"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="controls" hidden>
      <div class="seg" id="period" role="group" aria-label="Dates">
        <button data-p="weekend">This weekend</button><button data-p="two">Next 2 weeks</button><button data-p="all">8 weeks</button>
      </div>
      <div class="dist" id="dist" role="group" aria-label="Distance">
        <button data-k="any">Any distance</button><button data-k="5k">5K</button><button data-k="10k">10K</button><button data-k="half">Half marathon</button><button data-k="full">Marathon</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <p class="foot" id="foot" hidden></p>
</div>

<nav aria-label="Sections">
  <button id="tabRaces" aria-pressed="true"><svg viewBox="0 0 25 25" aria-hidden="true"><path d="M5 22V4m0 1h14l-3 4 3 4H5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Races</button>
  <button id="tabSaved" aria-pressed="false"><svg viewBox="0 0 25 25" aria-hidden="true"><path d="M7 4h11v17l-5.5-4L7 21z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Saved</button>
</nav>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var DATA='race-finder-data/';
var $=function(id){return document.getElementById(id)};
var qs=new URLSearchParams(location.search);
if(!CSS.supports('font','-apple-system-body'))document.body.classList.add('fallback');

/* ---------- launch screen: stays about a second, never longer than the data needs (max 2.5s) ---------- */
var splashAt=Date.now(),splashDone=false;
function splashOff(){if(splashDone)return;splashDone=true;var el=$('splash');
  setTimeout(function(){el.classList.add('out');setTimeout(function(){el.hidden=true},300)},Math.max(0,(qs.get('nosplash')?0:900)-(Date.now()-splashAt)))}
setTimeout(splashOff,2500);

/* ---------- storage (never required) ---------- */
function load(k,d){try{var v=localStorage.getItem('rf.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem('rf.'+k,JSON.stringify(v))}catch(e){}}

var S={loc:load('loc',null),radius:load('radius',25),period:load('period','weekend'),kind:load('kind','any'),
       saved:load('saved',{}),tab:'races',races:null,meta:null,error:null,loading:false};
if(qs.get('zip'))S.loc=null;
if(S.loc)S.loading=true;
var pendingZip=!!qs.get('zip');

/* ---------- time helpers: race times are naive local strings 'YYYY-MM-DDTHH:MM' ---------- */
var NOW=qs.get('now')?new Date(qs.get('now')):new Date();
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowIn(tz){ // current wall-clock time in the race's timezone, same naive format
  try{var p=new Intl.DateTimeFormat('en-CA',{timeZone:tz||undefined,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(NOW),o={};
    p.forEach(function(x){o[x.type]=x.value});return o.year+'-'+o.month+'-'+o.day+'T'+o.hour+':'+o.minute}
  catch(e){return ymd(NOW)+'T'+pad(NOW.getHours())+':'+pad(NOW.getMinutes())}
}
function parse(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),+s.slice(11,13)||0,+s.slice(14,16)||0)}
function dayDiff(a,b){return Math.round((parse(b.slice(0,10)+'T00:00')-parse(a.slice(0,10)+'T00:00'))/864e5)}
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function clock(s){var h=+s.slice(11,13),m=s.slice(14,16);return {t:((h+11)%12+1)+':'+m,ap:h<12?'AM':'PM'}}
function shortDate(s){return MO[+s.slice(5,7)-1]+' '+(+s.slice(8,10))}
function dayLabel(s,today){var n=dayDiff(today,s),d=parse(s);var base=WD[d.getDay()]+', '+shortDate(s);return n===0?'Today, '+shortDate(s):n===1?'Tomorrow, '+shortDate(s):base}
function inDays(n,dateStr){if(n<=0)return 'today';if(n===1)return 'tomorrow';if(n<7)return 'on '+WD[parse(dateStr).getDay()];return 'on '+shortDate(dateStr)}
// a price that holds until late evening changes *after* that day, not on it
function riseWhen(now,at){var n=dayDiff(now,at),late=at.slice(11,13)>='20';if(!late)return inDays(n,at);if(n<=0)return 'tonight';if(n===1)return 'after tomorrow';if(n<7)return 'after '+WD[parse(at).getDay()];return 'after '+shortDate(at)}
function money(f){return f===0?'Free':'$'+(f%1?f.toFixed(2):f)}

/* ---------- pricing: what it costs now, and when it changes ---------- */
function pricing(ev,now){
  var ps=ev.p||[];if(!ps.length)return {state:'unknown'};
  var cur=-1;for(var i=0;i<ps.length;i++){if((!ps[i][0]||ps[i][0]<=now)&&now<ps[i][1]){cur=i;break}}
  if(cur<0){
    var fut=ps.filter(function(p){return p[0]&&p[0]>now})[0];
    return fut?{state:'opens',at:fut[0],fee:fut[2]}:{state:'closed'};
  }
  var out={state:'open',fee:ps[cur][2],closes:ps[ps.length-1][1],idx:cur};
  for(var j=cur+1;j<ps.length;j++){if(ps[j][2]!==ps[cur][2]){ if(ps[j][2]>ps[cur][2]){out.riseAt=ps[j-1][1];out.riseTo=ps[j][2]} break}}
  return out;
}
function headline(r,kind,now){ // the one line worth showing in the list
  var evs=r.e.filter(function(e){return kind==='any'||e.k===kind}),best=null,anyOpen=false,soonClose=null;
  evs.forEach(function(e){var p=pricing(e,now);if(p.state!=='open')return;anyOpen=true;
    if(p.riseAt&&(!best||p.riseAt<best.riseAt))best=p;
    if(!soonClose||p.closes<soonClose)soonClose=p.closes});
  if(best){var n=dayDiff(now,best.riseAt);if(n<=14)return {up:true,text:'Price goes up '+riseWhen(now,best.riseAt)+': '+money(best.fee)+' to '+money(best.riseTo)}}
  if(anyOpen&&soonClose){var c=dayDiff(now,soonClose),raceDay=dayDiff(now,evs[0].t);if(c<raceDay&&c<=7)return {text:'Sign-up closes '+inDays(c,soonClose)}}
  if(!anyOpen&&evs.length){var st=evs.map(function(e){return pricing(e,now).state});
    if(st.indexOf('closed')>=0&&st.indexOf('opens')<0&&st.indexOf('unknown')<0)return {text:'Online sign-up has closed'}}
  return null;
}

/* ---------- geo ---------- */
function miles(a,b,c,d){var R=3958.8,x=Math.PI/180,p=Math.sin((c-a)*x/2),q=Math.sin((d-b)*x/2),h=p*p+Math.cos(a*x)*Math.cos(c*x)*q*q;return 2*R*Math.asin(Math.sqrt(h))}
function tilesFor(loc,rad,have){var dla=rad/69+.05,dlo=rad/(69*Math.cos(loc.la*Math.PI/180))+.05,out=[];
  for(var a=Math.floor((loc.la-dla)/2);a<=Math.floor((loc.la+dla)/2);a++)for(var o=Math.floor((loc.lo-dlo)/2);o<=Math.floor((loc.lo+dlo)/2);o++){var k=a+'_'+o;if(have.indexOf(k)>=0)out.push(k)}
  return out}
function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var tileCache={};
function loadRaces(){
  if(!S.loc)return;
  S.loading=true;S.error=null;render();
  var seq=++loadRaces.seq;
  (S.meta?Promise.resolve(S.meta):getJSON(DATA+'meta.json')).then(function(m){
    S.meta=m;
    return Promise.all(tilesFor(S.loc,50,m.tiles).map(function(k){return tileCache[k]?tileCache[k]:getJSON(DATA+'t_'+k+'.json').then(function(d){tileCache[k]=d;return d})}));
  }).then(function(parts){
    if(seq!==loadRaces.seq)return;
    var all=[].concat.apply([],parts);
    all.forEach(function(r){r.mi=miles(S.loc.la,S.loc.lo,r.la,r.lo)});
    S.races=all;S.loading=false;render();
  }).catch(function(){if(seq!==loadRaces.seq)return;S.loading=false;S.error='load';render()});
}
loadRaces.seq=0;

function setLoc(loc){S.loc=loc;save('loc',loc);S.races=null;loadRaces()}
function lookupZip(zip){return getJSON(DATA+'z_'+zip[0]+'.json').then(function(t){var v=t[zip];if(!v)throw new Error('nozip');return {la:v[0],lo:v[1],label:'ZIP '+zip}})}
function useGPS(onFail){
  if(!navigator.geolocation){onFail('This browser can’t share a location. Enter a ZIP code instead.');return}
  navigator.geolocation.getCurrentPosition(function(p){closeSheet();setLoc({la:p.coords.latitude,lo:p.coords.longitude,label:'your location'})},
    function(e){onFail(e.code===1?'Location is turned off for this page. Enter a ZIP code instead.':'Couldn’t get your location. Enter a ZIP code instead.')},{timeout:10000,maximumAge:6e5});
}

/* ---------- filtering ---------- */
function windowEnd(today){var d=parse(today+'T00:00');
  if(S.period==='weekend'){var dow=d.getDay();d.setDate(d.getDate()+(dow===0?0:7-dow))}
  else d.setDate(d.getDate()+(S.period==='two'?14:70));
  return ymd(d)}
function windowStart(today){if(S.period!=='weekend')return today;var d=parse(today+'T00:00'),dow=d.getDay();if(dow!==0&&dow!==6)d.setDate(d.getDate()+(6-dow));return ymd(d)}
function visible(){
  var today=ymd(NOW),a=windowStart(today),b=windowEnd(today),out=[];
  (S.races||[]).forEach(function(r){
    if(r.mi>S.radius)return;
    var now=nowIn(r.tz);
    var evs=r.e.filter(function(e){return (S.kind==='any'||e.k===S.kind)&&e.t>=now&&e.t.slice(0,10)>=a&&e.t.slice(0,10)<=b});
    if(evs.length)out.push({r:r,first:evs[0].t,now:now});
  });
  out.sort(function(x,y){return x.first<y.first?-1:x.first>y.first?1:x.r.mi-y.r.mi});
  return out}

/* ---------- rendering ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function distList(r,kind){var seen={},out=[];r.e.forEach(function(e){var l=label(e);if(!seen[l]){seen[l]=1;out.push(l)}});return out.slice(0,4).join(', ')+(out.length>4?' +'+(out.length-4):'')}
function label(e){return e.k==='5k'?'5K':e.k==='10k'?'10K':e.k==='half'?'Half':e.k==='full'?'Marathon':(e.d||e.n||'Run').replace(/ Miles?$/i,' mi')}
function awayText(mi){return mi<1?'<1 mi':Math.round(mi)+' mi'}
function rowHTML(x){var r=x.r,c=clock(x.first),h=headline(r,S.kind,x.now);
  return '<button class="race" data-id="'+r.i+'"><span class="time">'+c.t+'<small>'+c.ap+'</small></span>'+
    '<span><span class="name">'+esc(r.n)+'</span><span class="meta" style="display:block">'+esc(distList(r))+' in '+esc(r.c)+'</span>'+
    (h?'<span class="'+(h.up?'rise':'note')+'">'+esc(h.text)+'</span>':'')+'</span>'+
    '<span class="away">'+awayText(r.mi)+(S.saved[r.i]?'<b>Saved</b>':'')+'</span></button>'}

var PLBL={weekend:'this weekend',two:'in the next 2 weeks',all:'in the next 8 weeks'};
function render(){
  $('tabRaces').setAttribute('aria-pressed',S.tab==='races');$('tabSaved').setAttribute('aria-pressed',S.tab==='saved');
  [].forEach.call($('period').children,function(b){b.setAttribute('aria-pressed',b.dataset.p===S.period)});
  [].forEach.call($('dist').children,function(b){b.setAttribute('aria-pressed',b.dataset.k===S.kind)});
  var main=$('main'),foot=$('foot');
  if(!S.loading&&!(pendingZip&&!S.loc))splashOff();
  if(S.tab==='saved'){renderSaved();return}
  $('title').textContent=S.loc?(S.period==='weekend'?'This weekend':S.period==='two'?'Next 2 weeks':'Next 8 weeks'):'Races near you';
  $('where').hidden=!S.loc;$('controls').hidden=!S.loc;
  if(S.loc)$('whereText').textContent='Within '+S.radius+' mi of '+S.loc.label;
  if(!S.loc&&pendingZip){foot.hidden=true;main.innerHTML='<p class="count">Loading races\u2026</p>';return}
  if(!S.loc){foot.hidden=true;main.innerHTML=
    '<div class="state"><h2>Where do you run?</h2><p>See every 5K, 10K, half and marathon near you, with what it costs today and when the price goes up.</p>'+
    '<div class="acts"><button class="btn wide" id="gps">Use my location</button></div>'+
    '<form class="zipform" id="zipform"><input id="zip" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" autocomplete="postal-code"><button class="btn quiet">Show races</button></form>'+
    '<p class="err" id="err" role="alert"></p></div>';
    bindLocForm();return}
  if(S.loading){foot.hidden=true;main.innerHTML='<p class="count">Loading races…</p><div class="group" style="margin-top:10px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';return}
  if(S.error){foot.hidden=true;main.innerHTML='<div class="state"><h2>Couldn’t load races</h2><p>Check your connection, then try again.</p><div class="acts"><button class="btn" id="retry">Try again</button></div></div>';
    $('retry').onclick=loadRaces;return}
  var list=visible(),today=ymd(NOW);
  if(!list.length){
    var acts='';
    if(S.radius<50)acts+='<button class="btn" data-act="wider">Search within 50 mi</button>';
    if(S.period!=='all')acts+='<button class="btn'+(acts?' quiet':'')+'" data-act="later">Show the next 8 weeks</button>';
    if(S.kind!=='any')acts+='<button class="btn quiet" data-act="anyk">Show any distance</button>';
    main.innerHTML='<div class="state"><h2>No '+(S.kind==='any'?'':esc(kindName())+' ')+'races '+PLBL[S.period]+'</h2><p>Nothing within '+S.radius+' mi of '+esc(S.loc.label)+' is on RunSignup for these dates.</p>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
  }else{
    var html='<p class="count">'+list.length+(list.length===1?' race':' races')+'</p>',cur='';
    list.forEach(function(x){var d=x.first.slice(0,10);if(d!==cur){if(cur)html+='</div>';cur=d;html+='<h2 class="day">'+dayLabel(d,today)+'</h2><div class="group">'}html+=rowHTML(x)});
    main.innerHTML=html+'</div>';
  }
  foot.hidden=!S.meta;
  if(S.meta)foot.innerHTML='Race details from <a href="https://runsignup.com" target="_blank" rel="noopener">RunSignup</a>, last updated '+esc(shortDate(S.meta.fetched))+'. Confirm the date and price on the race page before you sign up. Not affiliated with RunSignup.';
}
function kindName(){return {'5k':'5K','10k':'10K',half:'half marathon',full:'marathon'}[S.kind]}
function renderSaved(){
  $('title').textContent='Saved';$('where').hidden=true;$('controls').hidden=true;$('foot').hidden=true;
  var today=ymd(NOW),items=Object.keys(S.saved).map(function(k){return S.saved[k]}).filter(function(r){return r.e[r.e.length-1].t.slice(0,10)>=today});
  items.sort(function(a,b){return a.e[0].t<b.e[0].t?-1:1});
  if(!items.length){$('main').innerHTML='<div class="state"><h2>No saved races yet</h2><p>Open a race and tap Save to keep it here.</p><div class="acts"><button class="btn" id="goRaces">Find races</button></div></div>';
    $('goRaces').onclick=function(){S.tab='races';render()};return}
  var html='',cur='';
  items.forEach(function(r){var now=nowIn(r.tz),first=r.e[0].t,d=first.slice(0,10);if(r.mi==null)r.mi=S.loc?miles(S.loc.la,S.loc.lo,r.la,r.lo):0;
    if(d!==cur){if(cur)html+='</div>';cur=d;html+='<h2 class="day">'+dayLabel(d,today)+'</h2><div class="group">'}
    var keep=S.kind;S.kind='any';html+=rowHTML({r:r,first:first,now:now});S.kind=keep});
  $('main').innerHTML=html+'</div>';
}

/* ---------- price staircase ---------- */
function stairs(ev,now){
  var ps=ev.p;if(!ps||ps.length<2)return '';
  var fees=ps.map(function(p){return p[2]});if(Math.min.apply(0,fees)===Math.max.apply(0,fees))return '';
  var W=320,H=92,L=4,R=W-4,T=20,B=H-22,n=ps.length,step=(R-L)/n,lo=Math.min.apply(0,fees),hi=Math.max.apply(0,fees);
  function y(f){return B-(f-lo)/(hi-lo)*(B-T)}
  var cur=-1;for(var i=0;i<n;i++){if((!ps[i][0]||ps[i][0]<=now)&&now<ps[i][1]){cur=i;break}}
  var d='',done='',txt='';
  for(i=0;i<n;i++){var x0=L+i*step,x1=x0+step,yy=y(fees[i]);
    d+=(i?'L':'M')+x0+' '+yy+'L'+x1+' '+yy;
    var cls=i===cur?'cur':(cur>=0&&i===cur+1&&fees[i]>fees[cur]?'nxt':'');
    txt+='<text class="'+cls+'" x="'+(x0+step/2)+'" y="'+(yy-7)+'" text-anchor="middle">'+money(fees[i])+'</text>';
    txt+='<text x="'+(x0+step/2)+'" y="'+(H-6)+'" text-anchor="middle">'+(i===n-1?'race day':'to '+shortDate(ps[i][1]))+'</text>';
    if(cur>=0&&i<=cur){var xe=i===cur?x0+step*frac(ps[i],now):x1;done+=(i?'L':'M')+x0+' '+yy+'L'+xe+' '+yy}
  }
  var dot='';if(cur>=0){var xd=L+cur*step+step*frac(ps[cur],now);dot='<circle class="now" cx="'+xd+'" cy="'+y(fees[cur])+'" r="5"/>'}
  return '<svg class="stairs" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Price over time: '+ps.map(function(p,i){return money(p[2])+(i===n-1?' until race day':' until '+shortDate(p[1]))}).join(', ')+'">'+
    '<path class="path" d="'+d+'"/>'+(done?'<path class="done" pathLength="1" d="'+done+'"/>':'')+dot+txt+'</svg>';
}
function frac(p,now){if(!p[0])return .5;var a=parse(p[0]),b=parse(p[1]),c=parse(now);return Math.max(.08,Math.min(.92,(c-a)/(b-a||1)))}

/* ---------- sheets ---------- */
var lastFocus=null;
function openSheet(html){lastFocus=document.activeElement;$('sheetBody').innerHTML='<div class="bar"><button class="close" id="close">Done</button></div>'+html;
  $('veil').hidden=false;$('sheet').hidden=false;$('sheet').scrollTop=0;document.body.style.overflow='hidden';
  requestAnimationFrame(function(){requestAnimationFrame(function(){$('veil').classList.add('on');$('sheet').classList.add('on')})});
  $('close').onclick=closeSheet;$('close').focus({preventScroll:true})}
function closeSheet(){if($('sheet').hidden)return;$('veil').classList.remove('on');$('sheet').classList.remove('on');document.body.style.overflow='';
  setTimeout(function(){$('veil').hidden=true;$('sheet').hidden=true},330);if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true})}
$('veil').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

function find(id){var r=(S.races||[]).filter(function(r){return r.i==id})[0];return r||S.saved[id]}
function openRace(id){
  var r=find(id);if(!r)return;var now=nowIn(r.tz),first=r.e[0].t,today=now.slice(0,10),c=clock(first);
  var maps='https://maps.apple.com/?q='+encodeURIComponent([r.st,r.c,r.s,r.z].filter(Boolean).join(', '));
  var html='<h2>'+esc(r.n)+'</h2><p class="when">'+dayLabel(first.slice(0,10),today)+' at '+c.t+' '+c.ap+'</p>'+
    '<a class="addr" href="'+maps+'" target="_blank" rel="noopener">'+esc([r.st,r.c+', '+r.s].filter(Boolean).join(', '))+(r.mi!=null&&S.loc?' ('+awayText(r.mi)+' away)':'')+'</a><div class="card">';
  r.e.forEach(function(e,i){var p=pricing(e,now),ec=clock(e.t),note='',up=false,fee='';
    if(p.state==='open'){fee=money(p.fee);
      if(p.riseAt){up=true;note='Goes up to '+money(p.riseTo)+' '+riseWhen(now,p.riseAt)}
      else note='Sign-up closes '+inDays(dayDiff(now,p.closes),p.closes)}
    else if(p.state==='opens'){fee=money(p.fee);note='Sign-up opens '+shortDate(p.at)}
    else if(p.state==='closed'){note='Online sign-up has closed'}
    html+=(i?'<hr>':'')+'<div class="ev"><span><b>'+esc(e.n||label(e))+'</b> <span class="evnote">'+esc(e.d&&e.n&&e.n.indexOf(e.d)<0?e.d.replace(/ Miles?$/i,' mi')+', ':'')+ec.t+' '+ec.ap+'</span></span><span class="fee">'+fee+'</span></div>'+
      (note?'<div class="evnote'+(up?' up':'')+'">'+esc(note)+'</div>':'')+(p.state==='open'?stairs(e,now):'');
  });
  var isSaved=!!S.saved[r.i];
  html+='</div><div class="acts"><a class="btn wide" id="reg" href="'+esc(r.u)+'" target="_blank" rel="noopener" style="text-decoration:none">Sign up on RunSignup</a>'+
    '<button class="btn quiet" id="saveBtn">'+(isSaved?'Remove from Saved':'Save')+'</button><a class="btn quiet" id="cal" href="'+DATA+'ics/'+r.i+'.ics" style="text-decoration:none">Add to Calendar</a></div>'+
    '<p class="foot" style="margin-top:14px">Prices are RunSignup’s entry fees before processing fees, as of '+esc(shortDate((S.meta||{fetched:ymd(NOW)}).fetched))+'.</p>';
  openSheet(html);
  $('saveBtn').onclick=function(){if(S.saved[r.i]){delete S.saved[r.i];toast('Removed from Saved')}else{S.saved[r.i]=r;toast('Saved')}
    save('saved',S.saved);this.textContent=S.saved[r.i]?'Remove from Saved':'Save';render()};
}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},1600)}

function openLocation(){
  openSheet('<h2>Search area</h2><div class="seg" id="rad" role="group" aria-label="Distance from you" style="margin-top:14px">'+[10,25,50].map(function(n){return '<button data-r="'+n+'" aria-pressed="'+(S.radius===n)+'">'+n+' mi</button>'}).join('')+'</div>'+
    '<div class="acts"><button class="btn wide" id="gps">Use my location</button></div>'+
    '<form class="zipform" id="zipform"><input id="zip" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" autocomplete="postal-code"><button class="btn quiet">Show races</button></form><p class="err" id="err" role="alert"></p>');
  [].forEach.call($('rad').children,function(b){b.onclick=function(){S.radius=+b.dataset.r;save('radius',S.radius);[].forEach.call($('rad').children,function(o){o.setAttribute('aria-pressed',o===b)});render()}});
  bindLocForm();
}
function bindLocForm(){
  var err=$('err');
  $('gps').onclick=function(){err.textContent='';useGPS(function(m){err.textContent=m;$('zip').focus()})};
  $('zipform').onsubmit=function(e){e.preventDefault();var z=$('zip').value.trim();
    if(!/^\d{5}$/.test(z)){err.textContent='Enter a 5-digit ZIP code.';return}
    err.textContent='';
    lookupZip(z).then(function(loc){closeSheet();setLoc(loc)},function(x){err.textContent=x.message==='nozip'?'We don’t know that ZIP code. Check the digits.':'Couldn’t look up that ZIP code. Check your connection.'})};
}

/* ---------- events ---------- */
$('main').addEventListener('click',function(e){
  var row=e.target.closest('.race');if(row){openRace(row.dataset.id);return}
  var act=e.target.closest('[data-act]');if(!act)return;
  if(act.dataset.act==='wider'){S.radius=50;save('radius',50)}
  if(act.dataset.act==='later'){S.period='all';save('period','all')}
  if(act.dataset.act==='anyk'){S.kind='any';save('kind','any')}
  render()});
$('period').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.period=b.dataset.p;save('period',S.period);render()});
$('dist').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.kind=b.dataset.k;save('kind',S.kind);render()});
$('where').onclick=openLocation;
$('tabRaces').onclick=function(){S.tab='races';render();scrollTo(0,0)};
$('tabSaved').onclick=function(){S.tab='saved';render();scrollTo(0,0)};

/* ---------- start ---------- */
render();
if(pendingZip)lookupZip(qs.get('zip')).then(function(l){pendingZip=false;setLoc(l)},function(){pendingZip=false;render()});
else if(S.loc)loadRaces();
})();
</script>
