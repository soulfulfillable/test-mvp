<!DOCTYPE html>
<html lang="en">
<head>
<!-- Playgama Bridge SDK must be the first script in <head>, loaded normally (SDK required step 2).
     Local copy of npm @playgama/bridge (see CREDITS.md) so the archive ships everything it needs (rule 1.2.5). -->
<script src="playgama-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kitty Sudoku</title>
<script src="sudoku-core.js"></script>
<style>
  :root {
    --bg: #f4f1ea; --ink: #2f2a24; --sub: #5e5648; --muted: #8b836f; --panel: #fff; --line: #d9d3c6;
    --accent: #3b6fd6; --accent-soft: rgba(59,111,214,0.14); --accent-mid: rgba(59,111,214,0.26);
    --peer: rgba(47,42,36,0.06); --red: #d1342a; --red-soft: rgba(209,52,42,0.13); --green: #2e9e5b;
    --board: 300px; --n: 9; --cell: 33px;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); touch-action: none;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  svg { display: block; }
  .hidden { display: none !important; }
  #defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ── loading screen (first thing on screen, hidden right before game_ready) ── */
  #loading { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); }
  #loading svg { width: 96px; height: 96px; }
  #loading .ttl { font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  #loading .bar { width: 150px; height: 6px; border-radius: 3px; background: rgba(47,42,36,0.12); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; border-radius: 3px; background: var(--accent); animation: load 1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-40%); } to { transform: translateX(380%); } }

  /* ── play screen: HUD / board / foot (tools + number pad); the HUD and foot move to the side in landscape ── */
  #app {
    position: fixed; inset: 0; display: grid;
    grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "hud" "board" "foot";
    padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);
    gap: 8px;
  }
  #app.land {
    grid-template-rows: auto 1fr; grid-template-columns: minmax(230px, 340px) minmax(0, 1fr);
    grid-template-areas: "hud board" "foot board"; column-gap: 16px;
  }
  #hud { grid-area: hud; width: min(100%, 520px); min-width: 0; justify-self: center; }
  #app.land #hud { width: 100%; align-self: start; }
  #hud-top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; border: none; background: rgba(47,42,36,0.07); display: flex; align-items: center; justify-content: center; flex: none; }
  .ibtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn:active { background: rgba(47,42,36,0.16); }
  #mute-btn .on, #mute-btn .off { display: none; }
  #mute-btn[data-muted="0"] .on { display: block; }
  #mute-btn[data-muted="1"] .off { display: block; }
  #mode-label { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; display: flex; flex-direction: column; line-height: 1.15; }
  #mode-label span, #mode-label small { overflow: hidden; text-overflow: ellipsis; }
  #mode-label small { font-size: 12px; font-weight: 500; color: var(--muted); }
  #timer { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--panel); border-radius: 10px; padding: 5px 10px; border: 1px solid var(--line); flex: none; }
  #timer.practice { color: var(--muted); }
  #hud-row2 { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-height: 44px; }
  #cat { width: 44px; height: 44px; flex: none; }
  #app.land #cat { width: 72px; height: 72px; }
  #cat.hop { animation: cathop 0.4s ease-out; }
  @keyframes cathop { 0% { transform: translateY(0); } 40% { transform: translateY(-7px) scale(1.06); } 100% { transform: translateY(0); } }
  #cat.shake { animation: catshake 0.45s; }
  @keyframes catshake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px) rotate(-6deg); } 40% { transform: translateX(5px) rotate(5deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  #cat.dance { animation: catdance 0.55s ease-in-out 3; }
  @keyframes catdance { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(8deg); } }
  #cat .eyes { transform-origin: 50px 53px; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
  #mistakes { font-size: 14px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #mistakes b { color: var(--ink); }
  #mistakes.hot b { color: var(--red); }
  #mistakes.bump { animation: bump 0.4s; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #diff { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  #hud-spacer { flex: 1; }
  #ch-chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; font-size: 13px; font-weight: 600; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #ch-chip svg { width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #ch-chip.beat { color: var(--green); }

  #board-wrap { grid-area: board; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
  #board {
    display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
    width: var(--board); height: var(--board);
    background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; position: relative;
  }
  .cell { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line); border-top: 1px solid var(--line); cursor: pointer; }
  .cell.c0 { border-left: none; } .cell.r0 { border-top: none; }
  .cell.bl { border-left: 2px solid var(--ink); } .cell.bt { border-top: 2px solid var(--ink); }
  .cell .v { font-size: calc(var(--cell) * 0.56); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink); }
  .cell.user .v { color: var(--accent); font-weight: 500; }
  .cell.wrong.user .v { color: var(--red); }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--accent-soft); }
  .cell.same .v { font-weight: 600; }
  .cell.wrong { background: var(--red-soft); }
  .cell.sel { background: var(--accent-mid); }
  .cell.sel.wrong { background: rgba(209,52,42,0.28); }
  .cell .notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(var(--nc), 1fr); grid-template-rows: repeat(var(--nr), 1fr); pointer-events: none; }
  .cell .notes i { font-style: normal; font-size: calc(var(--cell) * 0.26); font-weight: 500; color: var(--sub); display: flex; align-items: center; justify-content: center; line-height: 1; opacity: 0; }
  .cell .notes i.on { opacity: 1; }
  .cell.pop .v { animation: pop 0.18s ease-out; }
  @keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .cell.bad::after { content: ''; position: absolute; inset: 0; background: rgba(209,52,42,0.35); animation: badflash 0.5s ease-out forwards; pointer-events: none; }
  @keyframes badflash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .cell.hinted .v { animation: hintpop 0.7s ease-out; }
  @keyframes hintpop { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.3); } 100% { transform: scale(1) rotate(0); } }
  #board.won .cell .v { animation: winwave 0.5s ease-out var(--wd, 0ms) 1 both; }
  @keyframes winwave { 0% { transform: translateY(0); } 45% { transform: translateY(-18%) scale(1.15); } 100% { transform: translateY(0); } }
  #board.won .cell { background: transparent !important; }
  #board.enter { animation: boardin 0.3s ease-out; }
  @keyframes boardin { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  #msg {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font-size: 22px; font-weight: 800; color: var(--red); white-space: nowrap; pointer-events: none; opacity: 0; z-index: 4;
    text-shadow: 0 1px 0 #fff, 0 2px 10px rgba(255,255,255,0.9);
  }
  #msg.show { animation: msgfly 1.1s ease-out forwards; }
  #msg.good { color: var(--green); }
  #msg.big { font-size: 28px; letter-spacing: 0.4px; }
  @keyframes msgfly { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); } 75% { opacity: 1; transform: translate(-50%,-60%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-75%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { #cat .eyes, #cat.hop, #cat.shake, #cat.dance, #board.won .cell .v, #board.enter, .cell.pop .v { animation: none; } }

  /* ── foot: tools row + number pad, as wide as the board ── */
  #foot { grid-area: foot; width: var(--board); max-width: 100%; justify-self: center; align-self: end; display: flex; flex-direction: column; gap: 8px; }
  #app.land #foot { width: 100%; align-self: end; }
  #tools { display: flex; gap: 6px; }
  .tool { flex: 1; min-width: 0; border: none; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--sub); position: relative; min-height: 50px; }
  .tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool:active { background: rgba(47,42,36,0.08); }
  .tool:disabled { opacity: 0.38; }
  .tool .badge { position: absolute; top: -6px; right: -2px; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 7px; background: var(--muted); color: #fff; letter-spacing: 0.3px; }
  .tool.on { color: var(--accent); border-color: var(--accent); }
  .tool.on .badge { background: var(--accent); }
  .tool.ad { color: var(--green); }
  .tool.ad .badge { background: var(--green); }
  #pad { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 5px; }
  #app.land #pad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #app.land.n4 #pad, #app.land.n6 #pad { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .num { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; padding: 4px 0 3px; color: var(--accent); line-height: 1; }
  .num b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .num small { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .num:active { background: var(--accent-soft); }
  .num.done { opacity: 0.3; pointer-events: none; }
  #app.notes .num b { font-size: 18px; color: var(--sub); }
  #tip { font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; line-height: 1.3; min-height: 0; }
  #tip:empty { display: none; }
  .btns button, .lvl, .ibtn, .pill, .tool, .num { transition: transform 0.08s ease-out; }
  .btns button:active, .lvl:active, .ibtn:active, .pill:active, .tool:active, .num:active { transform: scale(0.95); }

  /* ── panels ── */
  .panel {
    position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(360px, calc(100vw - 24px)); max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); color: var(--ink); border-radius: 18px; padding: 18px 16px 14px; text-align: center;
    box-shadow: 0 10px 44px rgba(47,42,36,0.28); animation: panelin 0.24s ease-out;
  }
  @keyframes panelin { from { opacity: 0; transform: translate(-50%, -50%) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .panel h2 { font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .panel h2 svg { width: 30px; height: 30px; }
  .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .sub { font-size: 15px; color: var(--sub); margin-top: 4px; min-height: 18px; }
  .sub.win { color: var(--green); font-weight: 600; } .sub.lose { color: var(--red); font-weight: 600; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .btns button { border: none; border-radius: 13px; font-size: 16px; font-weight: 600; min-height: 48px; padding: 10px 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btns button svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-ad { background: var(--green); color: #fff; text-align: left; }
  .btn-ad small { display: block; font-size: 12px; font-weight: 500; opacity: 0.92; }
  .btn-ghost { background: rgba(47,42,36,0.07); color: var(--ink); }
  .note { font-size: 13px; font-weight: 500; color: var(--red); min-height: 16px; margin-top: 8px; }
  #share-note { color: var(--green); word-break: break-all; }
  #backdrop { position: fixed; inset: 0; z-index: 24; background: rgba(47,42,36,0.35); }
  #over-cat { width: 72px; height: 72px; margin: 2px auto 0; }

  /* title */
  #title-panel { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(var(--sat) + 16px) 20px calc(var(--sab) + 16px); overflow-y: auto; }
  #title-panel .logo { width: min(34vmin, 150px); height: min(34vmin, 150px); }
  #title-panel h1 { font-size: clamp(28px, 7vmin, 40px); font-weight: 700; letter-spacing: 0.2px; margin-top: 6px; line-height: 1.05; }
  #title-panel h1 small { display: block; font-size: 0.42em; font-weight: 500; color: var(--muted); letter-spacing: 0.2px; margin-top: 6px; }
  #title-btns { width: min(92vw, 360px); margin-top: 18px; }
  #title-btns button { display: flex; align-items: center; justify-content: space-between; text-align: left; }
  #title-btns button .l { display: flex; flex-direction: column; line-height: 1.2; }
  #title-btns button small { font-size: 12px; font-weight: 500; opacity: 0.85; }
  #title-best { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 16px; }
  #title-corner { position: absolute; right: calc(var(--sar) + 10px); top: calc(var(--sat) + 10px); display: flex; gap: 6px; }
  .pill { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: rgba(255,255,255,0.85); color: var(--ink); font-size: 12px; font-weight: 600; }
  #title-studio { margin-top: 14px; font-size: 11px; color: var(--muted); }
  #title-panel.short { justify-content: flex-start; }
  #title-panel.short .logo { width: 80px; height: 80px; }

  /* level select */
  #levels-panel { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 10px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); }
  #levels-head { width: min(100%, 440px); display: flex; align-items: center; gap: 8px; }
  #levels-head h2 { flex: 1; font-size: 20px; font-weight: 700; text-align: center; }
  #levels-head small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  #levels-grid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 440px); margin-top: 10px; flex: 1; min-height: 0; align-content: start; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 2px 2px 28px; scrollbar-width: none; }
  #levels-grid::-webkit-scrollbar { display: none; }
  .lvl-head { grid-column: 1 / -1; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 2px 0; }
  .lvl-head:first-child { padding-top: 0; }
  #levels-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .lvl { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 17px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  .lvl small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .lvl.done { background: var(--accent); color: #fff; border-color: var(--accent); } .lvl.done small { color: rgba(255,255,255,0.8); }
  .lvl.done svg { position: absolute; right: 5px; top: 5px; width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.6; }
  .lvl.next { outline: 3px solid var(--accent); outline-offset: -3px; }
  .lvl.locked { opacity: 0.4; } .lvl.locked svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; }
  body.land #levels-grid { grid-template-columns: repeat(10, 1fr); width: min(100%, 720px); }

  /* daily rank list */
  #rank-title { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: left; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
  #rank-title svg { width: 16px; height: 16px; }
  #rank-board { margin: 6px 0 8px; max-height: min(150px, 24vh); overflow-y: auto; background: rgba(47,42,36,0.05); border-radius: 10px; font-size: 14px; }
  .rank-row { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid rgba(47,42,36,0.07); color: var(--sub); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .rank-pos { width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: rgba(47,42,36,0.1); flex: none; font-variant-numeric: tabular-nums; }
  .rank-pos.m1 { background: #ffd98a; } .rank-pos.m2 { background: #e2e2e2; } .rank-pos.m3 { background: #e5bf96; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-name small { font-size: 10px; font-weight: 600; color: var(--accent); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
  .rank-s { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: var(--muted); }
  #name-row { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--sub); margin-top: 4px; }
  #name-input { width: 110px; background: rgba(47,42,36,0.05); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 14px; padding: 6px 8px; text-align: center; -webkit-user-select: text; user-select: text; font-family: inherit; }
  #next-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .pause-keys { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #app.cover { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: 1fr !important; grid-template-areas: "board" !important; }
  #app.cover #hud, #app.cover #foot { display: none; }
  #cover-badge { position: fixed; z-index: 35; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); border-radius: 28px; padding: 28px 44px 30px; text-align: center; box-shadow: 0 12px 50px rgba(47,42,36,0.32); }
  #cover-badge svg { width: 150px; height: 150px; margin: 0 auto; }
  #cover-badge h1 { font-size: 60px; font-weight: 700; line-height: 1.05; margin-top: 4px; white-space: nowrap; }
  #cover-badge h1 small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0.5px; margin-top: 8px; }
</style>
</head>
<body>

  <!-- Horangi, the developer's orange tabby (same drawing as Kitty Queens), four moods. Icons are stroked paths (rule 4.3.2: no emoji). -->

<script>
(function () {
  'use strict';

  var GAME_VERSION = '1.2.0';
  var GAME_TITLE = 'Kitty Sudoku';
  var S = window.SudokuCore;
  var MAX_LEVEL = S.MAX_LEVEL, MAX_SMALL = S.MAX_SMALL;
  var hash = location.hash || '';
  var DEBUG = hash.indexOf('debug') >= 0;
  var COVER = hash.indexOf('cover') >= 0;
  var WEB_URL = 'https://soulfulfillable.github.io/test-mvp/sudoku-playables/';

  // ---------- Bridge SDK adapter ----------
  var B = window.bridge || null;
  var bridgeReady = false;
  function safe(fn, dflt) { try { return fn(); } catch (e) { return dflt; } }
  var $ = function (id) { return document.getElementById(id); };

  // ---------- persistent state (Bridge storage only; rule 3.2.1) ----------
  var store = {
    progress: { v: 1, level: 1, cleared: 0, name: '', tut: 0, played: 0, small: {}, daily: { day: '', accum: 0, solved: 0, ranks: [] } },
    settings: { v: 1, muted: false, bgm: 'ukulele' }
  };
  function parseVal(v, dflt) {
    if (v === null || v === undefined) return dflt;
    if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return dflt; } }
    if (!v || typeof v !== 'object') return dflt;
    var out = {};
    for (var k in dflt) out[k] = (k in v) ? v[k] : dflt[k];
    return out;
  }
  function cleanRanks(list) {
    return Array.isArray(list) ? list.filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s) && r.s > 0; })
      .map(function (r) { return { n: String(r.n || 'You').slice(0, 8), s: Math.max(1, Math.round(r.s)), t: r.t || 0, f: r.f ? 1 : 0 }; })
      .sort(function (a, b) { return a.s - b.s; }).slice(0, RANK_MAX) : [];
  }
  function loadStore() {
    if (!bridgeReady) return Promise.resolve();
    return B.storage.get(['progress', 'settings']).then(function (data) {
      var p = parseVal(data[0], store.progress);
      p.level = Math.min(MAX_LEVEL, Math.max(1, parseInt(p.level, 10) || 1));
      p.cleared = Math.min(MAX_LEVEL, Math.max(0, parseInt(p.cleared, 10) || 0));
      if (p.level > p.cleared + 1) p.level = p.cleared + 1;
      p.name = String(p.name || '').slice(0, 8);
      p.tut = p.tut ? 1 : 0;
      p.played = Math.max(0, parseInt(p.played, 10) || 0);
      var sm = {}; if (p.small && typeof p.small === 'object') for (var sk in p.small) { var si = parseInt(sk, 10); if (si >= 1 && si <= MAX_SMALL && p.small[sk]) sm[si] = 1; } p.small = sm;
      var d = parseVal(p.daily, store.progress.daily);
      d.day = String(d.day || '');
      d.accum = Math.max(0, parseFloat(d.accum) || 0);
      d.solved = Math.max(0, parseFloat(d.solved) || 0);
      d.ranks = cleanRanks(d.ranks);
      p.daily = d;
      store.progress = p;
      var s = parseVal(data[1], store.settings);
      s.muted = !!s.muted;
      s.bgm = BGM_STYLES.some(function (x) { return x.id === s.bgm; }) ? s.bgm : 'ukulele';
      store.settings = s;
    }).catch(function () { /* unreadable data: new player */ });
  }
  var saveT = null;
  function saveStore(keys) {
    if (!bridgeReady) return;
    var vals = keys.map(function (k) { return JSON.stringify(store[k]); });
    safe(function () { B.storage.set(keys, vals).catch(function () {}); });
  }
  function saveStoreSoon(keys) { clearTimeout(saveT); saveT = setTimeout(function () { saveStore(keys); }, 700); }

  // ---------- date (KST day boundary, like our other daily puzzles) ----------
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function kstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }
  function dayKey() { var t = kstNow(); return '' + t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()); }
  function dayLabel(key) { var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; return m[parseInt(key.slice(4, 6), 10) - 1] + ' ' + parseInt(key.slice(6, 8), 10); }
  function untilNextPuzzle() {
    var t = kstNow();
    var left = 86400 - (t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds());
    var h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }
  function fmtTime(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); }
  function diffName(d) { return d.charAt(0).toUpperCase() + d.slice(1); }

  // ---------- sound: files only (ogg + mp3), one volume controller ----------
  var AUDIO_EXT = safe(function () { return document.createElement('audio').canPlayType('audio/ogg; codecs=vorbis') ? '.ogg' : '.mp3'; }, '.mp3');
  var SFX = {};
  ['mark', 'cat', 'clear', 'wrong', 'win', 'lose', 'heart', 'hint', 'start', 'mute-on', 'mute-off'].forEach(function (k) { SFX[k] = 'audio/' + k + AUDIO_EXT; });
  var BGM_STYLES = [{ id: 'ukulele', name: 'Ukulele', file: 'bgm-ukulele' }, { id: 'ragtime', name: 'Ragtime', file: 'bgm-ragtime' }];
  BGM_STYLES.forEach(function (st) { SFX['bgm_' + st.id] = 'audio/' + st.file + AUDIO_EXT; });
  function bgmKey() { return 'bgm_' + (store.settings.bgm || 'ukulele'); }
  var GAIN = { mark: 0.4, cat: 0.8, clear: 0.35, wrong: 0.75, win: 0.85, lose: 0.7, heart: 0.8, hint: 0.9, start: 0.5, 'mute-on': 0.5, 'mute-off': 0.5, bgm: 0.3 };
  var snd = { ctx: null, master: null, bufs: {}, raw: {}, fetching: {}, bgm: null, bgmKey: null, bgmGain: null, unlocked: false, reasons: { user: false, platform: false, paused: false, ad: false, hidden: false }, audible: true };
  function audibleNow() { var r = snd.reasons; return !(r.user || r.platform || r.paused || r.ad || r.hidden); }
  function applyAudio() {
    snd.audible = audibleNow();
    if (!snd.ctx) return;
    try {
      var t = snd.ctx.currentTime;

      if (mode === 'daily' && chIsToday() && !practice) $('ch-chip').classList.toggle('beat', elapsedNow() < chTime);
    }
    else if (state === STATE_TITLE) $('title-best').textContent = 'New daily puzzle in ' + untilNextPuzzle();
    else if (state === STATE_OVER && mode === 'daily' && won && panelOpen('over-panel')) $('next-note').textContent = 'New puzzle at midnight (KST) · ' + untilNextPuzzle() + ' left';
  }, 250);

  // ---------- boot: Bridge first, then saved state, then the first playable frame, then game_ready ----------
  function boot() {
    var init = B ? B.initialize().then(function () { bridgeReady = true; }).catch(function () { bridgeReady = false; }) : Promise.resolve();
    init.then(function () {
      if (bridgeReady) {
        safe(function () { return B.platform.language; }, 'en');   // English only (rule 3.4): the fallback is the game language
        isDesktop = safe(function () { return B.device.type === 'desktop'; }, false);
        isWeb = safe(function () { return B.platform.id === 'mock'; }, true);
        readSafeArea();
        setReason('platform', safe(function () { return B.platform.isAudioEnabled === false; }, false));
        setReason('paused', safe(function () { return B.platform.isPaused === true; }, false));
        adStateChanged(safe(function () { return B.advertisement.interstitialState; }, '') === 'opened' || safe(function () { return B.advertisement.rewardedState; }, '') === 'opened' ? 'opened' : 'closed');
        safe(function () {
          B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, function (enabled) { setReason('platform', !enabled); });
          B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, function (paused) { setReason('paused', !!paused); if (paused && state === STATE_PLAY) pauseGame(true); });
          B.advertisement.on(B.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, adStateChanged);
          B.advertisement.on(B.EVENT_NAME.REWARDED_STATE_CHANGED, onRewardedState);
          if (B.device && B.device.on) { B.device.on(B.EVENT_NAME.SCREEN_SIZE_CHANGED, layout); B.device.on(B.EVENT_NAME.ORIENTATION_STATE_CHANGED, layout); }
        });
      }
      var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (!isDesktop) isDesktop = !touch && !!(window.matchMedia && matchMedia('(pointer:fine)').matches);
      if (touch) isDesktop = false;
      return loadStore();
    }).then(function () {
      setReason('user', !!store.settings.muted);
      renderMute(); renderBgm();
      if (readHashChallenge()) absorbChallenge();
      // a first board behind the title so the layout is measured before the first tap
      loadPuzzle(S.genLevel(Math.min(MAX_LEVEL, store.progress.cleared + 1)));
      updateHud(); layout();
      fillTitle();
      if (COVER) setupCover();
      $('loading').classList.add('hidden');
      sendMsg('game_ready');
      fetchAudio();
      if (DEBUG) installDebug();
    });
  }
  function setupCover() {
    // still frame for covers: the title over a half-solved 9×9
    loadPuzzle(S.genLevel(80)); state = STATE_PLAY;
    var k = 0; for (var i = 0; i < N * N && k < 14; i++) if (!given[i]) { cells[i] = solution[i]; updateCell(i); k++; }
    sel = 40; updateHighlights(); state = STATE_TITLE;
    $('title-panel').classList.add('hidden');
    $('cover-badge').classList.remove('hidden');
    $('app').classList.add('cover');
    layout();
  }
  function installDebug() {
    window.__game = {
      get state() { return state; }, get mode() { return mode; }, get level() { return level; }, get N() { return N; },
      get solution() { return solution; }, get cells() { return cells; }, get given() { return given; }, get notes() { return notes; }, get sel() { return sel; },
      get mistakes() { return mistakes; }, get won() { return won; }, get lastTotal() { return lastTotal; }, get undoLen() { return undoStack.length; }, get notesMode() { return notesMode; },
      get store() { return store; }, get bridgeReady() { return bridgeReady; }, get audible() { return snd.audible; }, get reasons() { return snd.reasons; },
      get ctxState() { return snd.ctx ? snd.ctx.state : 'none'; }, get bufs() { return Object.keys(snd.bufs); }, get bgmPlaying() { return !!snd.bgm; },
      get frozen() { return frozen(); }, get userPaused() { return userPaused; }, get hintUsed() { return hintUsed; }, get continueUsed() { return continueUsed; }, get rewardEarned() { return rewardEarned; },
      get isDesktop() { return isDesktop; }, get isWeb() { return isWeb; }, get puzzleDay() { return puzzleDay; }, get practice() { return practice; }, get elapsed() { return elapsedNow(); }, get difficulty() { return difficulty; },
      get challenge() { return { time: chTime, name: chName, day: chDay, today: chIsToday() }; }, clashes: clashes, get counts() { return counts(); }, get shareText() { return shareText(); },
      get small() { return small; }, startSmall: startSmall,
      select: select, enter: enter, erase: erase, undo: undo, toggleNotes: toggleNotes, startLevel: startLevel, startDaily: startDaily, showLevels: showLevels, quitToTitle: quitToTitle, pauseGame: pauseGame, resumeGame: resumeGame,
      requestHint: requestHint, requestContinue: requestContinue, onRewardedState: onRewardedState, adStateChanged: adStateChanged, gameOver: gameOver,
      saveStore: saveStore, layout: layout, core: S,
      cellRect: function (i) { var b = cellEls[i].getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2, w: b.width }; },
      numRect: function (v) { var b = numEls[v - 1].getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2, w: b.width, h: b.height }; },
      boardRect: function () { var b = boardEl.getBoundingClientRect(); return { left: b.left, top: b.top, right: b.right, bottom: b.bottom, w: b.width }; },
      hudRect: function () { var b = $('hud').getBoundingClientRect(); return { left: b.left, top: b.top, right: b.right, bottom: b.bottom }; },
      footRect: function () { var b = $('foot').getBoundingClientRect(); return { left: b.left, top: b.top, right: b.right, bottom: b.bottom }; },
      set mistakes(v) { mistakes = v; updateHud(); }, version: GAME_VERSION
    };
  }
  boot();
})();
