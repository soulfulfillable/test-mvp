<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e6eed6">
<title>Odd Capy Out</title>
<style>
:root{
  --bg:#e6eed6; --meadow:#cddfb0; --tuft:#aac58a;
  --ink:#3b2a1d; --ink2:#6d5a49;
  --accent:#17736d; --accentInk:#ffffff;
  --sheet:#fbfaf4;
  --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:calc(100% + 240px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:grid;
  grid-template-rows:auto 1fr auto;padding-top:var(--safeT);touch-action:pan-y}
/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px 6px}
#round{font-size:13px;font-weight:600;color:var(--ink2);min-width:58px}
#goal{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
#goal svg{width:40px;height:36px;background:var(--meadow);border-radius:9px;border:1.5px solid rgba(59,42,29,.25)}
#left{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink);padding:0}
.iconbtn:active{background:rgba(59,42,29,.08)}
/* board */
#boardWrap{position:relative;min-height:0;margin:0 8px;border-radius:14px;overflow:hidden;background:var(--meadow)}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
/* bottom bar */
#bottom{display:flex;justify-content:center;padding:10px 12px calc(12px + var(--safeB))}
#hint{height:50px;min-width:150px;padding:0 22px;border-radius:14px;border:0;background:var(--accent);color:var(--accentInk);
  font:600 17px/1 inherit;font-family:inherit;display:flex;align-items:center;gap:8px;justify-content:center}
#hint:active{transform:scale(.97)}
#hint[disabled]{opacity:.45}
/* sheets */
.veil{position:absolute;inset:0;background:rgba(40,30,20,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.veil.on{display:flex}
.card{background:var(--sheet);border-radius:18px;padding:18px 18px 16px;width:min(340px,100%);text-align:center;
  max-height:calc(100% - 16px);overflow:hidden;display:flex;flex-direction:column;align-items:center}
.card h2{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
.card p{margin:6px 0 14px;font-size:20px;font-weight:600;line-height:1.25}
.card .sub{font-size:15px;font-weight:400;color:var(--ink2);margin:-6px 0 14px}
.bigpic{width:min(200px,52vw,30vh);aspect-ratio:10/9;background:var(--meadow);border-radius:16px;border:1.5px solid rgba(59,42,29,.2);margin:6px 0 4px}
.cta{height:50px;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font:600 17px/1 inherit;font-family:inherit}
.cta:active{transform:scale(.98)}
#doneSheet{display:none;width:100%;max-width:420px;align-items:center;gap:12px}
#doneSheet.on{display:flex;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
#bottom.done #hint{display:none}
#doneSheet p{margin:0;flex:1;text-align:left;font-size:17px;font-weight:600;line-height:1.2}
#doneSheet .sub{display:block;font-size:14px;font-weight:400;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
#doneSheet .cta{width:auto;flex:0 0 auto;padding:0 20px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
/* characters */
.breathe{animation:breathe 2.8s ease-in-out infinite;transform-origin:0px 0px}
@keyframes breathe{50%{transform:scale(1.018,1.035)}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="round">Round 1/3</div>
    <div id="goal"><svg id="goalPic" viewBox="0 0 100 90" aria-hidden="true"></svg><span id="left">1 left</span></div>
    <button class="iconbtn" id="restart" aria-label="Restart round">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
  </div>
  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="bottom">
    <button id="hint" aria-label="Hint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>Hint</span>
    </button>
    <div id="doneSheet" role="status"><p id="doneText">Found it!</p><button class="cta" id="next">Next round</button></div>
  </div>
  <div class="veil" id="introVeil">
    <div class="card" role="dialog">
      <h2 id="introRound">Round 1 of 3</h2>
      <svg class="bigpic" id="introPic" viewBox="0 0 100 90" aria-hidden="true"></svg>
      <p id="introText">Someone's facing the wrong way.</p>
      <div class="sub" id="introSub">Find them in the crowd.</div>
      <button class="cta" id="start">Start</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ---------- palette & art (one line weight, light from top-left) ---------- */
const C={fur:'#bb8459',light:'#d5a67a',shade:'#9a6842',line:'#4b3222',muzzle:'#8d5d3b',eye:'#2a1b12',blush:'#e8907d',foot:'#87573a'};
const LW=2.8;
const NS='http://www.w3.org/2000/svg';
const ROUNDS=[
  {kind:'back',  count:1, cols:5, minStep:66, text:"Someone's facing the wrong way.", sub:'Find them in the crowd.'},
  {kind:'disguise',count:1, cols:5, minStep:60, text:'One of them is in disguise.', sub:'Find the impostor.'},
  {kind:'upside',count:2, cols:5, minStep:56, text:'Two of them are doing a headstand.', sub:'Find both.'},
];
function body(){ // ears + body with shading, used by every pose
  return `<ellipse cx="29" cy="24" rx="7.5" ry="6.5" fill="${C.shade}" stroke="${C.line}" stroke-width="${LW}"/>
  <ellipse cx="71" cy="24" rx="7.5" ry="6.5" fill="${C.shade}" stroke="${C.line}" stroke-width="${LW}"/>
  <rect x="13" y="20" width="74" height="66" rx="30" fill="${C.fur}"/>
  <g clip-path="url(#bodyClip)"><ellipse cx="82" cy="66" rx="20" ry="30" fill="${C.shade}" opacity=".55"/>
  <ellipse cx="36" cy="32" rx="16" ry="7.5" fill="${C.light}"/></g>
  <rect x="13" y="20" width="74" height="66" rx="30" fill="none" stroke="${C.line}" stroke-width="${LW}"/>`;
}
function feet(){return `<rect x="26" y="79" width="15" height="9" rx="4.5" fill="${C.foot}" stroke="${C.line}" stroke-width="${LW*.85}"/>
  <rect x="59" y="79" width="15" height="9" rx="4.5" fill="${C.foot}" stroke="${C.line}" stroke-width="${LW*.85}"/>`;}
function face(){
  return `<g class="eyes"><circle cx="35" cy="45" r="3.7" fill="${C.eye}"/><circle cx="36.3" cy="43.7" r="1.15" fill="#fff"/>
  <circle cx="65" cy="45" r="3.7" fill="${C.eye}"/><circle cx="66.3" cy="43.7" r="1.15" fill="#fff"/></g>
  <ellipse class="blush" cx="24.5" cy="57" rx="5" ry="3" fill="${C.blush}" opacity=".4"/>
  <ellipse class="blush" cx="75.5" cy="57" rx="5" ry="3" fill="${C.blush}" opacity=".4"/>
  <ellipse cx="50" cy="60" rx="18" ry="12.5" fill="${C.muzzle}" stroke="${C.line}" stroke-width="${LW*.8}"/>
  <ellipse cx="44" cy="57" rx="2.3" ry="1.7" fill="${C.eye}"/><ellipse cx="56" cy="57" rx="2.3" ry="1.7" fill="${C.eye}"/>
  <path class="mouth" d="M45 65 Q50 68.5 55 65" fill="none" stroke="${C.eye}" stroke-width="2" stroke-linecap="round"/>`;
}
function backSide(){
  return `${body()}
  <path d="M45 23 q2.5 -6 5 -1 q2.5 -5 5 1" fill="none" stroke="${C.line}" stroke-width="${LW*.8}" stroke-linecap="round"/>
  <ellipse cx="50" cy="73" rx="5" ry="4" fill="${C.shade}" stroke="${C.line}" stroke-width="${LW*.8}"/>
  ${feet()}`;
}
function disguise(){ // round specs + a little moustache: same colours as the fur lines, so it takes a real look
  return `<g class="disg">
  <circle cx="35" cy="45" r="6.6" fill="none" stroke="${C.line}" stroke-width="2.2"/>
  <circle cx="65" cy="45" r="6.6" fill="none" stroke="${C.line}" stroke-width="2.2"/>
  <path d="M41.6 44.6 Q50 41.5 58.4 44.6" fill="none" stroke="${C.line}" stroke-width="2.2"/>
  <path d="M40 65.5 q5 -5 10 -2 q5 -3 10 2 q-5 3 -10 .3 q-5 2.7 -10 -.3z" fill="${C.line}"/></g>`;
}
function frontSide(withDisg){return `${body()}${feet()}${face()}${withDisg?disguise():''}`;}
// Character markup. local origin = bottom centre on the ground.
function capy(kind,opt={}){
  const tilt=opt.tilt||0, delay=opt.delay||0;
  let draw;
  if(kind==='back') draw=`<g class="backV">${backSide()}</g><g class="frontV" style="display:none">${frontSide(false)}</g>`;
  else if(kind==='disguise') draw=frontSide(true);
  else draw=frontSide(false);
  let inner=`<g transform="translate(-50,-86)">${draw}</g>`;
  if(kind==='upside') inner=`<g class="flip" style="transform:rotate(180deg);transform-origin:0px -43px">${inner}</g>`;
  return `<ellipse cx="0" cy="1" rx="34" ry="5" fill="rgba(70,50,25,.16)"/>
   <g transform="rotate(${tilt.toFixed(1)})"><g class="act"><g class="breathe" style="animation-delay:${delay.toFixed(2)}s">${inner}
   <g class="fx"></g></g></g></g>`;
}
const DEFS=`<defs><clipPath id="bodyClip"><rect x="13" y="20" width="74" height="66" rx="30"/></clipPath>
<mask id="spot"><rect x="-10" y="-10" width="5000" height="5000" fill="#fff"/><circle id="spotHole" cx="0" cy="0" r="0" fill="#000"/></mask></defs>`;
function picSVG(el,kind){el.innerHTML=DEFS.replace(/id="spot[^"]*"/g,'')+`<g transform="translate(50,84) scale(.86)">${capy(kind)}</g>`;}

/* ---------- random ---------- */
let seed=(Date.now()^ (Math.random()*1e9))>>>0;
function rnd(){seed^=seed<<13;seed>>>=0;seed^=seed>>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296;}
const rr=(a,b)=>a+(b-a)*rnd();

/* ---------- audio (synthesised, no files) ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f0,f1,dur,type='sine',vol=.18,when=0){const a=ac;if(!a)return;const t=a.currentTime+when;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
const sfx={
  found(){tone(520,780,.12,'triangle',.2);tone(780,1170,.16,'triangle',.18,.1);tone(1300,1900,.08,'sine',.08,.24);},
  wrong(){tone(220,150,.16,'sine',.16);},
  hint(){tone(880,880,.18,'sine',.07);tone(1320,1320,.22,'sine',.05,.08);},
  boing(){tone(300,620,.22,'sine',.12);},
  pop(){tone(900,300,.09,'square',.04);},
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

/* ---------- game state ---------- */
const $=id=>document.getElementById(id);
const board=$('board');
let R=0, chars=[], targets=[], found=0, hintLevel=0, lockUntil=0, roundStart=0, roundTimes=[], playing=false, layoutInfo=null;

function buildRound(){
  const cfg=ROUNDS[R];
  chars=[];targets=[];found=0;hintLevel=0;playing=false;
  const W=board.clientWidth||360,H=board.clientHeight||560, s0=Math.min((W-12)/((cfg.cols+.5)*80),(H-12)/(5*52+96));
  cfg.rows=Math.max(6,Math.min(14,Math.floor(((H-12)/s0-96)/cfg.minStep)+1));
  const n=cfg.cols*cfg.rows;
  // pick target cells: not adjacent to each other
  const tset=new Set();
  while(tset.size<cfg.count){
    const i=Math.floor(rnd()*n), c=i%cfg.cols, r=Math.floor(i/cfg.cols);
    let ok=true;for(const j of tset){const cj=j%cfg.cols,rj=Math.floor(j/cfg.cols);if(Math.abs(cj-c)+Math.abs(rj-r)<4)ok=false;}
    if(ok)tset.add(i);
  }
  for(let i=0;i<n;i++){
    const t=tset.has(i);
    chars.push({i,col:i%cfg.cols,row:Math.floor(i/cfg.cols),jx:rr(-7,7),jy:rr(-4,4),tilt:rr(-8,8),sc:rr(.95,1.05),
      delay:-rr(0,2.8),kind:t?cfg.kind:'front',target:t,found:false});
  }
  chars.filter(c=>c.target).forEach(c=>targets.push(c));
  layout();
}
function layout(){
  const cfg=ROUNDS[R];
  const W=board.clientWidth,H=board.clientHeight;if(!W||!H)return;
  board.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const pad=6, aw=W-pad*2, ah=H-pad*2;
  let s=Math.min(aw/((cfg.cols+.5)*80+30), ah/((cfg.rows-1)*52+100));
  let step=Math.min(80,Math.max(52,(ah/s-96)/(cfg.rows-1)));
  s=Math.min(s,ah/((cfg.rows-1)*step+100));
  const bw=(cfg.cols+.5)*80*s, bh=((cfg.rows-1)*step+100)*s;
  const ox=(W-bw)/2, oy=(H-bh)/2+4*s;
  layoutInfo={s,W,H};
  let html=DEFS+'<g id="tufts">';
  const tr=seed;seed=12345+R; // stable tufts
  for(let k=0;k<26;k++){const x=rr(0,W),y=rr(0,H),z=rr(.6,1.2)*s*10;
    html+=`<path d="M${x-z} ${y} q${z*.4} ${-z*1.4} ${z*.7} ${-z*1.6} M${x} ${y} q0 ${-z*1.6} ${z*.2} ${-z*2} M${x+z} ${y} q${-z*.3} ${-z*1.3} ${-z*.6} ${-z*1.5}" stroke="${'#aac58a'}" stroke-width="${2*s+.6}" fill="none" stroke-linecap="round"/>`;}
  seed=tr;
  html+='</g><g id="crowd">';
  for(const c of chars){
    const persp=.93+.1*(c.row/(cfg.rows-1));
    c.x=ox+(c.col+.5+(c.row%2?.5:0))*80*s+c.jx*s;
    c.y=oy+(86+c.row*step)*s+c.jy*s;
    c.s=s*c.sc*persp;
    html+=`<g class="c" data-i="${c.i}" transform="translate(${c.x.toFixed(1)},${c.y.toFixed(1)}) scale(${c.s.toFixed(4)})">${capy(c.kind,{tilt:c.tilt,delay:c.delay})}</g>`;
  }
  html+='</g><g id="rings"></g><g id="marks"></g><rect id="dim" x="0" y="0" width="'+W+'" height="'+H+'" fill="rgba(30,22,14,.5)" mask="url(#spot)" opacity="0" pointer-events="none"/><circle id="hintRing" r="0" fill="none" stroke="#fff" stroke-width="3" opacity="0" pointer-events="none"/>';
  board.innerHTML=html;
  for(const c of chars){c.el=board.querySelector(`.c[data-i="${c.i}"]`);if(c.found)markFound(c,false);}
}
function centre(c){return {x:c.x,y:c.y-48*c.s};}

/* ---------- input ---------- */
function boardPoint(e){const r=board.getBoundingClientRect();return{x:(e.clientX-r.left)*(layoutInfo.W/r.width),y:(e.clientY-r.top)*(layoutInfo.H/r.height)};}
function hit(p){
  for(let k=chars.length-1;k>=0;k--){const c=chars[k];
    let dx=(p.x-c.x)/c.s, dy=(p.y-c.y)/c.s;const a=-c.tilt*Math.PI/180;
    const lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<39&&ly<3&&ly>-72)return c;}
  return null;
}
board.addEventListener('pointerdown',e=>{
  audio();
  if(!playing||performance.now()<lockUntil)return;
  const p=boardPoint(e), c=hit(p);
  if(!c)return;
  if(c.target&&!c.found){onFound(c);}
  else if(!c.found){onWrong(c,p);}
});
function onWrong(c,p){
  lockUntil=performance.now()+450;
  sfx.wrong();buzz(15);
  c.el.querySelector('.act').animate([{transform:'translateX(0)'},{transform:'translateX(-5px) rotate(-4deg)'},{transform:'translateX(5px) rotate(4deg)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:380,easing:'ease-out'});
  const m=document.createElementNS(NS,'g');const z=10*layoutInfo.s+4;
  m.innerHTML=`<path d="M${-z} ${-z} L${z} ${z} M${z} ${-z} L${-z} ${z}" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M${-z} ${-z} L${z} ${z} M${z} ${-z} L${-z} ${z}" stroke="#b5483a" stroke-width="3" stroke-linecap="round"/>`;
  m.setAttribute('transform',`translate(${p.x},${p.y})`);$('marks').appendChild(m);
  m.animate([{opacity:1,transform:`translate(${p.x}px,${p.y}px) scale(.6)`},{opacity:1,transform:`translate(${p.x}px,${p.y}px) scale(1.1)`,offset:.25},{opacity:0,transform:`translate(${p.x}px,${p.y-6}px) scale(1)`}],{duration:650,easing:'ease-out'}).onfinish=()=>m.remove();
}
function markFound(c,anim){
  const q=centre(c);const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('cx',q.x);ring.setAttribute('cy',q.y);ring.setAttribute('r',46*c.s);
  ring.setAttribute('fill','none');ring.setAttribute('stroke','#17736d');ring.setAttribute('stroke-width',3.5);
  ring.classList.add('foundRing');$('rings').appendChild(ring);
  if(anim)ring.animate([{opacity:0,transform:'scale(1.6)'},{opacity:1,transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(.2,.9,.3,1.3)'}).onfinish=null;
  ring.style.transformOrigin=`${q.x}px ${q.y}px`;
  // bring found character to front
  $('crowd').appendChild(c.el);
  if(!anim)restPose(c);
}
function restPose(c){ // final pose after the action
  const el=c.el;
  if(c.kind==='back'){el.querySelector('.backV').style.display='none';el.querySelector('.frontV').style.display='';el.querySelectorAll('.blush').forEach(b=>b.setAttribute('opacity','.85'));}
  if(c.kind==='disguise'){const d=el.querySelector('.disg');d&&(d.style.display='none');el.querySelectorAll('.blush').forEach(b=>b.setAttribute('opacity','.85'));}
  if(c.kind==='upside'){el.querySelector('.flip').style.transform='rotate(0deg)';}
  el.querySelector('.mouth').setAttribute('d','M43 64 Q50 71 57 64');
}
function onFound(c){
  c.found=true;found++;hintClear();
  sfx.found();buzz([20,40,30]);
  markFound(c,true);
  doAction(c);
  updateHud();
  if(found>=targets.length){
    playing=false;roundTimes[R]=(performance.now()-roundStart)/1000;
    $('hint').disabled=true;
    setTimeout(showDone,1700);
  }
}
/* the found-it action: short, cute, funny */
function doAction(c){
  const el=c.el, act=el.querySelector('.act'), fx=el.querySelector('.fx');
  el.querySelector('.breathe').style.animation='none';
  if(c.kind==='back'){
    // startled hop, spins round to face you, blushes, happy wiggle + "!"
    act.animate([{transform:'scale(1,1)'},{transform:'scale(1.12,.86)',offset:.25},{transform:'translateY(-30px) scale(.0001,1.05)'}],{duration:300,easing:'ease-out',fill:'forwards'})
     .onfinish=()=>{restPose(c);sfx.pop();
       act.animate([{transform:'translateY(-30px) scale(.0001,1.05)'},{transform:'translateY(-30px) scale(1,1)',offset:.35},{transform:'translateY(0) scale(1.1,.9)',offset:.7},{transform:'translateY(0) scale(1,1)'}],{duration:420,easing:'ease-in-out',fill:'forwards'})
        .onfinish=()=>{act.getAnimations().forEach(a=>a.cancel());exclaim(fx,'!');wiggle(act,6);};};
  }else if(c.kind==='disguise'){
    // glasses and moustache pop off and fly away, caught! sheepish grin
    const d=el.querySelector('.disg');
    act.animate([{transform:'translateY(0)'},{transform:'translateY(-14px) scale(1.04,.98)',offset:.4},{transform:'translateY(0) scale(1.06,.92)',offset:.8},{transform:'none'}],{duration:420,easing:'ease-out'});
    d.style.transformOrigin='50px 50px';
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate(14px,-46px) rotate(35deg)',opacity:1,offset:.5},{transform:'translate(34px,-20px) rotate(110deg)',opacity:0}],{duration:900,easing:'cubic-bezier(.3,.7,.5,1)',fill:'forwards'})
      .onfinish=()=>{restPose(c);};
    setTimeout(()=>{sfx.boing();el.querySelectorAll('.blush').forEach(b=>b.setAttribute('opacity','.85'));el.querySelector('.mouth').setAttribute('d','M43 64 Q50 71 57 64');sweat(fx);wiggle(act,5);},420);
  }else{
    // wobble, wobble... topples back on its feet, dizzy stars
    const f=el.querySelector('.flip');
    f.animate([{transform:'rotate(180deg)'},{transform:'rotate(166deg)',offset:.2},{transform:'rotate(194deg)',offset:.45},{transform:'rotate(172deg)',offset:.65},{transform:'rotate(180deg)'}],{duration:560,easing:'ease-in-out'})
     .onfinish=()=>{sfx.boing();
       act.animate([{transform:'translateY(0)'},{transform:'translateY(-26px)',offset:.45},{transform:'translateY(0) scale(1.1,.88)',offset:.85},{transform:'none'}],{duration:520,easing:'ease-in-out'});
       f.animate([{transform:'rotate(180deg)'},{transform:'rotate(360deg)'}],{duration:440,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'})
        .onfinish=()=>{f.getAnimations().forEach(a=>a.cancel());restPose(c);dizzy(fx);};};
  }
}
function wiggle(act,deg){act.animate([{transform:'rotate(0)'},{transform:`rotate(${-deg}deg)`},{transform:`rotate(${deg}deg)`},{transform:`rotate(${-deg}deg)`},{transform:'rotate(0)'}],{duration:620,easing:'ease-in-out'});}
function exclaim(fx,ch){const g=document.createElementNS(NS,'g');
  g.innerHTML=`<path d="M0 -112 L0 -96" stroke="${C.line}" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="-86" r="3.4" fill="${C.line}"/>`;
  fx.appendChild(g);g.style.transformOrigin='0px -90px';
  g.animate([{transform:'scale(0)',opacity:1},{transform:'scale(1.25)',offset:.3},{transform:'scale(1)',opacity:1,offset:.8},{opacity:0}],{duration:1300,fill:'forwards'});}
function sweat(fx){const g=document.createElementNS(NS,'g');
  g.innerHTML=`<path d="M38 -70 q6 9 0 12 q-6 -3 0 -12z" fill="#9fd3e6" stroke="${C.line}" stroke-width="2"/>`;
  fx.appendChild(g);g.animate([{transform:'translateY(-4px)',opacity:0},{opacity:1,offset:.2},{transform:'translateY(10px)',opacity:1,offset:.8},{transform:'translateY(14px)',opacity:0}],{duration:1200,fill:'forwards'});}
function dizzy(fx){const g=document.createElementNS(NS,'g');
  const star=(a)=>`<g class="st" data-a="${a}"><path d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4Z" fill="#f2c94c" stroke="${C.line}" stroke-width="1.6" stroke-linejoin="round"/></g>`;
  g.innerHTML=star(0)+star(2.1)+star(4.2);fx.appendChild(g);
  const sts=[...g.querySelectorAll('.st')];const t0=performance.now();
  (function spin(){const t=(performance.now()-t0)/1000;if(t>1.5){g.remove();return;}
    sts.forEach(s=>{const a=+s.dataset.a+t*7;s.setAttribute('transform',`translate(${Math.cos(a)*28},${-98+Math.sin(a)*7})`);s.setAttribute('opacity',t>1.2?(1.5-t)/.3:1);});
    requestAnimationFrame(spin);})();
}

/* ---------- hint: spotlight that tightens each press ---------- */
let hintTimer=0;
function hintTarget(){return targets.find(t=>!t.found);}
function showHint(){
  if(!playing)return;audio();
  const t=hintTarget();if(!t)return;
  hintLevel=Math.min(3,hintLevel+1);
  const {W,H}=layoutInfo, m=Math.min(W,H);
  const rad=[0,.42*m,.25*m,52*t.s][hintLevel];
  const q=centre(t);
  // offset the centre so the target is inside but not dead-centre (except last level)
  const slack=Math.max(0,rad-52*t.s)*(hintLevel<3?.55:0);
  const a=(t.i*2.399+hintLevel*1.7);
  const cx=q.x+Math.cos(a)*slack, cy=q.y+Math.sin(a)*slack;
  const hole=$('spotHole'),dim=$('dim'),ring=$('hintRing');
  hole.setAttribute('cx',cx);hole.setAttribute('cy',cy);hole.setAttribute('r',rad);
  ring.setAttribute('cx',cx);ring.setAttribute('cy',cy);ring.setAttribute('r',rad);
  dim.getAnimations().forEach(a=>a.cancel());ring.getAnimations().forEach(a=>a.cancel());
  dim.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:2600});
  ring.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:2600});
  sfx.hint();buzz(10);
  window.__hintShown={cx,cy,r:rad,level:hintLevel};
}
function hintClear(){hintLevel=0;$('dim').getAnimations().forEach(a=>a.cancel());$('hintRing').getAnimations().forEach(a=>a.cancel());}

/* ---------- blink (natural, brief) ---------- */
setInterval(()=>{if(!chars.length)return;const c=chars[Math.floor(Math.random()*chars.length)];const e=c.el&&c.el.querySelector('.eyes');
  if(e){e.style.transformOrigin='50px 45px';e.animate([{transform:'scaleY(1)'},{transform:'scaleY(.1)'},{transform:'scaleY(1)'}],{duration:160});}},380);

/* ---------- flow ---------- */
function updateHud(){
  $('round').textContent=`Round ${R+1}/3`;
  const left=targets.length-found;$('left').textContent=`${left} left`;
}
function intro(){
  const cfg=ROUNDS[R];
  $('introRound').textContent=`Round ${R+1} of 3`;
  $('introText').textContent=cfg.text;$('introSub').textContent=cfg.sub;
  picSVG($('introPic'),cfg.kind);picSVG($('goalPic'),cfg.kind);
  $('introVeil').classList.add('on');$('doneSheet').classList.remove('on');$('bottom').classList.remove('done');
  buildRound();updateHud();$('hint').disabled=true;
}
function start(){
  audio();
  $('introVeil').classList.remove('on');playing=true;roundStart=performance.now();$('hint').disabled=false;
}
const fmt=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
function showDone(){
  const last=R===ROUNDS.length-1;
  if(last){const tot=roundTimes.reduce((a,b)=>a+(b||0),0);
    $('doneText').innerHTML=`All 3 found!<span class="sub">Total time ${fmt(tot)}</span>`;$('next').textContent='Play again';}
  else{$('doneText').innerHTML=`Found ${targets.length>1?'them':'it'}! <span class="sub">${fmt(roundTimes[R])}</span>`;$('next').textContent='Next round';}
  $('doneSheet').classList.add('on');$('bottom').classList.add('done');
}
$('start').addEventListener('click',start);
$('next').addEventListener('click',()=>{if(R===ROUNDS.length-1){R=0;roundTimes=[];}else R++;intro();});
$('hint').addEventListener('click',showHint);
$('restart').addEventListener('click',()=>{audio();if($('introVeil').classList.contains('on'))return;buildRound();updateHud();$('doneSheet').classList.remove('on');$('bottom').classList.remove('done');playing=true;roundStart=performance.now();$('hint').disabled=false;});
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,120);});
/* keep the in-app browser sheet from grabbing vertical drags */
function park(){if(Math.abs(scrollY-120)>2)scrollTo(0,120);}
addEventListener('load',park);addEventListener('scroll',()=>{clearTimeout(park.t);park.t=setTimeout(park,150);},{passive:true});
document.addEventListener('dblclick',e=>e.preventDefault());
/* test hooks (read-only) */
window.HF={get round(){return R},get playing(){return playing},get found(){return found},
  targets(){const r=board.getBoundingClientRect();return targets.map(t=>{const q=centre(t);return{x:r.left+q.x*r.width/layoutInfo.W,y:r.top+q.y*r.height/layoutInfo.H,found:t.found};});},
  decoy(){const r=board.getBoundingClientRect();const c=chars.find(c=>!c.target&&chars.every(t=>!t.target||Math.hypot(t.x-c.x,t.y-c.y)>120*c.s));const q=centre(c);return{x:r.left+q.x*r.width/layoutInfo.W,y:r.top+q.y*r.height/layoutInfo.H};},
  count(){return chars.length}};
intro();
</script>
