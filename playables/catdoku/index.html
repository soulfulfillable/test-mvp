<!DOCTYPE html>
<html lang="en">
<head>
<!-- Playgama Bridge SDK must be the first script in <head>, loaded normally (SDK required step 2).
     Local copy of npm @playgama/bridge (see CREDITS.md) so the archive ships everything it needs (rule 1.2.5). -->
<script src="playgama-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kitty Queens: Cat Sudoku</title>
<style>
  :root {
    --bg: #f6efe4; --ink: #4a3b28; --sub: #6b5a41; --muted: #8a7a5f; --panel: #fff;
    --accent: #f0915a; --red: #d1342a; --green: #2e9e5b; --gold: #ffd98a;
    --board: 300px; --n: 7;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); touch-action: none;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  svg { display: block; }
  .hidden { display: none !important; }
  #defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ── loading screen (first thing on screen, hidden right before game_ready) ── */
  #loading { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); }
  #loading svg { width: 96px; height: 96px; }
  #loading .ttl { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
  #loading .bar { width: 150px; height: 6px; border-radius: 3px; background: rgba(74,59,40,0.14); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; border-radius: 3px; background: var(--accent); animation: load 1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-40%); } to { transform: translateX(380%); } }

  /* ── play screen: grid that turns sideways in landscape ── */
  #app {
    position: fixed; inset: 0; display: grid;
    grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "hud" "board" "foot";
    padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);
    gap: 6px;
  }
  #app.land {
    grid-template-rows: auto 1fr; grid-template-columns: minmax(190px, 300px) minmax(0, 1fr);
    grid-template-areas: "hud board" "foot board"; column-gap: 14px;
  }
  #hud { grid-area: hud; width: min(100%, 520px); min-width: 0; justify-self: center; }
    #app.land #hud { width: 100%; align-self: start; }
  #hud-top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; border: none; background: rgba(74,59,40,0.08); display: flex; align-items: center; justify-content: center; flex: none; }
  .ibtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn:active { background: rgba(74,59,40,0.18); }
  #mute-btn .on, #mute-btn .off { display: none; }
  #mute-btn[data-muted="0"] .on { display: block; }
  #mute-btn[data-muted="1"] .off { display: block; }
  #mode-label { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; display: flex; flex-direction: column; line-height: 1.15; }
  #mode-label span, #mode-label small { overflow: hidden; text-overflow: ellipsis; }
  #mode-label small { font-size: 12px; font-weight: 600; color: var(--muted); }
  #timer { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--panel); border-radius: 10px; padding: 4px 10px; box-shadow: 0 1px 3px rgba(120,90,40,0.15); flex: none; }
  #timer.practice { color: var(--muted); }
  #hearts { display: flex; gap: 2px; flex: none; }
  #hearts svg { width: 22px; height: 22px; }
  #hearts svg.off path { fill: none; stroke: rgba(74,59,40,0.3); stroke-width: 2; }
  #hearts svg.flash { animation: hflash 0.5s; }
  @keyframes hflash { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.5); } }
  #hud-row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-height: 36px; }
  #progress { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; background: var(--panel); border-radius: 10px; padding: 4px 10px; box-shadow: 0 1px 3px rgba(120,90,40,0.12); font-variant-numeric: tabular-nums; }
  #progress svg { width: 22px; height: 22px; }
  #hud-spacer-top { flex: 1; }
  .adbtn { display: flex; align-items: center; gap: 6px; border: none; border-radius: 10px; background: var(--green); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 10px; min-height: 36px; }
  .adbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .adbtn small { display: block; font-size: 10px; font-weight: 600; opacity: 0.9; }
  #rules { display: flex; gap: 6px; margin-top: 6px; }
  .chip { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 10px; padding: 5px 7px; font-size: 11px; font-weight: 700; color: var(--sub); line-height: 1.2; box-shadow: 0 1px 3px rgba(120,90,40,0.12); }
  .chip svg { width: 26px; height: 26px; flex: none; }
  #app.land #rules { flex-direction: column; }

  #board-wrap { grid-area: board; position: relative; display: flex; align-items: flex-end; justify-content: center; min-height: 0; min-width: 0; }
  #app.land #board-wrap { align-items: center; }
  #board {
    display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); gap: 3px;
    width: var(--board); height: var(--board); padding: 5px;
    background: var(--panel); border-radius: 14px; box-shadow: 0 3px 14px rgba(120,90,40,0.18);
    position: relative;
  }
  .cell { border-radius: 16%; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 0; min-height: 0; overflow: hidden; }
  .cell svg { width: 66%; height: 66%; pointer-events: none; }
  .cell svg.xm { width: 46%; height: 46%; color: var(--ink); }
  .cell svg.ax { width: 40%; height: 40%; color: rgba(255,255,255,0.62); }
  .cell.pop svg.cat { animation: pop 0.28s ease-out; }
  @keyframes pop { 0% { transform: scale(0.3); } 65% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .cell.bad::after { content: ''; position: absolute; inset: 0; border-radius: 16%; background: rgba(209,52,42,0.6); animation: badflash 0.75s ease-out forwards; pointer-events: none; }
  @keyframes badflash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .cell.cursor::before { content: ''; position: absolute; inset: 2px; border-radius: 14%; border: 3px solid var(--ink); pointer-events: none; }
  .cell.guide::before { content: ''; position: absolute; inset: 1px; border-radius: 14%; border: 3px solid #fff; box-shadow: 0 0 0 3px var(--ink); animation: guidepulse 1s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes guidepulse { from { opacity: 0.45; } to { opacity: 1; } }
  .cell.hinted svg.cat { animation: hintpop 0.9s ease-out; }
  @keyframes hintpop { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  #board.shake { animation: shake 0.35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  #board.won .cell svg.cat { animation: winbounce 0.7s ease-in-out infinite alternate; }
  @keyframes winbounce { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-9%) scale(1.12); } }
  #hand { position: absolute; width: 15%; height: 15%; pointer-events: none; z-index: 3; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); animation: handtap 0.9s ease-in-out infinite; }
  @keyframes handtap { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-6%, -10%) scale(0.9); } }
  #msg {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: 21px; font-weight: 900; color: var(--red); white-space: nowrap; pointer-events: none; opacity: 0; z-index: 4;
    text-shadow: 0 1px 0 #fff, 0 2px 10px rgba(255,255,255,0.9);
  }
  #msg.show { animation: msgfly 1.2s ease-out forwards; }
  #msg.good { color: var(--green); }
  @keyframes msgfly { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); } 75% { opacity: 1; transform: translate(-50%,-60%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-75%) scale(1); } }

  #foot { grid-area: foot; width: min(100%, 520px); justify-self: center; align-self: end; min-height: 44px; display: flex; flex-direction: column; justify-content: flex-end; }
  #app.land #foot { width: 100%; }
  #tip { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.35; }
  #tut { background: var(--ink); color: #fff; border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 700; line-height: 1.35; text-align: center; }
  #tut.hidden { display: none; }
  #app.land #tip { text-align: left; }

  /* ── panels ── */
  .panel {
    position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(360px, calc(100vw - 24px)); max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); color: var(--ink); border-radius: 18px; padding: 18px 16px 14px; text-align: center;
    box-shadow: 0 10px 44px rgba(74,59,40,0.3); animation: panelin 0.26s ease-out;
  }
  @keyframes panelin { from { opacity: 0; transform: translate(-50%, -50%) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .panel h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .panel h2 svg { width: 30px; height: 30px; }
  .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .sub { font-size: 15px; color: var(--sub); margin-top: 4px; min-height: 18px; }
  .sub.win { color: var(--green); font-weight: 700; } .sub.lose { color: var(--red); font-weight: 700; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .btns button { border: none; border-radius: 13px; font-size: 16px; font-weight: 700; min-height: 48px; padding: 10px 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btns button svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-main { background: var(--ink); color: var(--gold); }
  .btn-ad { background: var(--green); color: #fff; text-align: left; }
  .btn-ad small { display: block; font-size: 12px; font-weight: 600; opacity: 0.9; }
  .btn-ghost { background: rgba(74,59,40,0.08); color: var(--ink); }
  .note { font-size: 13px; font-weight: 600; color: var(--red); min-height: 16px; margin-top: 8px; }
  #share-note { color: var(--green); }
  #backdrop { position: fixed; inset: 0; z-index: 24; background: rgba(74,59,40,0.35); }

  /* title */
  #title-panel { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(var(--sat) + 16px) 20px calc(var(--sab) + 16px); overflow-y: auto; }
  #title-panel .logo { width: min(34vmin, 150px); height: min(34vmin, 150px); }
  #title-panel h1 { font-size: clamp(28px, 7vmin, 40px); font-weight: 800; letter-spacing: 0.3px; margin-top: 6px; line-height: 1.05; }
  #title-panel h1 small { display: block; font-size: 0.5em; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  #title-rules { display: flex; gap: 8px; margin-top: 14px; width: min(92vw, 420px); }
  #title-rules .chip { padding: 8px 8px; font-size: 12px; }
  #title-btns { width: min(92vw, 360px); margin-top: 16px; }
  #title-btns button { display: flex; align-items: center; justify-content: space-between; text-align: left; }
  #title-btns button .l { display: flex; flex-direction: column; line-height: 1.2; }
  #title-btns button small { font-size: 12px; font-weight: 600; opacity: 0.8; }
  #title-best { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 16px; }
  #title-corner { position: absolute; right: calc(var(--sar) + 10px); top: calc(var(--sat) + 10px); display: flex; gap: 6px; }
  .pill { height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid rgba(74,59,40,0.25); background: rgba(255,255,255,0.8); color: var(--ink); font-size: 12px; font-weight: 600; }
  #title-studio { margin-top: 14px; font-size: 11px; color: var(--muted); }
  #title-panel.short { justify-content: flex-start; }
  #title-panel.short .logo { width: 80px; height: 80px; }

  /* level select */
  #levels-panel { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 10px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); }
  #levels-head { width: min(100%, 440px); display: flex; align-items: center; gap: 8px; }
  #levels-head h2 { flex: 1; font-size: 20px; font-weight: 800; text-align: center; }
  #levels-head small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  #levels-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 440px, calc(100vh - 170px)); margin-top: 12px; flex: 1; align-content: start; }
  .lvl { aspect-ratio: 1; border: none; border-radius: 14px; background: var(--panel); box-shadow: 0 1px 3px rgba(120,90,40,0.14); font-size: 17px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  .lvl small { font-size: 10px; font-weight: 600; color: var(--muted); }
  .lvl.done { background: var(--ink); color: var(--gold); } .lvl.done small { color: rgba(255,217,138,0.8); }
  .lvl.done svg { position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; }
  .lvl.next { outline: 3px solid var(--accent); outline-offset: -3px; }
  .lvl.locked { opacity: 0.4; } .lvl.locked svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; }
  #levels-nav { width: min(100%, 440px); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  body.land #levels-grid { grid-template-columns: repeat(10, 1fr); width: min(100%, 720px); }

  /* daily rank list */
  #rank-title { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: left; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
  #rank-title svg { width: 16px; height: 16px; }
  #rank-board { margin: 6px 0 8px; max-height: min(150px, 24vh); overflow-y: auto; background: rgba(74,59,40,0.05); border-radius: 10px; font-size: 14px; }
  .rank-row { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid rgba(74,59,40,0.07); color: var(--sub); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(240,145,90,0.2); color: var(--ink); font-weight: 700; }
  .rank-pos { width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: rgba(74,59,40,0.1); flex: none; font-variant-numeric: tabular-nums; }
  .rank-pos.m1 { background: var(--gold); } .rank-pos.m2 { background: #e2e2e2; } .rank-pos.m3 { background: #e5bf96; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: var(--muted); }
  #name-row { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--sub); margin-top: 4px; }
  #name-input { width: 110px; background: rgba(74,59,40,0.06); border: 1px solid rgba(74,59,40,0.2); border-radius: 8px; color: var(--ink); font-size: 14px; padding: 6px 8px; text-align: center; -webkit-user-select: text; user-select: text; font-family: inherit; }
  #next-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .pause-keys { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #over-cat { width: 72px; height: 72px; margin: 2px auto 0; }
  #app.cover { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: 1fr !important; grid-template-areas: "board" !important; }
  #app.cover #hud, #app.cover #foot { display: none; }
  #app.cover #board-wrap { align-items: center; }
  #cover-badge { position: fixed; z-index: 35; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.94); border-radius: 28px; padding: 28px 44px 30px; text-align: center; box-shadow: 0 12px 50px rgba(74,59,40,0.35); }
  #cover-badge svg { width: 150px; height: 150px; margin: 0 auto; }
  #cover-badge h1 { font-size: 60px; font-weight: 800; line-height: 1.05; margin-top: 4px; white-space: nowrap; }
  #cover-badge h1 small { display: block; font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
</style>
</head>

  // ---------- rewarded ads: hint (one per puzzle) and continue (once per attempt); reward only on 'rewarded' ----------

  function nextHintCell() { for (var r = 0; r < N; r++) if (cell[r][solution[r]] !== 2) return [r, solution[r]]; return null; }

  // ---------- boot: Bridge first, then saved state, then the first playable frame, then game_ready ----------

  }
