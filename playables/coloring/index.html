<!DOCTYPE html>
<html lang="en">
<head>
<!-- Playgama Bridge SDK must be the first script in <head>, loaded normally (SDK required step 2).
     Local copy of npm @playgama/bridge (see CREDITS.md) so the archive ships everything it needs (rule 1.2.5). -->
<script src="playgama-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cozy Coloring</title>
<script src="coloring-pics.js"></script>
<style>
  :root {
    --paper: #f4f1e9; --card: #fdfcf9; --ink: #1c1a16; --sub: #5e5648; --muted: #8a8172; --line: #ddd7c9; --rule: #1c1a16;
    --accent: #d6391b; --accent-dark: #b32d12; --accent-soft: #fbeae4; --accent-line: #f0cec2;
    --play-bg: #fdf9f0; --green: #2e9e5b;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--paper); }
  body {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); touch-action: none;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; border: none; background: none; }
  svg { display: block; }
  .hidden { display: none !important; }
  #defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── loading (first thing on screen, hidden right before game_ready) ── */
  #loading { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--paper); }
  #loading .ttl { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
  #loading .bar { width: 150px; height: 3px; background: var(--line); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: load 1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-40%); } to { transform: translateX(380%); } }
  #loading .dots { display: flex; gap: 6px; }
  #loading .dots i { width: 14px; height: 14px; border-radius: 50%; }

  #app { position: fixed; inset: 0; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ── Home / gallery — hairline grid, red accent, paper ── */
  #home { background: var(--paper); padding: var(--sat) var(--sar) 0 var(--sal); }
  #home-inner { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #home-head { display: flex; align-items: flex-end; gap: 10px; padding: 14px 18px 10px; }
  #home-head .tt { flex: 1; min-width: 0; }
  #kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  #home-head h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-top: 2px; line-height: 1; }
  .ibtn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; flex: none; color: var(--ink); }
  .ibtn:active { background: var(--paper); }
  .ibtn[data-muted="0"] .off, .ibtn[data-muted="1"] .on { display: none; }
  #home-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; padding-bottom: calc(20px + var(--sab)); }
  #home-scroll::-webkit-scrollbar { display: none; }

  .row { display: flex; align-items: center; gap: 12px; margin: 0 18px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--line); }
  .row + .row { border-top: none; }
  .row .cthumb { width: 56px; height: 66px; flex: none; border: 1px solid var(--line); background: var(--card); padding: 2px; }
  .row .cthumb svg { display: block; width: 100%; height: 100%; }
  .row .cmid { flex: 1; min-width: 0; }
  .row .clabel { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  .row .cname { font-size: 16px; font-weight: 800; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .cmeta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .row .ctrack { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .row .cbar { flex: 1; height: 2px; background: var(--line); position: relative; }
  .row .cbar i { position: absolute; left: 0; top: -0.5px; height: 3px; background: var(--accent); }
  .row .cpct { font-size: 12px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
  .btn-red { flex: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; padding: 12px 18px; min-height: 44px; }
  .btn-red:active { background: var(--accent-dark); }
  .btn-red.done { background: var(--card); color: var(--ink); border: 1px solid var(--line); }

  #filter { display: flex; align-items: center; margin: 12px 18px 0; }
  #filter button { border: 1px solid var(--line); border-left: none; background: var(--card); color: var(--ink); font-size: 13px; font-weight: 700; padding: 9px 14px; min-height: 36px; }
  #filter button:first-child { border-left: 1px solid var(--line); }
  #filter button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  #filter .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; align-content: start; background: var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 12px 18px 0; }
  .card { background: var(--card); padding: 10px 10px 12px; position: relative; cursor: pointer; text-align: left; display: block; width: 100%; }
  .card:active { background: #f6f2e8; }
  .card .thumb { border: 1px solid #e4dfd2; background: #fff; padding: 3px; position: relative; }
  .card .thumb svg { display: block; width: 100%; height: auto; }
  .card .crow { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .card .nm { font-size: 14px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .num { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .chip { flex: none; font-size: 10px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 2px 6px 3px; display: flex; align-items: center; gap: 3px; }
  .card .chip svg { width: 11px; height: 11px; stroke-width: 3; }
  .card .meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card .pgline { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  .card.locked .thumb svg { opacity: 0.22; }
  .card.locked .nm { color: var(--muted); }
  .card .lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; color: var(--muted); stroke-width: 1.8; }
  .card .unlock { margin-top: 8px; width: 100%; background: var(--green); color: #fff; font-size: 12px; font-weight: 800; padding: 9px 8px; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .card .unlock .badge { font-size: 9px; padding: 2px 5px; background: rgba(255,255,255,0.25); letter-spacing: 0.3px; }
  .card .unlock svg { width: 16px; height: 16px; }
  .empty { grid-column: 1 / -1; background: var(--card); padding: 36px 12px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
  #home-foot { font-size: 11px; color: var(--muted); text-align: center; padding: 14px 18px 0; }

  /* ── Play ── */
  #play { background: var(--play-bg); display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "art" "foot"; padding: var(--sat) var(--sar) 0 var(--sal); }
  #play.land { grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr) minmax(180px, 26%); grid-template-areas: "head head" "art foot"; }
  #play-head { grid-area: head; display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
  #head-mid { flex: 1; min-width: 0; }
  #pic-name { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pbar { height: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s ease; }
  #pct { font-size: 14px; font-weight: 800; color: var(--sub); min-width: 40px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

  #art-wrap { grid-area: art; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; padding: 4px 10px; position: relative; }
  #art-vp { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); touch-action: none; }
  #art-tf { transform-origin: 0 0; }
  #art-vp svg { display: block; }
  #zoom-ctrl { position: absolute; right: 8px; bottom: 8px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
  #zoom-ctrl button { width: 40px; height: 40px; border: 1px solid var(--line); background: rgba(255,255,255,0.95); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  #zoom-ctrl button:active { transform: scale(0.94); }
  #zoom-ctrl button svg { width: 20px; height: 20px; }
  #zoom-ctrl button.dim { opacity: 0.35; }
  #msg { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(28,26,22,0.88); color: #fff; font-size: 13px; font-weight: 700; padding: 8px 14px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 6; }
  #msg.show { opacity: 1; }

  .region { stroke: #ccd3da; stroke-width: 1.2; fill: #fff; pointer-events: fill; } /* hit-test the fill only: a neighbor's hairline must not steal the tap */
  .region.filled { stroke: none; }
  .region.hl { animation: hlp 1.3s ease-in-out infinite; }
  @keyframes hlp { 0%, 100% { fill: #fff; } 50% { fill: var(--tint); } }
  .region.shake { animation: shk 0.35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes shk { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .lbl { fill: #98a2b3; font-weight: 700; text-anchor: middle; pointer-events: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .lbl.on { fill: #4a5468; }
  .lbl.flash { animation: lfl 0.5s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes lfl { 0%,100% { transform: scale(1); } 40% { transform: scale(1.9); } }
  #play.free .lbl { display: none; }
  .deco { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .region.hl, .region.shake, .lbl.flash { animation: none; } }

  #foot { grid-area: foot; display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-bottom: var(--sab); }
  #play.land #foot { padding: 6px 10px calc(10px + var(--sab)) 0; }
  #mode-row { flex: none; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 6px 12px 0; }
  .seg { display: flex; }
  .seg button { border: 1px solid var(--line); border-left: none; background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 800; padding: 0 14px; min-height: 36px; display: flex; align-items: center; gap: 6px; }
  .seg button:first-child { border-left: 1px solid var(--line); }
  .seg button.sel { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg button svg { width: 16px; height: 16px; }
  #boost-btn { border: none; background: var(--green); color: #fff; font-size: 12.5px; font-weight: 800; padding: 0 12px; min-height: 36px; display: flex; align-items: center; gap: 6px; }
  #boost-btn svg { width: 16px; height: 16px; }
  #boost-btn .badge { font-size: 9px; padding: 2px 5px; background: rgba(255,255,255,0.25); letter-spacing: 0.3px; }
  #boost-btn:disabled { opacity: 0.45; }
  #palette { flex: none; display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 12px 14px 14px; touch-action: pan-x; }
  #palette::-webkit-scrollbar { display: none; }
  #play.land #palette { flex: 1; min-height: 0; flex-wrap: wrap; align-content: flex-start; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; padding: 12px 6px 10px; }
  #play.land #mode-row { flex-direction: column; align-items: stretch; padding: 0 6px; }
  #play.land #mode-row .seg { width: 100%; } #play.land #mode-row .seg button { flex: 1; justify-content: center; }
  .sw { flex: none; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(28,26,22,0.08); position: relative; transition: transform 0.15s ease; }
  .sw.sel { transform: scale(1.14); outline: 3px solid var(--ink); outline-offset: 2px; }
  .sw.done { opacity: 0.42; }
  .sw .cnt { position: absolute; right: -3px; top: -3px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .sw svg { width: 20px; height: 20px; stroke-width: 3; }

  /* ── completion ── */
  #done-panel { position: fixed; left: 50%; bottom: calc(18px + var(--sab)); transform: translateX(-50%); width: min(340px, calc(100vw - 24px)); background: rgba(28,26,22,0.95); color: #fff; padding: 16px 16px 14px; text-align: center; z-index: 20; animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes rise { from { transform: translateX(-50%) translateY(60px); opacity: 0; } }
  #done-panel h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #done-panel h2 svg { width: 26px; height: 26px; color: #ffc94d; }
  #done-panel p { font-size: 14px; color: rgba(255,255,255,0.72); margin-top: 3px; }
  #done-panel .row2 { display: flex; gap: 8px; margin-top: 13px; }
  #done-panel .row2 button { flex: 1; padding: 12px 6px; font-size: 14px; font-weight: 800; min-height: 46px; }
  #btn-next { background: var(--accent); color: #fff; }
  #btn-gallery { background: #ffc94d; color: #3a2c10; }
  #btn-again { background: rgba(255,255,255,0.14); color: #fff; }
  #done-panel button:active { transform: scale(0.96); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 19; }

  /* ── cover still ── */
  #play.cover #play-head, #play.cover #foot, #play.cover #zoom-ctrl, #play.cover .lbl { display: none; }
  #play.cover #art-vp { border: none; }
  #play.cover { grid-template-rows: 1fr; grid-template-columns: 1fr; grid-template-areas: "art"; }
  #cover-badge { position: fixed; z-index: 35; left: 50%; bottom: 8%; transform: translateX(-50%); background: rgba(253,252,249,0.96); border: 1px solid var(--line); padding: 24px 44px 26px; text-align: center; }
  #cover-badge .k { font-size: 16px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  #cover-badge h1 { font-size: 60px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin-top: 6px; white-space: nowrap; }
  .pressable { transition: transform 0.08s ease-out; }
  .pressable:active { transform: scale(0.95); }
</style>
</head>

<svg id="defs" aria-hidden="true">
  <!-- Stroked icons drawn for this game (rule 4.3.2: no emoji) -->

<script>
(function () {
  'use strict';
  var GAME_VERSION = '1.0.0';
  var GAME_TITLE = 'Cozy Coloring';
  var NS = 'http://www.w3.org/2000/svg';
  var CP = window.ColoringPics, PICS = CP.ORDER;
  var hash = location.hash || '';
  var DEBUG = hash.indexOf('debug') >= 0;
  var COVER = hash.indexOf('cover') >= 0;
  var $ = function (id) { return document.getElementById(id); };
  function safe(fn, dflt) { try { return fn(); } catch (e) { return dflt; } }

  // ---------- Bridge SDK adapter ----------
  var B = window.bridge || null;
  var bridgeReady = false, isDesktop = false, isWeb = true;

  // ---------- persistent state (Bridge storage only; rule 3.2.1) ----------
  // progress.fills[id] = [piece indexes colored by number]   progress.free[id] = { index: colorIndex }
  // progress.mode[id] = 'free' | undefined   progress.done[id] = timestamp   progress.unlocked[id] = 1 (ad unlock)
  // progress.boost[id] = 1 (the one-per-picture "fill this color" ad was used)   progress.last[id] = timestamp
  var store = {
    progress: { v: 1, fills: {}, free: {}, mode: {}, done: {}, unlocked: {}, boost: {}, last: {}, played: 0 },
    settings: { v: 1, muted: false }
  };
  function parseVal(v, dflt) {
    if (v === null || v === undefined) return dflt;
    if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return dflt; } }

  document.addEventListener('visibilitychange', function () {
    var hidden = document.visibilityState === 'hidden';

    if (hidden && saveT) saveStore(['progress']);
    if (!hidden && snd.unlocked && audibleNow() && snd.ctx && snd.ctx.state === 'suspended') safe(function () { snd.ctx.resume(); });
  });

  // ---------- boot: Bridge first, saved state, first frame, then game_ready ----------

        isWeb = safe(function () { return B.platform.id === 'mock'; }, true);
        setReason('platform', safe(function () { return B.platform.isAudioEnabled === false; }, false));
        setReason('paused', safe(function () { return B.platform.isPaused === true; }, false));

      layout();
      renderHome();

      fetchAudio();

  }
  function setupCover() {

    var fills = new Map(); pic.rg.forEach(function (rg, i) { if (i < pic.rg.length * 0.62 || rg.c === 6) fills.set(i, rg.c - 1); });
    store.progress.fills[pic.id] = Array.from(fills.keys()); store.progress.unlocked[pic.id] = 1;

  }

      open: function (id) { openPic(id === 'daily' ? dailyPic(dayKey()) : PICS.filter(function (p) { return p.id === id; })[0]); },
      openDaily: function () { openPic(dailyPic(dayKey())); }, dailyPic: dailyPic, dayKey: dayKey, genDaily: CP.genDaily,
      select: pickColor, setMode: setMode, tap: function (i) { tapRegion(i, null); }, goHome: goHome, zoomAt: zoomAt, resetZoom: resetZoom,
      isLocked: function (id) { return isLocked(PICS.filter(function (p) { return p.id === id; })[0]); }, firstLocked: function () { var f = firstLocked(); return f ? f.id : null; },
      requestBoost: requestBoost, requestUnlock: function (id) { requestUnlock(PICS.filter(function (p) { return p.id === id; })[0]); }, onRewardedState: onRewardedState, adStateChanged: adStateChanged,
      saveStore: saveStore, layout: layout, toggleMute: toggleMute, renderHome: renderHome,
      // screen coordinates of a piece's number label (a visible point of the piece) — the robot taps here
      labelPoint: function (i) { var p = cur.view.pts[i]; var sp = cur.view.svg.createSVGPoint(); sp.x = p.x; sp.y = p.y; var m = cur.view.svg.getScreenCTM(); var q = sp.matrixTransform(m); return { x: q.x, y: q.y }; },
      swatchRect: function (ci) { var b = paletteEl.children[ci].getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2, w: b.width, h: b.height, left: b.left, right: b.right, top: b.top, bottom: b.bottom }; },
      rect: function (id) { var b = $(id).getBoundingClientRect(); return { left: b.left, top: b.top, right: b.right, bottom: b.bottom, w: b.width, h: b.height }; },
      __openPic: openPic, get confetti() { return parts.length; }, get ads() { return (window.__ads || []).slice(); }, version: GAME_VERSION

  }
