<!DOCTYPE html>
<html lang="en">
<head>
<!-- Playgama Bridge SDK must be the first script in <head>, loaded normally (SDK required step 2).
     Local copy of npm @playgama/bridge (see CREDITS.md) so the archive ships everything it needs (rule 1.2.5). -->
<script src="playgama-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mole Mash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #7ec850;
  }
  body {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  #game { display: block; position: fixed; inset: 0; touch-action: none; }
  #sa-probe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  /* ── loading screen (first thing on screen, hidden right before game_ready) ── */
  #loading {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #7ec850; color: #3d2812;
  }
  #loading.hidden { display: none; }
  #loading .ttl { font: 800 34px "Arial Black", Impact, -apple-system, sans-serif; letter-spacing: 1px; color: #fff6ea; text-shadow: 0 2px 0 #8a5a34; }
  #loading .bar { width: 160px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.18); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; border-radius: 4px; background: #ffc94d; animation: load 1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-40%); } to { transform: translateX(380%); } }
  /* ── corner buttons (mute / pause) — 44×44, inside the safe area ── */
  .corner {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    width: 44px; height: 44px; border-radius: 12px; border: none;
    background: rgba(61,40,18,0.78); color: #fff6ea;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
  }
  .corner svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .corner.hidden { display: none; }
  #mute-btn { right: calc(env(safe-area-inset-right, 0px) + 8px); }
  #pause-btn { right: calc(env(safe-area-inset-right, 0px) + 60px); }
  #mute-btn .on, #mute-btn .off { display: none; }
  #mute-btn[data-muted="0"] .on { display: block; }
  #mute-btn[data-muted="1"] .off { display: block; }
  /* ── panels (game over / pause) ── */
  .panel {
    position: fixed; z-index: 25;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(340px, calc(100vw - 24px));
    max-height: calc(100% - 24px);
    overflow-y: auto;
    background: rgba(46, 28, 16, 0.96);
    color: #fff;
    border-radius: 16px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  .panel.hidden { display: none; }
  .ttl-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 24px; font-weight: 800; }
  .ttl-row svg { width: 26px; height: 26px; flex: none; }
  #over-score { font-size: 36px; font-weight: 800; margin-top: 2px; color: #ffc94d; }
  #over-sub { font-size: 15px; margin-top: 4px; min-height: 18px; color: rgba(255,255,255,0.75); }
  #over-sub.newbest { color: #ffc94d; font-weight: 700; }
  #board-title { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.6); text-align: left; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
  #board-title svg { width: 14px; height: 14px; }
  #rank-board {
    margin: 6px 0 8px;
    max-height: min(158px, 26vh); overflow-y: auto;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 14px;
  }
  .rank-row { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); color: rgba(255,255,255,0.7); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(255, 201, 77, 0.2); color: #fff; font-weight: 700; animation: mepulse 1.2s ease-in-out 3; }
  @keyframes mepulse { 50% { background: rgba(255, 201, 77, 0.45); } }
  .rank-pos { width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #4a2d10; background: rgba(255,255,255,0.18); flex: none; font-variant-numeric: tabular-nums; }
  .rank-pos.m1 { background: #ffc94d; } .rank-pos.m2 { background: #d9dde3; } .rank-pos.m3 { background: #d59b63; }
  .rank-pos.mx { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
  #rank-line { margin-top: 6px; font-size: 15px; font-weight: 700; color: #fff; }
  #rank-line.best { color: #ffc94d; font-size: 18px; }
  #next-target { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
  #name-row { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 10px; }
  #name-input {
    width: 100px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff; font-size: 14px; padding: 6px 8px; text-align: center;
    -webkit-user-select: text; user-select: text;
  }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .btns button {
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    min-height: 46px; padding: 10px 12px; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit;
  }
  .btns button svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btns button.hidden { display: none; }
  .btn-main { background: #ffc94d; color: #4a2d10; }
  .btn-ad { background: #3f9e3f; color: #fff; }
  .btn-ad small { font-weight: 600; opacity: 0.85; font-size: 12px; }
  .btn-ghost { background: rgba(255,255,255,0.14); color: #fff; }
  #ad-note { font-size: 12px; color: #ff8f7a; min-height: 15px; margin-top: 7px; }
  /* gift box progress (results panel) */
  #box-row { margin: 10px 0 2px; text-align: left; }
  #box-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.75); }
  #box-head svg { width: 18px; height: 18px; flex: none; }
  #box-head b { color: #ffc94d; }
  #box-count { margin-left: auto; background: #ffc94d; color: #4a2d10; border-radius: 10px; padding: 1px 8px; font-weight: 800; font-size: 12px; }
  #box-count.hidden { display: none; }
  #box-bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.12); margin-top: 6px; overflow: hidden; }
  #box-bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #f08c1e, #ffc94d); transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
  #hammer-strip { display: flex; gap: 6px; justify-content: center; margin: 10px 0 6px; }
  #hammer-strip canvas { width: 46px; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 2px solid transparent; }
  #hammer-strip canvas.owned { cursor: pointer; }
  #hammer-strip canvas.equipped { border-color: #ffc94d; background: rgba(255,201,77,0.18); }
  #box-panel .gift, #reveal-panel .gift { display: block; margin: 6px auto 8px; }
  #box-sub, #reveal-sub { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: 12px; }
  #reveal-name { font-size: 22px; font-weight: 800; color: #ffc94d; margin: 4px 0 2px; }
  #reveal-canvas { width: 120px; height: 120px; display: block; margin: 4px auto 6px; }
  .btn-ad small { display: block; }
  .btn-ad .hrt { width: 16px; height: 16px; fill: #ff5f6e; stroke: none; margin: 0 1px; vertical-align: -2px; }
  .strip { display: flex; gap: 6px; justify-content: center; margin: 4px 0 10px; }
  .strip canvas { width: 40px; height: 40px; border-radius: 9px; background: rgba(255,255,255,0.08); border: 2px solid transparent; }
  .strip canvas.equipped { border-color: #ffc94d; }
  #world-title { margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.6); text-align: left; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
  #world-title svg { width: 14px; height: 14px; }
  #world-title.hidden, #world-board.hidden { display: none; }
  #world-board { margin: 6px 0 4px; max-height: min(150px, 24vh); overflow-y: auto; background: rgba(255,255,255,0.06); border-radius: 10px; font-size: 14px; }
  #share-note { font-size: 12px; color: #7ee787; min-height: 15px; margin-top: 6px; }
  #pause-title { margin-bottom: 14px; }
  .pause-keys { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 10px; }
</style>
</head>
<body>
<div id="loading"><div class="ttl">MOLE MASH</div><div class="bar"><i></i></div></div>
<div id="sa-probe"></div>
<canvas id="game"></canvas>

<button id="pause-btn" class="corner hidden" aria-label="Pause">
  <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
</button>
<button id="mute-btn" class="corner" data-muted="0" aria-label="Sound on/off">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="over-panel" class="panel hidden" role="dialog">
  <div class="ttl-row" id="over-title">
    <svg id="over-icon-time" viewBox="0 0 24 24" fill="none" stroke="#ffc94d" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></svg>
    <svg id="over-icon-heart" viewBox="0 0 24 24" fill="#ff5f6e" stroke="none"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8.1 3.6 4.5 7.2 4.5c2 0 3.4 1.1 4.3 2.3l-1.5 3.4 3 2.2-1.4 3.6 2.2-2.2L12 11.3l1.6-3.1C14.4 5.9 15.9 4.5 17.8 4.5c3.6 0 5.8 3.6 4.5 7.1C20.5 16.4 12 21 12 21z"/></svg>
    <span id="over-title-text">TIME'S UP!</span>
  </div>
  <div id="over-score"></div>
  <div id="rank-line"></div>
  <div id="next-target"></div>
  <div id="over-sub" class="hidden" style="display:none"></div>
  <div id="box-row">
    <div id="box-head"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc94d" stroke-width="2"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9c-2-4-6-4-6-1s4 1 6 1zm0 0c2-4 6-4 6-1s-4 1-6 1z"/></svg><span id="box-label">Gift box</span><span id="box-count" class="hidden">x1</span></div>
    <div id="box-bar"><i id="box-fill"></i></div>
    <div id="hammer-strip"></div>
  </div>
  <div id="world-title" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span>World top 10</span></div>
  <div id="world-board" class="hidden"></div>
  <div id="board-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v4a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg><span id="board-title-text">Top 5 runs on this device</span></div>
  <div id="rank-board"></div>
  <div id="name-row"><label for="name-input">Name</label><input id="name-input" maxlength="8" placeholder="Me" autocomplete="off"></div>
  <div class="btns">
    <button id="continue-btn" class="btn-ad hidden">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
      <span><b>Continue</b> with +10 s and <svg class="hrt" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.2 4.8 2.6 1.2-1.4 2.8-2.6 4.8-2.6 3.6 0 5.8 3.6 4.5 7.1C19.5 16.4 12 21 12 21z"/></svg><svg class="hrt" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.2 4.8 2.6 1.2-1.4 2.8-2.6 4.8-2.6 3.6 0 5.8 3.6 4.5 7.1C19.5 16.4 12 21 12 21z"/></svg><svg class="hrt" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.2 4.8 2.6 1.2-1.4 2.8-2.6 4.8-2.6 3.6 0 5.8 3.6 4.5 7.1C19.5 16.4 12 21 12 21z"/></svg><small>watch one ad, keep this run going</small></span>
    </button>
    <button id="retry-btn" class="btn-main">Play again</button>
    <button id="share-btn" class="btn-ghost"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share my score</button>
  </div>
  <div id="share-note"></div>
  <div id="ad-note"></div>
</div>

<div id="box-panel" class="panel hidden" role="dialog">
  <div class="ttl-row"><span>WHAT'S IN THE BOX?</span></div>
  <svg class="gift" width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#ffc94d" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2" fill="#e4342c" stroke="#8a1f18"/><path d="M12 9v12" stroke="#ffc94d" stroke-width="2.2"/><path d="M3 13h18" stroke="#ffc94d" stroke-width="2.2"/><path d="M12 9c-2-4-6-4-6-1s4 1 6 1zm0 0c2-4 6-4 6-1s-4 1-6 1z" fill="#ffc94d" stroke="#c98f08"/></svg>
  <div id="box-sub">A new hammer is inside. Open it now or keep the box for later.</div>
  <div id="box-strip" class="strip"></div>
  <div class="btns">
    <button id="open-box-btn" class="btn-ad"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span><b>Open it</b>: one ad, one new hammer<small>it goes in your collection below</small></span></button>
    <button id="open-free-btn" class="btn-main hidden">Open the box</button>
    <button id="later-btn" class="btn-ghost">Later (keep the box)</button>
  </div>
  <div id="box-note" class="" style="font-size:12px;color:#ff8f7a;min-height:15px;margin-top:7px"></div>
</div>

<div id="reveal-panel" class="panel hidden" role="dialog">
  <div class="ttl-row"><span>NEW HAMMER!</span></div>
  <canvas id="reveal-canvas" width="240" height="240"></canvas>
  <div id="reveal-name"></div>
  <div id="reveal-sub"></div>
  <div class="btns">
    <button id="equip-btn" class="btn-main">Equip and play</button>
    <button id="keep-btn" class="btn-ghost">Keep my hammer</button>
  </div>
</div>

<div id="pause-panel" class="panel hidden" role="dialog">
  <div class="ttl-row" id="pause-title"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc94d" stroke-width="2.4" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg><span>PAUSED</span></div>
  <div class="btns">
    <button id="resume-btn" class="btn-main"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg>Resume</button>
    <button id="pause-mute-btn" class="btn-ghost">Sound: on</button>
    <button id="quit-btn" class="btn-ghost">Quit to title</button>
  </div>
  <div class="pause-keys" id="pause-keys"></div>
</div>

<script>
(function () {
  'use strict';

  var GAME_VERSION = '1.3.1';
  var TIME_LIMIT = 60;           // seconds per round (player feedback 11-01: 45 felt too short)
  var HEAT_T = 45;               // the pace ramps over the first 45 s, then stays at full heat
  var CLOCK_TIME = 5;            // the clock mole adds five seconds
  var CONTINUE_SECONDS = 10;     // rewarded continue bonus
  var hash = location.hash || '';
  var DEBUG = hash.indexOf('debug') >= 0;
  var COVER = hash.indexOf('cover') >= 0;   // still frame for store covers

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var SA = { top: 0, right: 0, bottom: 0, left: 0 };   // safe-area insets (CSS px)
  var UI = 1;                                           // interface scale from the short side

  // ---------- Bridge SDK adapter ----------
  // bridge is the global from playgama-bridge.js. Outside a supported platform it runs its own mock
  // platform (safe defaults), so the same build runs in Playgama, the QA tool and a plain browser.
  var B = window.bridge || null;
  var bridgeReady = false;
  function safe(fn, dflt) { try { return fn(); } catch (e) { return dflt; } }

  // ---------- persistent state (Bridge storage only; rule 3.2.1) ----------
  // hammers: 'classic' is owned from the start, the other four come out of gift boxes
  var HAMMERS = [
    { id: 'classic', name: 'Carnival Classic', sub: 'The one you started with.' },
    { id: 'rubber', name: 'Squeaky Rubber', sub: 'Bouncy. Blue. Loud.' },
    { id: 'candy', name: 'Candy Cane', sub: 'Sticky, but it swings.' },
    { id: 'pan', name: 'Frying Pan', sub: 'Breakfast is served.' },
    { id: 'gold', name: 'Golden Mallet', sub: 'Shiny, heavy, showy.' }
  ];
  var BOX_GOAL_FIRST = 12, BOX_GOAL = 18;   // moles per gift box: the first box opens after a decent first round
  var store = {
    progress: { v: 2, best: 0, played: 0, ranks: [], name: '', hammers: ['classic'], equipped: 'classic', boxFill: 0, boxesReady: 0, boxesOpened: 0 },
    settings: { v: 1, muted: false }
  };
  function hammerById(id) { for (var i = 0; i < HAMMERS.length; i++) if (HAMMERS[i].id === id) return HAMMERS[i]; return HAMMERS[0]; }
  function ownedHammer(id) { return store.progress.hammers.indexOf(id) >= 0; }
  function allCollected() { return store.progress.hammers.length >= HAMMERS.length; }
  function boxGoal() { return store.progress.boxesOpened + store.progress.boxesReady === 0 ? BOX_GOAL_FIRST : BOX_GOAL; }
  function parseVal(v, dflt) {
    if (v === null || v === undefined) return dflt;
    if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return dflt; } }
    if (!v || typeof v !== 'object') return dflt;
    var out = {};
    for (var k in dflt) out[k] = (k in v) ? v[k] : dflt[k];
    return out;
  }
  function loadStore() {
    if (!bridgeReady) return Promise.resolve();
    return B.storage.get(['progress', 'settings']).then(function (data) {
      var p = parseVal(data[0], store.progress);
      p.best = Math.max(0, parseInt(p.best, 10) || 0);
      p.played = Math.max(0, parseInt(p.played, 10) || 0);
      p.name = String(p.name || '').slice(0, 8);
      p.v = 2;   // v1 saves get the hammer fields from the defaults above
      p.hammers = Array.isArray(p.hammers) ? p.hammers.filter(function (h) { return HAMMERS.some(function (x) { return x.id === h; }); }) : ['classic'];
      if (p.hammers.indexOf('classic') < 0) p.hammers.unshift('classic');
      p.equipped = p.hammers.indexOf(p.equipped) >= 0 ? p.equipped : 'classic';
      p.boxFill = Math.max(0, parseInt(p.boxFill, 10) || 0);
      p.boxesReady = Math.max(0, parseInt(p.boxesReady, 10) || 0);
      p.boxesOpened = Math.max(0, parseInt(p.boxesOpened, 10) || 0);
      p.ranks = Array.isArray(p.ranks) ? p.ranks
        .filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s); })
        .map(function (r) { return { n: String(r.n || 'Me').slice(0, 8), s: Math.max(0, Math.round(r.s)), t: r.t || 0 }; })
        .sort(function (a, b) { return b.s - a.s; }).slice(0, RANK_MAX) : [];
      store.progress = p;
      var s = parseVal(data[1], store.settings);
      s.muted = !!s.muted;
      store.settings = s;
    }).catch(function () { /* treat unreadable data as a new player */ });
  }
  var saveT = null;
  function saveStore(keys) {
    // one set() call with every changed key; only on meaningful changes (round end, name, mute)
    if (!bridgeReady) return;
    var vals = keys.map(function (k) { return JSON.stringify(store[k]); });

  // ---------- update ----------
  function update(dt) {
    if (frozen()) return;
    if (shake > 0) shake = Math.max(0, shake - dt * 26);
    if (heartFlash > 0) heartFlash = Math.max(0, heartFlash - dt * 2.5);
    if (flashA > 0) flashA = Math.max(0, flashA - dt * 1.6);
    for (var i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1.1) floats.splice(i, 1); }
    for (var j = mallets.length - 1; j >= 0; j--) { mallets[j].t += dt; if (mallets[j].t > 0.28) mallets.splice(j, 1); }
    for (var k = puffs.length - 1; k >= 0; k--) { puffs[k].t += dt; if (puffs[k].t > 0.5) puffs.splice(k, 1); }
    for (var rg = rings.length - 1; rg >= 0; rg--) { rings[rg].t += dt; if (rings[rg].t > 0.35) rings.splice(rg, 1); }
    for (var q = particles.length - 1; q >= 0; q--) {
      var pa = particles[q]; pa.t += dt; pa.vy += 900 * dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt;

    if (countIn > 0) { countIn -= dt; if (countIn <= 0) { countIn = 0; last = performance.now(); } return; }
    if (hitStop > 0) { hitStop -= dt; return; }

    timeLeft -= dt;

    if (timeLeft <= 0) { timeLeft = 0; gameOver('time'); return; }

      var mo = moles[m];
      mo.t += dt;
      if (mo.phase === 'rise') { mo.p += dt / 0.14; if (mo.p >= 1) { mo.p = 1; mo.phase = 'sink'; } }
      else if (mo.phase === 'sink') {
        mo.p -= dt / mo.stayT;
        if (mo.p <= 0) {
          var h = holes[mo.hole];
          if (mo.kind === 'mole' || mo.kind === 'gold') {   // a bomb or a clock sinking costs nothing
            if (onboarding()) floats.push({ x: h.x, y: h.y - moleH * 0.7, text: 'FASTER!', color: '#d1342a', t: 0, size: 22 });
            else loseLife('MISSED!', h.x, h.y - moleH * 0.7, '#d1342a');

        }

      spawnMole();
      spawnTimer = spawnGap() * (0.75 + Math.random() * 0.5);
    }
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  function heartPath(x, y, s) {

    ctx.bezierCurveTo(x + s * 0.9, y - s * 1.1, x + s * 1.6, y - s * 0.1, x, y + s * 0.95);
    ctx.closePath();
  }

      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);

      ctx.fillStyle = '#1c1c1c'; ctx.beginPath(); ctx.arc(x - s * 0.22, y + s * 0.02, s * 0.09, 0, 7); ctx.arc(x + s * 0.22, y + s * 0.02, s * 0.09, 0, 7); ctx.fill();
      ctx.fillStyle = '#e05a7a'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.26, s * 0.13, s * 0.09, 0, 0, 7); ctx.fill();
    } else if (kind === 'heart') {
      heartPath(x, y, s * 0.5); ctx.fillStyle = '#ff5f6e'; ctx.fill();
    } else if (kind === 'clock') {
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - s * 0.3); ctx.lineTo(x, y); ctx.lineTo(x + s * 0.25, y + s * 0.12); ctx.stroke();
    }
    ctx.restore();
  }
  function drawTitle() {
    if (!COVER) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(0, 0, W, H); }
    var signY = COVER ? hud.y + 8 : Math.max(tentH + SA.top + 14, H * 0.1);
    var after = drawSign(signY);
    if (COVER) return;
    var tapY = H - Math.max(44, H * 0.1) - SA.bottom;
    if (best() > 0) {
      ctx.fillStyle = 'rgba(61,40,18,0.75)'; ctx.font = fontPx(15); ctx.textAlign = 'center';
      ctx.fillText('Best: ' + best() + ' moles', W / 2, after + 24 * UI);
    }
    // the equipped hammer, bobbing under the sign
    ctx.save(); ctx.translate(W / 2, after + 92 * UI + Math.sin(performance.now() / 400) * 4); ctx.rotate(-0.5); ctx.scale(UI, UI);
    drawHammerShape(ctx, store.progress.equipped); ctx.restore();
    ctx.textBaseline = 'alphabetic';
    var a = 0.55 + 0.45 * Math.sin(performance.now() / 350);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#3d2812'; ctx.font = fontPx(22, 'bold'); ctx.textAlign = 'center';
    ctx.fillText(isDesktop ? 'CLICK OR PRESS SPACE' : 'TAP TO START', W / 2, tapY);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0 && !frozen()) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackdrop();
    for (var i = 0; i < holes.length; i++) drawHoleBack(holes[i]);
    for (var m = 0; m < moles.length; m++) drawMole(moles[m]);
    for (var j = 0; j < holes.length; j++) drawHoleFront(holes[j], j);
    for (var p = 0; p < puffs.length; p++) drawPuff(puffs[p]);
    for (var rg2 = 0; rg2 < rings.length; rg2++) {
      var ring = rings[rg2], rk = ring.t / 0.35;
      ctx.save(); ctx.globalAlpha = 1 - rk; ctx.strokeStyle = ring.big ? '#ff7a1a' : '#fff'; ctx.lineWidth = (ring.big ? 10 : 6) * (1 - rk) + 1;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, (ring.big ? 40 : 18) + rk * (ring.big ? 160 : 70), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    for (var pt = 0; pt < particles.length; pt++) {
      var pa = particles[pt];
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - pa.t / pa.life); ctx.fillStyle = pa.color;
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    for (var mk = 0; mk < mallets.length; mk++) drawMallet(mallets[mk]);
    for (var f = 0; f < floats.length; f++) {
      var fl = floats[f], pop = 1 + 0.55 * Math.max(0, 1 - fl.t / 0.18);
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1.1 - fl.t) / 0.4);
      ctx.fillStyle = fl.color; ctx.font = 'bold ' + Math.round(fl.size * pop * UI) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
      ctx.textAlign = 'center';
      var fy = fl.y - fl.t * 46;
      if (fl.icon === 'heart') { ctx.fillText(fl.text, fl.x - 12 * UI, fy); heartPath(fl.x + 8 * UI, fy - 7 * UI, 8 * pop * UI); ctx.fill(); }
      else ctx.fillText(fl.text, fl.x, fy);
      ctx.restore();
    }
    if (flashA > 0) { ctx.fillStyle = 'rgba(' + flashColor + ',' + flashA.toFixed(3) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    if (state === STATE_PLAY) {
      drawHud();
      if (introT > 0 && !frozen()) {
        var blink = 0.55 + 0.45 * Math.sin(performance.now() / 90);
        ctx.save(); ctx.globalAlpha = Math.min(1, introT / 0.35) * blink;
        ctx.fillStyle = '#d1342a'; ctx.font = fontPx(26, 'bold'); ctx.textAlign = 'center';
        var msg = tutorial ? 'TAP THE MOLE!' : 'TAP THE MOLES!';
        var by = grid.y + 30 * UI, bwid = ctx.measureText(msg).width + 36 * UI;
        ctx.fillStyle = 'rgba(255,246,234,0.92)'; roundRect(W / 2 - bwid / 2, by - 24 * UI, bwid, 34 * UI, 17 * UI); ctx.fill();
        ctx.fillStyle = '#d1342a'; ctx.fillText(msg, W / 2, by);
        ctx.restore();
      }
      if (timeLeft <= 10 && timeLeft > 0 && !frozen() && countIn <= 0) {
        // last ten seconds: a big number in the middle of the board, popping on every second
        var sec = Math.ceil(timeLeft), frac2 = sec - timeLeft, pop2 = 1 + 0.35 * Math.max(0, 1 - frac2 / 0.25);
        ctx.save();
        ctx.globalAlpha = 0.9; ctx.textAlign = 'center';
        ctx.font = 'bold ' + Math.round(72 * UI * pop2) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.lineWidth = 8 * UI; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.fillStyle = sec <= 5 ? '#e4342c' : '#f08c1e';
        var cy2 = Math.max(grid.y + 62 * UI, holes[0].y - moleH - 22 * UI);   // just above the top row, never over a mole
        ctx.strokeText(String(sec), W / 2, cy2); ctx.fillText(String(sec), W / 2, cy2);
        ctx.restore();
      }
      if (countIn > 0 && !frozen()) drawCountIn();
      if (userPaused || frozen()) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    } else if (state === STATE_TITLE) {
      drawTitle();
    } else if (state === STATE_OVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-20, -20, W + 40, H + 40);
    }
  }

  // ---------- performance sample (telemetry guide): aggregated over ~30 s of visible gameplay ----------
  var perf = { frames: [], activeMs: 0, windowStart: 0 };
  function perfFrame(dtMs) {
    if (state !== STATE_PLAY || frozen()) return;
    if (!perf.windowStart) perf.windowStart = performance.now();
    perf.frames.push(dtMs); perf.activeMs += dtMs;
    if (perf.activeMs >= 30000) perfFlush();
  }
  function perfFlush() {
    var fr = perf.frames; if (fr.length < 10) { perf.frames = []; perf.activeMs = 0; perf.windowStart = 0; return; }
    var sorted = fr.slice().sort(function (a, b) { return a - b; });
    var pct = function (p) { return sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))]; };
    var fpsList = fr.map(function (d) { return 1000 / Math.max(1, d); }).sort(function (a, b) { return a - b; });
    var over = function (ms) { var n = 0; for (var i = 0; i < fr.length; i++) if (fr[i] > ms) n++; return n; };
    analytics('performance_sample', {
      target_fps: 60, window_ms: Math.round(performance.now() - perf.windowStart), active_ms: Math.round(perf.activeMs),
      frame_count: fr.length, fps_avg: Math.round(1000 / (perf.activeMs / fr.length) * 10) / 10,
      fps_p10: Math.round(fpsList[Math.floor(0.1 * fpsList.length)] * 10) / 10,
      frame_time_p50_ms: Math.round(pct(0.5) * 10) / 10, frame_time_p95_ms: Math.round(pct(0.95) * 10) / 10,
      frame_time_p99_ms: Math.round(pct(0.99) * 10) / 10, frame_time_max_ms: Math.round(sorted[sorted.length - 1] * 10) / 10,
      frames_over_50ms: over(50), frames_over_100ms: over(100), frames_over_250ms: over(250), frames_over_500ms: over(500), frames_over_1000ms: over(1000),
      game_version: GAME_VERSION
    });
    perf.frames = []; perf.activeMs = 0; perf.windowStart = 0;
  }

  // ---------- loop ----------
  var last = performance.now();
  function loop(now) {
    var rawDt = now - last;
    var dt = Math.min(rawDt / 1000, 0.05);
    last = now;
    perfFrame(Math.min(rawDt, 1000));
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- boot: Bridge first, then saved state, then the first playable frame, then game_ready ----------
  function boot() {
    var init = B ? B.initialize().then(function () { bridgeReady = true; }).catch(function () { bridgeReady = false; }) : Promise.resolve();
    init.then(function () {
      if (bridgeReady) {
        // language: English is the only localization, so platform.language only confirms the fallback (rule 3.4)
        safe(function () { return B.platform.language; }, 'en');
        isDesktop = safe(function () { return B.device.type === 'desktop'; }, false);
        // platform audio/pause state: apply the current value, then follow the events (step 5, rule 3.3.4)
        setReason('platform', safe(function () { return B.platform.isAudioEnabled === false; }, false));
        setReason('paused', safe(function () { return B.platform.isPaused === true; }, false));
        adStateChanged(safe(function () { return B.advertisement.interstitialState; }, '') === 'opened' || safe(function () { return B.advertisement.rewardedState; }, '') === 'opened' ? 'opened' : 'closed');
        safe(function () {
          B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, function (enabled) { setReason('platform', !enabled); });
          B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, function (paused) {
            setReason('paused', !!paused);
            if (paused && state === STATE_PLAY) pauseGame(true);
            if (!paused) last = performance.now();
          });
          B.advertisement.on(B.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, adStateChanged);
          B.advertisement.on(B.EVENT_NAME.REWARDED_STATE_CHANGED, onRewardedState);
          if (B.device && B.device.on) {
            B.device.on(B.EVENT_NAME.SCREEN_SIZE_CHANGED, resize);
            B.device.on(B.EVENT_NAME.ORIENTATION_STATE_CHANGED, resize);
          }
        });
      }
      var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (!isDesktop) isDesktop = !touch && !!(window.matchMedia && matchMedia('(pointer:fine)').matches);
      if (touch) isDesktop = false;
      return loadStore();
    }).then(function () {
      setReason('user', !!store.settings.muted);
      renderMute();
      nameInput.value = store.progress.name;
      resize();
      if (COVER) setupCover();
      draw();                                  // first playable frame is on screen …
      document.getElementById('loading').classList.add('hidden');
      requestAnimationFrame(loop);
      sendMsg('game_ready');                   // … then tell the platform (step 6)
      fetchAudio();                            // music and effects load after game_ready
      if (DEBUG) installDebug();
    });
  }

  function setupCover() {
    // still frame for covers: title sign over a lively board
    document.getElementById('mute-btn').classList.add('hidden');
    [[0, 'mole'], [4, 'gold'], [7, 'mole'], [2, 'bomb']].forEach(function (d) {
      moles.push({ hole: d[0], kind: d[1], phase: 'sink', p: 1, stayT: 9e9, t: 0, face: 1 });
    });
    state = STATE_TITLE;
  }

  function installDebug() {
    window.__game = {
      get state() { return state; }, get score() { return score; }, get lives() { return lives; },
      get timeLeft() { return timeLeft; }, set timeLeft(v) { timeLeft = v; }, get countIn() { return countIn; }, set countIn(v) { countIn = v; },
      get moles() { return moles; }, get holes() { return holes; }, get hud() { return hud; }, get grid() { return grid; },
      get store() { return store; }, get bridgeReady() { return bridgeReady; }, get audible() { return snd.audible; },
      get reasons() { return snd.reasons; }, get frozen() { return frozen(); }, get userPaused() { return userPaused; },
      get continueUsed() { return continueUsed; }, get tutorial() { return tutorial; }, get isDesktop() { return isDesktop; },
      get bufs() { return Object.keys(snd.bufs); }, get bgmPlaying() { return !!snd.bgm; }, get ctxState() { return snd.ctx ? snd.ctx.state : 'none'; },
      holeCenter: function (i) { var h = holes[i]; return { x: h.x, y: h.y - moleH * 0.4 }; },
      whackAt: whackAt, tryStart: tryStart, spawnMole: spawnMole, pauseGame: pauseGame, resumeGame: resumeGame,
      gameOver: gameOver, onRewardedState: onRewardedState, adStateChanged: adStateChanged, setReason: setReason,
      requestContinue: requestContinue, resize: resize, perfFlush: perfFlush,
      nextRound: nextRound, requestOpenBox: requestOpenBox, feedBox: feedBox, equipHammer: equipHammer, saveStore: saveStore,
      get hammers() { return HAMMERS.map(function (h) { return h.id; }); }, get whacked() { return whacked; }, get combo() { return combo; },
      get rewardEarned() { return rewardEarned; }, get lbType() { return lbType(); }
    };
  }

  boot();
})();
</script>
